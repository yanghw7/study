<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4b6bfb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 검색">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>AI 검색</title>
<style>
:root{--bg:#fff;--fg:#1f1f1f;--muted:#6b7280;--card:#f3f4f8;--border:#e1e3ea;--accent:#4b6bfb;--accent-soft:#e8ecff;--danger:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#121317;--fg:#ececf1;--muted:#9aa0ad;--card:#1d1f26;--border:#2c2f39;--accent:#7b93ff;--accent-soft:#232a4a;--danger:#ff6b70}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{border:0;font:inherit;color:inherit;cursor:pointer;border-radius:999px;background:none}
textarea{width:100%;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;line-height:1.5;padding:6px 0;resize:none;max-height:140px}
a{color:var(--accent)}
.topbar{flex:none;display:flex;gap:8px;align-items:flex-start;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;border-bottom:1px solid var(--border);background:var(--bg)}
.menu-btn{flex:none;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border);font-size:18px}
.menu-btn:hover{border-color:var(--accent)}
#f{flex:1;min-width:0;display:flex;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:3px 4px 3px 16px;align-items:flex-start}
#f:focus-within{border-color:var(--accent)}
.go{flex:none;background:var(--accent);color:#fff;font-weight:600;font-size:15px;padding:9px 18px;margin-top:2px}
.go:disabled{opacity:.6}
.layout{flex:1;min-height:0;display:flex;position:relative}
aside{flex:none;width:300px;overflow-y:auto;border-right:1px solid var(--border);padding:12px;background:var(--bg)}
main{flex:1;min-width:0;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column}
.backdrop{display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:15}
@media (min-width:721px){ body.side-hidden aside{display:none} }
@media (max-width:720px){
  aside{position:absolute;top:0;bottom:0;left:0;z-index:20;width:min(88vw,340px);transform:translateX(-102%);transition:transform .25s ease}
  body.drawer-open aside{transform:none;box-shadow:0 0 30px rgba(0,0,0,.3)}
  body.drawer-open .backdrop{display:block}
}
.label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
.cur-body{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 12px}
.cur-body.none{color:var(--muted);background:transparent;border-color:var(--border)}
.sect{margin-bottom:18px}
ul.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.plist li.active{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.note{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.5}
.admin-link{display:inline-block;margin-top:8px;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px}
.admin-link:hover{border-color:var(--accent);color:var(--accent)}
#result{flex:1;min-height:0;display:flex;flex-direction:column}
#result[hidden]{display:none}
.fill{flex:1;min-height:0;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.frame{position:absolute;left:0;width:100%;border:0;background:var(--card)}
.newtab{position:absolute;right:14px;bottom:14px;background:var(--bg);color:var(--fg);border:1px solid var(--border);font-size:12px;padding:6px 12px;text-decoration:none;opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.res-q{font-size:13px;color:var(--muted);margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.answer{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;font-size:15px;line-height:1.65;word-break:break-word}
.answer h3,.answer h4{margin:16px 0 6px;font-size:16px}
.answer p{margin:0 0 10px}
.answer ul,.answer ol{margin:0 0 10px;padding-left:22px}
.answer code{background:var(--border);padding:1px 5px;border-radius:5px;font-size:13px}
.answer .tbl{overflow-x:auto;margin:0 0 10px}
.answer table{border-collapse:collapse;font-size:14px}
.answer th,.answer td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.loading{color:var(--muted);padding:18px;text-align:center}
.err{color:var(--danger);background:var(--card);border:1px solid var(--danger);border-radius:14px;padding:14px 16px;font-size:14px;white-space:pre-wrap}
.sources{margin-top:12px}
.sources a{display:inline-block;margin:0 6px 6px 0;padding:5px 12px;border:1px solid var(--border);border-radius:999px;font-size:13px;text-decoration:none;color:var(--fg);background:var(--bg)}
.open-link{display:inline-block;margin-top:6px;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <button type="button" class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
  <form id="f">
    <textarea id="q" rows="1" placeholder="검색할 내용 (Enter: 검색 / Shift+Enter: 줄바꿈)" autofocus></textarea>
    <button type="submit" class="go" id="goBtn">검색</button>
  </form>
</div>

<div class="layout">
  <aside id="side">
    <div class="sect">
      <div class="label">현재 적용된 프롬프트</div>
      <div class="cur-body" id="curBody">불러오는 중…</div>
      <div class="note" id="syncNote"></div>
      <a class="admin-link" href="./admin.html">⚙️ 관리자 페이지</a>
    </div>
    <div class="sect">
      <div class="label">전체 프롬프트</div>
      <ul class="plist" id="list"></ul>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main>
    <section id="result" hidden></section>
  </main>
</div>

<script>
(function(){
  var API = 'https://api.github.com/repos/yanghw7/study/contents/save/settings.json';
  var CACHE = 'aimode_remote_cache_v1';
  var IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var mq = window.matchMedia("(max-width:720px)");

  var $ = function(id){ return document.getElementById(id); };
  var q = $("q"), result = $("result"), goBtn = $("goBtn");
  var data = loadCache() || {prompts:[], activeId:null, model:'gemini-2.0-flash', key:'', cropTop:0, cropBottom:100};
  var mode = localStorage.getItem('aimode_mode_v1') || (IS_MOBILE ? 'api' : 'frame');
  var ui = {side:true};

  function loadCache(){ try{ return JSON.parse(localStorage.getItem(CACHE)); }catch(e){ return null; } }
  function saveCache(d){ try{ localStorage.setItem(CACHE, JSON.stringify(d)); }catch(e){} }

  function active(){
    for(var i=0;i<data.prompts.length;i++) if(data.prompts[i].id === data.activeId) return data.prompts[i];
    return data.prompts[0] || null;
  }

  function render(){
    var a = active();
    var cb = $('curBody');
    if(a){
      cb.className = 'cur-body'; cb.textContent = a.text;
    }else{
      cb.className = 'cur-body none';
      cb.textContent = '설정된 프롬프트가 없어요. 관리자 페이지에서 추가해 주세요.';
    }
    var list = $('list'); list.innerHTML = '';
    data.prompts.forEach(function(p){
      var li = document.createElement('li');
      if(p.id === data.activeId) li.className = 'active';
      li.textContent = p.text;
      list.appendChild(li);
    });
  }

  async function pull(){
    $('syncNote').textContent = 'GitHub에서 불러오는 중…';
    try{
      var r = await fetch(API + '?t=' + Date.now(), {headers:{Accept:'application/vnd.github+json'}, cache:'no-store'});
      if(r.status === 404){
        $('syncNote').textContent = 'GitHub에 설정 파일이 아직 없어요. 관리자 페이지에서 먼저 저장해 주세요.';
        return;
      }
      if(!r.ok){
        $('syncNote').textContent = '불러오기 실패 (' + r.status + ') · 이전 캐시 사용';
        return;
      }
      var j = await r.json();
      var bin = atob((j.content||'').replace(/\s/g,''));
      var bytes = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      var fresh = JSON.parse(new TextDecoder().decode(bytes));
      if(!Array.isArray(fresh.prompts)) fresh.prompts = [];
      if(fresh.model == null) fresh.model = 'gemini-2.0-flash';
      if(fresh.key == null) fresh.key = '';
      if(fresh.cropTop == null) fresh.cropTop = 0;
      if(fresh.cropBottom == null) fresh.cropBottom = 100;
      data = fresh; saveCache(data);
      $('syncNote').textContent = '최신 설정 · ' + new Date().toLocaleTimeString();
      render();
    }catch(e){
      $('syncNote').textContent = '오프라인 · 캐시 사용 중';
    }
  }

  /* 아코디언 없이 단순 렌더 */
  $('menuBtn').addEventListener('click', function(){
    if(mq.matches) document.body.classList.toggle('drawer-open');
    else { ui.side = !ui.side; document.body.classList.toggle('side-hidden', !ui.side); }
  });
  $('backdrop').addEventListener('click', function(){ document.body.classList.remove('drawer-open'); });

  /* 마크다운 */
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
  }
  function md(src){
    var lines = src.replace(/\r/g,'').split("\n"), out = [], i = 0, lst = null;
    function closeList(){ if(lst){ out.push("</" + lst + ">"); lst = null; } }
    while(i < lines.length){
      var l = lines[i], m;
      if(/^\s*\|.*\|\s*$/.test(l)){
        closeList();
        var rows = [];
        while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
        rows = rows.filter(function(r){ return !/^\s*\|[\s:\-|]+\|\s*$/.test(r); });
        var html = '<div class="tbl"><table>';
        rows.forEach(function(r, ri){
          var cells = r.trim().replace(/^\||\|$/g,'').split("|");
          html += "<tr>" + cells.map(function(c){ var t = ri===0 ? "th" : "td"; return "<" + t + ">" + inline(c.trim()) + "</" + t + ">"; }).join("") + "</tr>";
        });
        out.push(html + "</table></div>");
        continue;
      }
      if((m = l.match(/^\s*(#{1,4})\s+(.*)$/))){ closeList(); out.push((m[1].length<=2?"<h3>":"<h4>") + inline(m[2]) + (m[1].length<=2?"</h3>":"</h4>")); }
      else if((m = l.match(/^\s*[-*•]\s+(.*)$/))){ if(lst!=="ul"){ closeList(); out.push("<ul>"); lst="ul"; } out.push("<li>"+inline(m[1])+"</li>"); }
      else if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(lst!=="ol"){ closeList(); out.push("<ol>"); lst="ol"; } out.push("<li>"+inline(m[1])+"</li>"); }
      else if(!l.trim()){ closeList(); }
      else{ closeList(); out.push("<p>"+inline(l)+"</p>"); }
      i++;
    }
    closeList();
    return out.join("");
  }

  function applyCrop(fr){
    fr.style.top = (-data.cropTop) + "px";
    fr.style.height = "calc(100% + " + (data.cropTop + data.cropBottom) + "px)";
  }

  function buildQuery(text){
    var a = active();
    if(!a) return text;
    return a.text + (/\s$/.test(a.text) ? "" : "\n") + text;
  }
  function showResult(node){ result.hidden = false; result.innerHTML = ""; result.appendChild(node); }
  function div(cls, html){ var d = document.createElement('div'); d.className = cls; if(html != null) d.innerHTML = html; return d; }

  async function search(){
    var text = q.value.trim(); if(!text) return;
    document.body.classList.remove('drawer-open');
    var full = buildQuery(text);

    if(mode !== "api"){
      var url = "https://www.google.com/search?udm=50&q=" + encodeURIComponent(full);
      var w = div("fill");
      var fr = document.createElement("iframe");
      fr.className = "frame"; fr.src = url; applyCrop(fr);
      w.appendChild(fr);
      var nt = document.createElement("a");
      nt.className = "newtab"; nt.target = "_blank"; nt.rel = "noopener noreferrer"; nt.href = url;
      nt.textContent = "새 탭에서 열기 ↗";
      w.appendChild(nt); showResult(w); return;
    }

    if(!data.key){
      showResult(div("err", "관리자가 아직 Gemini API 키를 설정하지 않았어요."));
      return;
    }
    goBtn.disabled = true; goBtn.textContent = "검색 중…";
    showResult(div("loading", "검색 중입니다…"));
    try{
      var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(data.model || 'gemini-2.0-flash') + ":generateContent", {
        method: "POST",
        headers: {"Content-Type": "application/json", "x-goog-api-key": data.key},
        body: JSON.stringify({contents: [{role:"user", parts:[{text: full}]}], tools:[{google_search:{}}]})
      });
      var jd = await res.json();
      if(!res.ok) throw new Error((jd.error && jd.error.message) || ("요청 실패 (" + res.status + ")"));
      var cand = jd.candidates && jd.candidates[0];
      var parts = (cand && cand.content && cand.content.parts) || [];
      var answer = parts.filter(function(p){ return p.text && !p.thought; }).map(function(p){ return p.text; }).join("");
      if(!answer) throw new Error("응답이 비어 있어요.");

      var wrap = document.createElement("div");
      var rq = div("res-q"); rq.textContent = "Q. " + text; wrap.appendChild(rq);
      wrap.appendChild(div("answer", md(answer)));

      var chunks = (cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || [];
      var seen = {}, links = [];
      chunks.forEach(function(c){
        if(c.web && /^https?:\/\//.test(c.web.uri) && !seen[c.web.uri]){ seen[c.web.uri]=1; links.push(c.web); }
      });
      if(links.length){
        var src = div("sources"); src.appendChild(div("label", "출처"));
        links.forEach(function(wl){
          var a = document.createElement("a");
          a.href = wl.uri; a.target="_blank"; a.rel="noopener noreferrer";
          a.textContent = wl.title || wl.uri; src.appendChild(a);
        });
        wrap.appendChild(src);
      }
      var o = document.createElement("a");
      o.className = "open-link"; o.target="_blank"; o.rel="noopener noreferrer";
      o.href = "https://www.google.com/search?udm=50&q=" + encodeURIComponent(full);
      o.textContent = "Google AI 모드에서 같은 질문 열기 ↗";
      wrap.appendChild(o);
      showResult(wrap);
    }catch(err){
      showResult(div("err", "오류: " + (err && err.message ? err.message : err)));
    }finally{
      goBtn.disabled = false; goBtn.textContent = "검색";
    }
  }

  $("f").addEventListener("submit", function(e){ e.preventDefault(); search(); });
  q.addEventListener("input", function(){ q.style.height='auto'; q.style.height = Math.min(q.scrollHeight,140)+'px'; });
  q.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); search(); }
  });

  render();
  pull();
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) pull(); });
  setInterval(function(){ if(document.visibilityState === 'visible') pull(); }, 60000);

  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
