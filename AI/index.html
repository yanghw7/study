<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4b6bfb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 검색">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>AI 검색</title>
<style>
:root{
  --bg:#ffffff;--fg:#1f1f1f;--muted:#6b7280;--card:#f3f4f8;--border:#e1e3ea;--accent:#4b6bfb;--accent-soft:#e8ecff;--danger:#e5484d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121317;--fg:#ececf1;--muted:#9aa0ad;--card:#1d1f26;--border:#2c2f39;--accent:#7b93ff;--accent-soft:#232a4a;--danger:#ff6b70;}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{border:0;font:inherit;color:inherit;cursor:pointer;border-radius:999px;background:none}
textarea,input[type=text],input[type=password],select{width:100%;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;line-height:1.5;padding:6px 0}
textarea{resize:none;max-height:140px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== 상단 검색창 ===== */
.topbar{flex:none;display:flex;gap:8px;align-items:flex-start;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;border-bottom:1px solid var(--border);background:var(--bg)}
.menu-btn{flex:none;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border);font-size:18px;line-height:1}
.menu-btn:hover{border-color:var(--accent)}
#f{flex:1;min-width:0;display:flex;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:3px 4px 3px 16px;align-items:flex-start}
#f:focus-within{border-color:var(--accent)}
.go{flex:none;background:var(--accent);color:#fff;font-weight:600;font-size:15px;padding:9px 18px;margin-top:2px}
.go:disabled{opacity:.6;cursor:default}

/* ===== 레이아웃 ===== */
.layout{flex:1;min-height:0;display:flex;position:relative}
aside{flex:none;width:320px;overflow-y:auto;border-right:1px solid var(--border);padding:10px;background:var(--bg)}
main{flex:1;min-width:0;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.backdrop{display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:15}
@media (min-width:721px){ body.side-hidden aside{display:none} }
@media (max-width:720px){
  aside{position:absolute;top:0;bottom:0;left:0;z-index:20;width:min(88vw,340px);transform:translateX(-102%);transition:transform .25s ease}
  body.drawer-open aside{transform:none;box-shadow:0 0 30px rgba(0,0,0,.3)}
  body.drawer-open .backdrop{display:block}
}

/* ===== 아코디언 메뉴 ===== */
.acc{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;transition:border-color .2s}
.acc.open{border-color:var(--accent)}
.acc-head{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;text-align:left}
.acc-head:hover{background:var(--accent-soft)}
.acc .ico{flex:none;width:24px;text-align:center;font-size:16px}
.acc .ttl{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;font-weight:600}
.acc .sub{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .sub:empty{display:none}
.chev{flex:none;width:8px;height:8px;margin-right:4px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .25s;opacity:.55}
.acc.open .chev{transform:rotate(-135deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.acc.open .acc-body{grid-template-rows:1fr}
.acc-inner{overflow:hidden;min-height:0;visibility:hidden;transition:visibility .25s}
.acc.open .acc-inner{visibility:visible}
.acc-pad{padding:2px 12px 12px}

.label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
.cur-body{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 12px}
.cur-body.none{color:var(--muted);background:transparent;border-color:var(--border)}
.note{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.5}

.editor{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.editor textarea{font-size:15px}
.editor .row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn{font-size:13px;padding:7px 14px}
.primary{background:var(--accent);color:#fff;font-weight:600}
.ghost{color:var(--muted);border:1px solid var(--border)}

ul.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 10px 8px 12px}
.plist li.active{border-color:var(--accent)}
.plist .txt{font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.plist .acts{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:8px}
.plist .badge{margin-right:auto;font-size:12px;color:var(--accent);font-weight:600}
.plist .mini{font-size:12px;padding:4px 10px;border:1px solid var(--border)}
.plist .mini.set{background:var(--accent);border-color:var(--accent);color:#fff}
.plist .mini.del{color:var(--danger)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:10px}

.field{margin-bottom:12px}
.field input,.field select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:16px}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}

/* ===== 검색 결과 ===== */
#result{flex:1;min-height:0;display:flex;flex-direction:column}
#result[hidden]{display:none}
.fill{flex:1;min-height:0;display:flex;position:relative}
.frame{flex:1;min-width:0;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.newtab{position:absolute;right:14px;bottom:14px;background:var(--bg);color:var(--fg);border:1px solid var(--border);font-size:12px;padding:6px 12px;text-decoration:none;opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.newtab:hover{opacity:1;border-color:var(--accent)}
.res-q{font-size:13px;color:var(--muted);margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.answer{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;font-size:15px;line-height:1.65;word-break:break-word}
.answer h3,.answer h4{margin:16px 0 6px;font-size:16px}
.answer p{margin:0 0 10px}
.answer ul,.answer ol{margin:0 0 10px;padding-left:22px}
.answer code{background:var(--border);padding:1px 5px;border-radius:5px;font-size:13px}
.answer .tbl{overflow-x:auto;margin:0 0 10px}
.answer table{border-collapse:collapse;font-size:14px}
.answer th,.answer td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.loading{color:var(--muted);padding:18px;text-align:center}
.err{color:var(--danger);background:var(--card);border:1px solid var(--danger);border-radius:14px;padding:14px 16px;font-size:14px;white-space:pre-wrap}
.sources{margin-top:12px}
.sources a{display:inline-block;margin:0 6px 6px 0;padding:5px 12px;border:1px solid var(--border);border-radius:999px;font-size:13px;text-decoration:none;color:var(--fg);background:var(--bg)}
.open-link{display:inline-block;margin-top:6px;font-size:13px}
</style>
</head>
<body>

<!-- 상단 검색창 -->
<div class="topbar">
  <button type="button" class="menu-btn" id="menuBtn" aria-label="메뉴 열기/닫기" title="메뉴 열기/닫기">☰</button>
  <form id="f">
    <textarea id="q" rows="1" placeholder="검색할 내용을 입력하세요 (Enter: 검색 / Shift+Enter: 줄바꿈)" autofocus></textarea>
    <button type="submit" class="go" id="goBtn">검색</button>
  </form>
</div>

<div class="layout">
  <!-- 왼쪽 메뉴 -->
  <aside id="side">

    <div class="acc" data-key="cur">
      <button type="button" class="acc-head" aria-expanded="false">
        <span class="ico">📌</span>
        <span class="ttl">현재 설정된 프롬프트<span class="sub" id="subCur"></span></span>
        <i class="chev"></i>
      </button>
      <div class="acc-body"><div class="acc-inner"><div class="acc-pad">
        <div class="cur-body" id="curBody"></div>
        <div class="note">검색할 때 이 프롬프트가 입력 내용 앞에 자동으로 붙어요.</div>
      </div></div></div>
    </div>

    <div class="acc" data-key="add">
      <button type="button" class="acc-head" aria-expanded="false">
        <span class="ico">✏️</span>
        <span class="ttl"><span id="edTitle">프롬프트 추가</span><span class="sub" id="subAdd"></span></span>
        <i class="chev"></i>
      </button>
      <div class="acc-body"><div class="acc-inner"><div class="acc-pad">
        <div class="editor">
          <textarea id="ed" rows="3" placeholder="자주 쓰는 프롬프트를 입력하세요"></textarea>
          <div class="row">
            <button type="button" class="btn ghost" id="edCancel" hidden>취소</button>
            <button type="button" class="btn primary" id="edSave">추가</button>
          </div>
        </div>
      </div></div></div>
    </div>

    <div class="acc" data-key="list">
      <button type="button" class="acc-head" aria-expanded="false">
        <span class="ico">📚</span>
        <span class="ttl">프롬프트 목록<span class="sub" id="count"></span></span>
        <i class="chev"></i>
      </button>
      <div class="acc-body"><div class="acc-inner"><div class="acc-pad">
        <ul class="plist" id="list"></ul>
      </div></div></div>
    </div>

    <div class="acc" data-key="set">
      <button type="button" class="acc-head" aria-expanded="false">
        <span class="ico">⚙️</span>
        <span class="ttl">설정<span class="sub" id="subSet"></span></span>
        <i class="chev"></i>
      </button>
      <div class="acc-body"><div class="acc-inner"><div class="acc-pad">
        <div class="field">
          <div class="label">검색 결과 표시 방식</div>
          <select id="mode">
            <option value="frame">구글 AI 모드 화면 그대로 (확장 프로그램 필요)</option>
            <option value="api">Gemini API 답변 (API 키 필요)</option>
          </select>
          <small>화면 그대로 보기는 PC 크롬/엣지에 확장 프로그램을 설치해야 해요. 모바일에서는 Gemini API 방식을 쓰세요.</small>
        </div>
        <div class="field">
          <div class="label">Gemini API 키</div>
          <input type="password" id="key" placeholder="AIza..." autocomplete="off">
          <small>Google AI Studio(aistudio.google.com/apikey)에서 무료로 발급할 수 있어요. 키는 이 브라우저에만 저장되고, 검색할 때 Google 서버로만 전송돼요.</small>
        </div>
        <div class="field">
          <div class="label">모델</div>
          <input type="text" id="model" placeholder="gemini-3.8-flash">
          <small>모델 이름이 바뀌어 오류가 나면 여기만 최신 이름으로 고치세요.</small>
        </div>
        <button type="button" class="btn primary" id="cfgSave">설정 저장</button>
      </div></div></div>
    </div>

  </aside>

  <div class="backdrop" id="backdrop"></div>

  <!-- 검색 결과 -->
  <main>
    <section id="result" hidden></section>
  </main>
</div>

<script>
(function(){
  var KEY = "aimode_prompts_v2", OLD_KEY = "aimode_prompts_v1", CFG = "aimode_cfg_v1", UIKEY = "aimode_ui_v1";
  var DEFAULTS = [
    "다음 질문에 대해 핵심부터 간결하게, 근거와 함께 한국어로 답해줘.",
    "초등학생도 이해할 수 있게 쉽게 설명해줘."
  ];
  var DEFAULT_MODEL = "gemini-3.8-flash";
  var IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var DEFAULT_MODE = IS_MOBILE ? "api" : "frame";
  var mq = window.matchMedia("(max-width:720px)");

  var $ = function(id){ return document.getElementById(id); };
  var q = $("q"), ed = $("ed"), edSave = $("edSave"), edCancel = $("edCancel"), edTitle = $("edTitle");
  var list = $("list"), count = $("count"), curBody = $("curBody"), result = $("result"), goBtn = $("goBtn");

  var state = load(), cfg = loadCfg(), ui = loadUi(), editingId = null;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ---------- 저장/불러오기 ---------- */
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var s = JSON.parse(raw); if(s && Array.isArray(s.prompts)) return fix(s); }
      var old = localStorage.getItem(OLD_KEY);
      if(old){
        var a = JSON.parse(old);
        if(Array.isArray(a) && a.length) return fix({prompts: a.map(function(t){ return {id: uid(), text: String(t)}; }), activeId: null});
      }
    }catch(e){}
    return fix({prompts: DEFAULTS.map(function(t){ return {id: uid(), text: t}; }), activeId: null});
  }
  function fix(s){
    var ok = s.prompts.some(function(p){ return p.id === s.activeId; });
    if(!ok) s.activeId = s.prompts.length ? s.prompts[0].id : null;
    return s;
  }
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function loadCfg(){
    try{ var c = JSON.parse(localStorage.getItem(CFG)); if(c){ c.mode = c.mode || DEFAULT_MODE; return c; } }catch(e){}
    return {key: "", model: DEFAULT_MODEL, mode: DEFAULT_MODE};
  }
  function loadUi(){
    try{ var u = JSON.parse(localStorage.getItem(UIKEY)); if(u && u.open) return u; }catch(e){}
    return {open: {}, side: true};
  }
  function saveUi(){ try{ localStorage.setItem(UIKEY, JSON.stringify(ui)); }catch(e){} }
  function active(){
    for(var i = 0; i < state.prompts.length; i++) if(state.prompts[i].id === state.activeId) return state.prompts[i];
    return null;
  }

  /* ---------- 아코디언 / 사이드바 ---------- */
  var accs = Array.prototype.slice.call(document.querySelectorAll(".acc"));
  function applyAcc(){
    accs.forEach(function(a){
      var on = !!ui.open[a.getAttribute("data-key")];
      a.classList.toggle("open", on);
      a.querySelector(".acc-head").setAttribute("aria-expanded", on ? "true" : "false");
    });
  }
  function setAcc(key, on){ ui.open[key] = on; applyAcc(); saveUi(); }
  accs.forEach(function(a){
    a.querySelector(".acc-head").addEventListener("click", function(){
      var k = a.getAttribute("data-key"); setAcc(k, !ui.open[k]);
    });
  });
  function applySide(){ document.body.classList.toggle("side-hidden", !ui.side); }
  $("menuBtn").addEventListener("click", function(){
    if(mq.matches) document.body.classList.toggle("drawer-open");
    else { ui.side = !ui.side; saveUi(); applySide(); }
  });
  $("backdrop").addEventListener("click", function(){ document.body.classList.remove("drawer-open"); });

  /* ---------- 마크다운 렌더 (간단) ---------- */
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
  }
  function md(src){
    var lines = src.replace(/\r/g, "").split("\n"), out = [], i = 0, lst = null;
    function closeList(){ if(lst){ out.push("</" + lst + ">"); lst = null; } }
    while(i < lines.length){
      var l = lines[i], m;
      if(/^\s*\|.*\|\s*$/.test(l)){
        closeList();
        var rows = [];
        while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
        rows = rows.filter(function(r){ return !/^\s*\|[\s:\-|]+\|\s*$/.test(r); });
        var html = '<div class="tbl"><table>';
        rows.forEach(function(r, ri){
          var cells = r.trim().replace(/^\||\|$/g, "").split("|");
          html += "<tr>" + cells.map(function(c){ var t = ri === 0 ? "th" : "td"; return "<" + t + ">" + inline(c.trim()) + "</" + t + ">"; }).join("") + "</tr>";
        });
        out.push(html + "</table></div>");
        continue;
      }
      if((m = l.match(/^\s*(#{1,4})\s+(.*)$/))){ closeList(); out.push((m[1].length <= 2 ? "<h3>" : "<h4>") + inline(m[2]) + (m[1].length <= 2 ? "</h3>" : "</h4>")); }
      else if((m = l.match(/^\s*[-*•]\s+(.*)$/))){ if(lst !== "ul"){ closeList(); out.push("<ul>"); lst = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); }
      else if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(lst !== "ol"){ closeList(); out.push("<ol>"); lst = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); }
      else if(!l.trim()){ closeList(); }
      else { closeList(); out.push("<p>" + inline(l) + "</p>"); }
      i++;
    }
    closeList();
    return out.join("");
  }

  /* ---------- 검색 ---------- */
  function buildQuery(text){
    var a = active();
    if(!a) return text;
    return a.text + (/\s$/.test(a.text) ? "" : "\n") + text;
  }
  function showResult(node){ result.hidden = false; result.innerHTML = ""; result.appendChild(node); }
  function div(cls, html){ var d = document.createElement("div"); d.className = cls; if(html != null) d.innerHTML = html; return d; }

  async function search(){
    var text = q.value.trim();
    if(!text) return;
    document.body.classList.remove("drawer-open");

    if(cfg.mode !== "api"){
      var url = "https://www.google.com/search?udm=50&q=" + encodeURIComponent(buildQuery(text));
      var w = div("fill");
      var fr = document.createElement("iframe");
      fr.className = "frame"; fr.src = url; fr.title = "Google AI 모드";
      w.appendChild(fr);
      var nt = document.createElement("a");
      nt.className = "newtab"; nt.target = "_blank"; nt.rel = "noopener noreferrer"; nt.href = url;
      nt.textContent = "새 탭에서 열기 ↗";
      w.appendChild(nt);
      showResult(w);
      return;
    }

    if(!cfg.key){
      showResult(div("err", "먼저 Gemini API 키를 설정해 주세요. 왼쪽 메뉴의 '설정'에서 입력할 수 있어요."));
      setAcc("set", true);
      if(mq.matches) document.body.classList.add("drawer-open");
      else if(!ui.side){ ui.side = true; saveUi(); applySide(); }
      return;
    }
    var full = buildQuery(text);
    goBtn.disabled = true; goBtn.textContent = "검색 중…";
    showResult(div("loading", "검색 중입니다…"));
    try{
      var model = (cfg.model || DEFAULT_MODEL).trim();
      var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
        method: "POST",
        headers: {"Content-Type": "application/json", "x-goog-api-key": cfg.key},
        body: JSON.stringify({contents: [{role: "user", parts: [{text: full}]}], tools: [{google_search: {}}]})
      });
      var data = await res.json();
      if(!res.ok) throw new Error((data.error && data.error.message) || ("요청 실패 (" + res.status + ")"));
      var cand = data.candidates && data.candidates[0];
      var parts = (cand && cand.content && cand.content.parts) || [];
      var answer = parts.filter(function(p){ return p.text && !p.thought; }).map(function(p){ return p.text; }).join("");
      if(!answer) throw new Error("응답이 비어 있어요. 다른 표현으로 다시 시도해 보세요.");

      var wrap = document.createElement("div");
      var rq = div("res-q"); rq.textContent = "Q. " + text; wrap.appendChild(rq);
      wrap.appendChild(div("answer", md(answer)));

      var chunks = (cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || [];
      var seen = {}, links = [];
      chunks.forEach(function(c){
        if(c.web && /^https?:\/\//.test(c.web.uri) && !seen[c.web.uri]){ seen[c.web.uri] = 1; links.push(c.web); }
      });
      if(links.length){
        var src = div("sources"); src.appendChild(div("label", "출처"));
        links.forEach(function(wl){
          var a = document.createElement("a");
          a.href = wl.uri; a.target = "_blank"; a.rel = "noopener noreferrer";
          a.textContent = wl.title || wl.uri; src.appendChild(a);
        });
        wrap.appendChild(src);
      }
      var o = document.createElement("a");
      o.className = "open-link"; o.target = "_blank"; o.rel = "noopener noreferrer";
      o.href = "https://www.google.com/search?udm=50&q=" + encodeURIComponent(full);
      o.textContent = "Google AI 모드에서 같은 질문 열기 ↗";
      wrap.appendChild(o);
      showResult(wrap);
    }catch(err){
      showResult(div("err", "오류: " + (err && err.message ? err.message : err)));
    }finally{
      goBtn.disabled = false; goBtn.textContent = "검색";
    }
  }

  /* ---------- 프롬프트 UI ---------- */
  function autosize(el){ el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 140) + "px"; }
  function short(t, n){ t = t.replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n) + "…" : t; }
  function resetEditor(){
    editingId = null; ed.value = "";
    edTitle.textContent = "프롬프트 추가"; $("subAdd").textContent = "";
    edSave.textContent = "추가"; edCancel.hidden = true; autosize(ed);
  }
  function renderCurrent(){
    var a = active();
    curBody.className = "cur-body" + (a ? "" : " none");
    curBody.textContent = a ? a.text : "설정된 프롬프트가 없어요. '프롬프트 추가'에서 만들어 주세요.";
    $("subCur").textContent = a ? short(a.text, 40) : "없음";
  }
  function renderList(){
    list.innerHTML = "";
    count.textContent = state.prompts.length + "개";
    if(!state.prompts.length){ list.appendChild(div("empty", "저장된 프롬프트가 없어요.")); return; }
    state.prompts.forEach(function(p){
      var isActive = p.id === state.activeId;
      var li = document.createElement("li"); if(isActive) li.className = "active";
      var t = div("txt"); t.textContent = p.text;
      var acts = div("acts");
      var badge = document.createElement("span"); badge.className = "badge"; badge.textContent = isActive ? "● 사용 중" : "";
      acts.appendChild(badge);
      function mk(label, cls, fn){ var b = document.createElement("button"); b.type = "button"; b.className = "mini " + cls; b.textContent = label; b.onclick = fn; acts.appendChild(b); }
      if(!isActive) mk("설정", "set", function(){ state.activeId = p.id; persist(); render(); });
      mk("수정", "", function(){
        editingId = p.id; ed.value = p.text;
        edTitle.textContent = "프롬프트 수정"; $("subAdd").textContent = "수정 중";
        edSave.textContent = "수정 저장"; edCancel.hidden = false;
        setAcc("add", true); autosize(ed); ed.focus();
      });
      mk("삭제", "del", function(){
        state.prompts = state.prompts.filter(function(x){ return x.id !== p.id; });
        if(editingId === p.id) resetEditor();
        state = fix(state); persist(); render();
      });
      li.appendChild(t); li.appendChild(acts); list.appendChild(li);
    });
  }
  function renderSet(){ $("subSet").textContent = cfg.mode === "api" ? "Gemini API 방식" : "구글 화면 그대로"; }
  function render(){ renderCurrent(); renderList(); renderSet(); }

  edSave.addEventListener("click", function(){
    var v = ed.value.trim(); if(!v) return;
    if(editingId) state.prompts.forEach(function(p){ if(p.id === editingId) p.text = v; });
    else state.prompts.unshift({id: uid(), text: v});
    state = fix(state); persist(); resetEditor(); render();
  });
  edCancel.addEventListener("click", resetEditor);

  $("key").value = cfg.key || "";
  $("model").value = cfg.model || DEFAULT_MODEL;
  $("mode").value = cfg.mode || DEFAULT_MODE;
  $("cfgSave").addEventListener("click", function(){
    cfg = {key: $("key").value.trim(), model: $("model").value.trim() || DEFAULT_MODEL, mode: $("mode").value};
    try{ localStorage.setItem(CFG, JSON.stringify(cfg)); }catch(e){}
    renderSet();
    var b = $("cfgSave"); b.textContent = "저장됨 ✓";
    setTimeout(function(){ b.textContent = "설정 저장"; }, 1400);
  });

  $("f").addEventListener("submit", function(ev){ ev.preventDefault(); search(); });
  q.addEventListener("input", function(){ autosize(q); });
  ed.addEventListener("input", function(){ autosize(ed); });
  q.addEventListener("keydown", function(ev){
    if(ev.key === "Enter" && !ev.shiftKey && !ev.isComposing){ ev.preventDefault(); search(); }
  });

  if(cfg.mode === "api" && !cfg.key) ui.open.set = true;
  applyAcc(); applySide();

  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  persist(); render();
})();
</script>
</body>
</html>
