<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>기록장</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#f5f7f6}
    .shell{height:100dvh;display:flex;flex-direction:column}
    .tabs{
      flex:0 0 46px;height:46px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 38px;
      gap:5px;padding:5px 8px;background:#f7f9f8;border-bottom:1px solid #dde5e1;
      position:sticky;top:0;z-index:999;
    }
    .tabs button{min-width:0;border:0;border-radius:8px;font-weight:800;font-size:11px;background:#e8eeeb;color:#53615c;padding:0 3px;white-space:nowrap}
    .tabs button.active.study{background:#285f50;color:#fff}
    .tabs button.active.lecture{background:#67538b;color:#fff}
    .tabs button.active.sleep{background:#456d96;color:#fff}
    .tabs button.active.record{background:#B86F7D;color:#fff}
    .tabs button.recording::before{content:'';display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:50%;background:#ff3b30;vertical-align:-1px;box-shadow:0 0 0 2px rgba(255,59,48,.12)}

    .frame{display:none;flex:1 1 auto;width:100%;min-height:0;border:0;background:#fff}
    .frame.active{display:block}

    .alarmbar{flex:0 0 auto;margin:6px 8px 0;padding:6px 8px;border:1px solid #dbe4e0;border-radius:11px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.035);font-size:12px;position:relative;z-index:100}
    .alarmline{display:flex;align-items:center;gap:5px;min-width:0}
    .alarmline strong{font-size:16px;line-height:1;white-space:nowrap;color:#26332f}
    .alarmline input{width:36px;height:30px;border:1px solid #dbe4e0;border-radius:8px;text-align:center;font-weight:800;font-size:13px;background:#f8faf9}
    .alarmline .unit{font-size:11px;font-weight:700;color:#6b7773;margin-left:-3px}
    .alarmline select{height:30px;width:92px;min-width:72px;max-width:92px;border:1px solid #dbe4e0;border-radius:8px;background:#fff;padding:0 5px;font-size:10.5px;font-weight:800;color:#34423d}
    .alarmline button{height:30px;border:1px solid #dbe4e0;border-radius:8px;background:#fff;padding:0 6px;font-size:10.5px;font-weight:800;white-space:nowrap;color:#34423d}
    #alarmStart{margin-left:auto}
    #alarmStart,#alarmCancel{width:54px;min-width:0;flex:0 1 54px;padding:0 5px}
    #alarmCancel{margin-right:0}
    .alarmline button.primary{background:#285f50;border-color:#285f50;color:#fff}
    .alarmline button.danger{display:none!important;background:#b42318;border-color:#b42318;color:#fff}
    .alarmline button.danger.show{display:inline-block!important}

    .alarmstatusline{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:5px;min-height:30px}.alarmstatusline:has(#alarmStatus:empty){display:none}#alarmStatus{display:block;text-align:center;white-space:nowrap;font-size:14px;font-weight:800;color:#b23a48}.alarmstatusline #alarmStop{display:none;height:27px;padding:0 8px;border:1px solid #b42318;border-radius:8px;background:#b42318;color:#fff;font-size:10.5px;font-weight:800;white-space:nowrap}.alarmstatusline #alarmStop.show{display:inline-block}
    @media(max-width:560px){.alarmbar{padding:5px 4px}.alarmline{gap:3px}.alarmline strong{font-size:11px}.alarmline button{padding:0 6px;font-size:10px}#alarmStatus{font-size:13px}}

    .cloudbar{flex:0 0 auto;margin:4px 8px 0;padding:4px 6px;border:1px solid #dbe4e0;border-radius:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.035);font:700 10px Inter,system-ui,sans-serif;color:#34423d}.cloudline{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:nowrap}.cloudline strong{font-size:11px;white-space:nowrap}.cloudline button{height:27px;border:1px solid #dbe4e0;border-radius:7px;background:#fff;padding:0 6px;font:800 9px Inter,system-ui,sans-serif;white-space:nowrap;color:#34423d}.cloudline button.primary{background:#285f50;border-color:#285f50;color:#fff}.cloudline input{height:27px;min-width:90px;flex:1;border:1px solid #dbe4e0;border-radius:7px;padding:0 6px;font:700 10px Inter,system-ui,sans-serif}.cloudstatus{margin-left:0;font-size:9px;color:#60706a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.sync-connection-status{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;margin:0 5px;font-size:9px;font-weight:850;color:#60706a;white-space:nowrap}.sync-connection-dot{width:8px;height:8px;border-radius:50%;background:#d97706;box-shadow:0 0 0 2px rgba(217,119,6,.10)}.sync-connection-status.online .sync-connection-dot{background:#1f9d63;box-shadow:0 0 0 2px rgba(31,157,99,.10)}.sync-connection-status.offline .sync-connection-dot{background:#d64545;box-shadow:0 0 0 2px rgba(214,69,69,.10)}.cloudsetup{display:none;margin-top:4px;gap:4px;align-items:center}.cloudsetup.show{display:flex}.cloudlogout{display:none!important}.cloudlogout.show{display:inline-block!important}@media(max-width:560px){.cloudbar{padding:4px 5px}.cloudline{gap:3px}.cloudline strong{font-size:10px}.cloudline button{padding:0 5px;font-size:8.5px}.cloudsetup{flex-wrap:wrap}.cloudsetup input{min-width:0;width:calc(50% - 2px);flex:auto}.cloudstatus{font-size:8.5px}}

    .shared-settings-btn{font-size:17px!important;padding:0!important;background:#e8eeeb!important;color:#53615c!important}
    .shared-settings-panel{display:none;position:fixed;top:50px;right:8px;z-index:10050;width:min(290px,calc(100vw - 16px));padding:12px;border:1px solid #dbe4e0;border-radius:12px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.16);color:#34423d;max-height:calc(100dvh - 60px);overflow-y:auto;-webkit-overflow-scrolling:touch}
    .shared-settings-panel.show{display:block}
.shared-settings-panel button{-webkit-appearance:none!important;appearance:none!important;box-shadow:none!important;}
.shared-settings-panel input{-webkit-appearance:none!important;appearance:none!important;}
    .shared-settings-title{font-size:14px;font-weight:900;margin-bottom:10px}
    .shared-settings-row{display:grid;grid-template-columns:1fr 116px auto;align-items:center;gap:10px;margin:8px 0;font-size:12px;font-weight:800}
    .shared-pending-note{display:block!important;width:100%!important;box-sizing:border-box!important;color:#b42318!important;font-size:11px!important;font-weight:900!important;line-height:1.35!important;white-space:nowrap!important;text-align:right!important;padding-right:2px!important;margin-top:2px!important;}
    .shared-settings-row select{height:34px;border:1px solid #dbe4e0;border-radius:8px;background:#fff;padding:0 7px;font-weight:800;color:#34423d}
    .shared-settings-note{margin-top:8px;font-size:10px;line-height:1.45;color:#6b7773}
    .shared-danger-zone{margin-top:12px;padding-top:10px;border-top:1px solid #ead9d9}.shared-delete-all{width:100%;height:36px;margin-top:14px;border:1px solid #c9362b;border-radius:8px;background:#fff;color:#b42318;font-size:11px;font-weight:900}.shared-delete-all:active{background:#fff1f0}.shared-delete-grid{display:grid;gap:6px;margin-top:8px}.shared-delete-one{width:100%;height:34px;border:1px solid #e2c7c4;border-radius:8px;background:#fff;color:#8f3028;font-size:10.5px;font-weight:850}.shared-delete-one:active{background:#fff5f4}

    #sharedSnapshotPanel.open{display:flex!important;position:fixed!important;inset:0!important;z-index:20000!important;background:rgba(0,0,0,.55)!important;align-items:center!important;justify-content:center!important;padding:20px!important;box-sizing:border-box!important;overflow:visible!important;border:0!important;border-radius:0!important;box-shadow:none!important;margin:0!important;}
#sharedSnapshotPickBtn{display:none!important;}
#sharedSnapshotList[hidden]{display:block!important;}
#sharedSnapshotList{position:static!important;transform:none!important;display:block!important;width:min(420px,100%)!important;max-height:70vh!important;overflow-y:auto!important;padding:18px!important;background:#fff!important;border-radius:16px!important;box-shadow:0 20px 60px rgba(0,0,0,.3)!important;box-sizing:border-box!important;margin:0!important;}
#sharedSnapshotPanel>.backup-choice-title{display:none;}
#sharedSnapshotList{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 40px));max-height:70vh;overflow-y:auto;padding:18px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);box-sizing:border-box;}
#sharedSnapshotList::before{content:'스냅샷에서 복원 — 복원할 시점을 선택하세요';display:block;font-size:13px;font-weight:900;color:#1f2926;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #e5eae7;}
#sharedSnapshotList .backup-choice-btn{width:100%;height:40px;border:1px solid #d9dfdc;border-radius:10px;background:#fff;color:#26312e;font:800 12px Inter,system-ui,sans-serif;cursor:pointer;-webkit-appearance:none;appearance:none;margin-bottom:6px;}
#sharedSnapshotList .backup-choice-btn:active{background:#eef3f0;}
#sharedSnapshotList[hidden]{display:none!important;}
#sharedSnapshotList::-webkit-scrollbar{width:6px;}
#sharedSnapshotList::-webkit-scrollbar-thumb{background:#c9d3ce;border-radius:3px;}
#sharedSnapshotList::-webkit-scrollbar-thumb:hover{background:#a9b3ae;}
.shared-data-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.shared-backup-location{-webkit-appearance:none!important;appearance:none!important;-webkit-appearance:none!important;appearance:none!important;box-sizing:border-box!important;display:block!important;width:100%!important;height:40px!important;margin:8px 0 0!important;padding:0 12px!important;border:1px solid #d9dfdc!important;border-radius:10px!important;background:#fff!important;color:#1f2926!important;font-size:11.5px!important;font-weight:900!important;line-height:38px!important;text-align:center!important;cursor:pointer!important;box-shadow:none!important;outline:none!important}.shared-backup-location:active{background:#f4f7f5}.shared-backup-location-status{margin-top:5px;font-size:10px;color:#6b7773}.shared-data-btn{height:44px;border:1px solid #d9dfdc;border-radius:12px;background:#fff;color:#1f2926;font-size:13px;font-weight:900}.shared-data-btn:active{background:#f4f7f5}.backup-choice{display:none;margin-top:8px;padding:10px;border:1px solid #dfe4e1;border-radius:12px;background:#f8faf9}
#sharedSnapshotPickBtn{display:none!important;}
#sharedSnapshotPanel.open{display:flex!important;position:fixed!important;inset:0!important;z-index:20000!important;background:rgba(0,0,0,.55)!important;align-items:center!important;justify-content:center!important;padding:20px!important;margin:0!important;border:0!important;border-radius:0!important;box-sizing:border-box!important;overflow:visible!important;max-height:none!important;}
#sharedSnapshotPanel.open>.backup-choice-title{display:none!important;}
#sharedSnapshotList{width:min(420px,100%)!important;max-height:70vh!important;overflow-y:auto!important;padding:18px!important;background:#fff!important;border-radius:16px!important;box-shadow:0 20px 60px rgba(0,0,0,.3)!important;display:block!important;box-sizing:border-box!important;margin:0!important;-webkit-overflow-scrolling:touch!important;}
#sharedSnapshotList::before{content:'스냅샷에서 복원 — 복원할 시점을 선택하세요';display:block;font-size:13px;font-weight:900;color:#1f2926;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #e5eae7;}
#sharedSnapshotList .backup-choice-btn{width:100%!important;height:42px!important;border:1px solid #d9dfdc!important;border-radius:10px!important;background:#fff!important;color:#26312e!important;font:800 12px Inter,system-ui,sans-serif!important;cursor:pointer!important;-webkit-appearance:none!important;appearance:none!important;margin:0 0 6px!important;display:block!important;box-sizing:border-box!important;}
#sharedSnapshotList .backup-choice-btn:active{background:#eef3f0!important;}
#sharedSnapshotList::-webkit-scrollbar{width:6px;}
#sharedSnapshotList::-webkit-scrollbar-thumb{background:#c9d3ce;border-radius:3px;}

#sharedSnapshotList::before{content:'스냅샷에서 복원 — 복원할 시점을 선택하세요';display:block;font-size:13px;font-weight:900;color:#1f2926;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #e5eae7;}

#sharedSnapshotList .backup-choice-btn:active{background:#eef3f0!important;}
#sharedSnapshotList::-webkit-scrollbar{width:6px;}
#sharedSnapshotList::-webkit-scrollbar-thumb{background:#c9d3ce;border-radius:3px;}.backup-choice.open{display:block}.backup-choice-title{font-size:11px;font-weight:900;margin-bottom:8px;color:#46534f}.backup-choice-grid{display:grid;gap:6px}.backup-choice-btn{width:100%;height:36px;border:1px solid #d9dfdc;border-radius:9px;background:#fff;color:#26312e;font-size:11px;font-weight:850}.backup-choice-btn:active{background:#eef3f0}#sharedRestoreFile{display:none}

  <meta name="theme-color" content="#285f50">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <style>#pwaInstallBtn{display:none;position:fixed;right:14px;bottom:76px;z-index:9999;border:0;border-radius:12px;padding:11px 14px;font:700 13px Inter,system-ui,sans-serif;box-shadow:0 3px 14px rgba(0,0,0,.16);background:#285f50;color:#fff}#pwaInstallBtn.show{display:block}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body><button id="pwaInstallBtn" type="button">앱 설치</button>

<div class="shell" id="shell">
  <div class="tabs">
    <button id="studyTab" class="active study">📚 공부 기록장</button>
    <button id="lectureTab" class="lecture">🎓 강의 기록장</button>
    <button id="sleepTab" class="sleep">🌙 수면 기록장</button>
    <button id="recordTab" class="record">📝 기타 기록장</button>
    <button id="sharedSettingsBtn" class="shared-settings-btn" type="button" aria-label="공통 설정" title="공통 설정">⚙</button>
  </div>
  <div id="sharedSettingsPanel" class="shared-settings-panel" aria-hidden="true">
    <div class="shared-settings-title">⚙ 공통 설정</div>
    <label class="shared-settings-row"><span>하루 집계 기준시점</span><select id="sharedDayStartHour"></select></label>
    <div id="sharedDayStartPending" class="shared-pending-note" style="display:none;"></div>
    <div class="shared-settings-note">자정(00:00)부터 오전 11:00까지 선택할 수 있습니다. 선택한 시간 전의 기록은 전날 기록으로 집계됩니다.</div>
    <label class="shared-settings-row"><span>1주 시작 요일</span><select id="sharedWeekStart">
      <option value="0">일요일</option><option value="1">월요일</option><option value="2">화요일</option>
      <option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option><option value="6">토요일</option>
    </select></label>
    <div class="shared-settings-note">선택한 요일부터 한 주가 시작되며 주간 통계에 공통 적용됩니다.</div>
    <div class="shared-settings-note">공통 설정은 공부 · 강의 · 수면 · 기타 기록장에 모두 적용됩니다.</div>
    <div class="shared-data-actions">
      <button id="sharedBackupBtn" class="shared-data-btn" type="button">데이터 백업</button>
      <button id="sharedRestoreBtn" class="shared-data-btn" type="button">데이터 복원</button>
    </div>
    <button id="sharedBackupLocationBtn" class="shared-backup-location" type="button">백업파일 저장 위치 설정</button>
    <div id="sharedBackupLocationStatus" class="shared-backup-location-status">저장 위치: 기본 다운로드 폴더</div>
    <div id="sharedBackupChoice" class="backup-choice" aria-hidden="true">
      <div class="backup-choice-title">전체 기록장을 백업합니다</div>
      <div class="backup-choice-grid">

        <button class="backup-choice-btn" data-backup-kind="all" type="button">전체 기록장 백업 (공부 · 강의 · 수면 · 기타)</button>
      </div>
    </div>
    <input id="sharedRestoreFile" type="file" accept="application/json,.json">
    <button id="sharedSnapshotBtn" type="button" style="-webkit-appearance:none;appearance:none;box-sizing:border-box;display:block;width:100%;height:44px;margin:10px 0 0;padding:0 12px;border:1px solid #d9dfdc;border-radius:12px;background:#fff;color:#1f2926;font:900 13px/1 Inter,system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:none;outline:none;">스냅샷에서 복원</button>

<div id="sharedSnapshotPanel" class="backup-choice" aria-hidden="true" onclick="if(event.target===this){this.classList.remove('open');this.setAttribute('aria-hidden','true');}">
      <button id="sharedSnapshotPickBtn" type="button" style="-webkit-appearance:none;appearance:none;box-sizing:border-box;display:block;width:100%;height:40px;padding:0 12px;border:1px solid #d9dfdc;border-radius:10px;background:#fff;color:#1f2926;font:900 12.5px/1 Inter,system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:none;outline:none;">복원 시점 선택 ▼</button>
      <div id="sharedSnapshotList" class="backup-choice-grid" hidden style="margin-top:8px;"></div>
    </div>
    <div class="shared-danger-zone">
      <div class="shared-delete-grid">
        <button id="sharedDeleteStudy" class="shared-delete-one" type="button">공부 기록장 데이터 전체 삭제</button>
        <button id="sharedDeleteLecture" class="shared-delete-one" type="button">강의 기록장 데이터 전체 삭제</button>
        <button id="sharedDeleteSleep" class="shared-delete-one" type="button">수면 기록장 데이터 전체 삭제</button>
        <button id="sharedDeleteRecord" class="shared-delete-one" type="button">기타 기록장 데이터 전체 삭제</button>
      </div>
      <button id="sharedDeleteAll" class="shared-delete-all" type="button">데이터 전체 삭제</button>
      <div class="shared-settings-note">공부 · 강의 · 수면 · 기타 기록장의 데이터를 모두 삭제합니다.</div>
    </div>
  </div>
  <div class="alarmbar" id="sharedAlarmBar">
    <div class="alarmline">
      <strong aria-label="알람">⏰</strong>
      <input id="alarmHours" type="number" min="0" max="24" inputmode="numeric" value="" placeholder="" aria-label="시간"><span class="unit">시간</span>
      <input id="alarmMinutes" type="number" min="0" max="59" inputmode="numeric" value="" placeholder="" aria-label="분"><span class="unit">분</span>
      <span class="unit afterAlarm">후</span>
      <select id="alarmSoundSelect" aria-label="알람음"><option value="">불러오는 중...</option></select>

      <button id="alarmPreview" type="button">▶ 미리듣기</button>
      <button id="alarmStart" class="primary" type="button">시작</button>
      <button id="alarmCancel" type="button">해제</button>
    </div>
    <div class="alarmstatusline"><div id="alarmStatus"></div><button id="alarmStop" class="danger" type="button" hidden style="display:none">🔕 끄기</button></div>
  </div>
  <div class="cloudbar" id="sharedCloudBar">
    <div class="cloudline">
      <strong>☁ 클라우드</strong><span id="sharedCloudStatus" class="cloudstatus">로그인 확인 중…</span>
      <span id="syncConnectionStatus" class="sync-connection-status" aria-live="polite"><span class="sync-connection-dot" aria-hidden="true"></span><span id="syncConnectionText">서버 연결 중</span></span>
      <button id="sharedCloudToggle" type="button">로그인</button>

      <button id="sharedCloudLogout" class="cloudlogout" type="button">로그아웃</button>

    </div>
    <div class="cloudsetup" id="sharedCloudSetup">
      <form onsubmit="event.preventDefault();return false;" style="display:contents;">
        <input id="sharedCloudEmail" type="email" placeholder="이메일" autocomplete="username">
        <input id="sharedCloudPassword" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
      </form>
      <button id="sharedCloudSignup" type="button">회원가입</button>
      <button id="sharedCloudLogin" class="primary" type="button">로그인</button>
      <button id="sharedCloudGoogle" type="button">Google 로그인</button>
    </div>
  </div>
  <iframe id="studyFrame" class="frame active" src="study.html"></iframe>
  <iframe id="lectureFrame" class="frame" data-src="lecture.html"></iframe>
  <iframe id="sleepFrame" class="frame" data-src="sleep.html"></iframe>

</div>
<script>
  const SUPABASE_URL = 'https://nvpvxtwebzefhgulswsv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_z5OzUt5AQhpWK-ZXl-3blQ_jav06IYo';

  let sbSettingsClient = null;
  let __sbCreating = false;

  const shell=document.getElementById('shell');
  const tabs={
   study:{button:document.getElementById('studyTab'),frame:document.getElementById('studyFrame')},
   lecture:{button:document.getElementById('lectureTab'),frame:document.getElementById('lectureFrame')},
   sleep:{button:document.getElementById('sleepTab'),frame:document.getElementById('sleepFrame')},
   record:{button:document.getElementById('recordTab'),frame:document.getElementById('recordFrame')}
  };

  const LAST_TAB_LOCAL_KEY='journal:last-tab';

  function openTab(which, skipSave){
    Object.entries(tabs).forEach(([key,item])=>{
      const active=key===which;
      item.button.classList.toggle('active',active);
      item.frame.classList.toggle('active',active);
      if(active && !item.frame.getAttribute('src') && item.frame.dataset.src){
        item.frame.src=item.frame.dataset.src;
      }
      try{
        item.frame.contentWindow?.postMessage({
          type: active ? 'journal-resume' : 'journal-pause'
        }, location.origin);
      }catch(e){}
    });
    try{ localStorage.setItem(LAST_TAB_LOCAL_KEY, which); }catch(_){}
    if(!skipSave) scheduleLastTabCloudSave(which);
  }
  Object.entries(tabs).forEach(([key,item])=>item.button.onclick=()=>openTab(key));
  let first='study';
  try{
    const localTab=localStorage.getItem(LAST_TAB_LOCAL_KEY);
    if(localTab && tabs[localTab]) first=localTab;
  }catch(_){}
  openTab(first, true);

  const SHARED_SETTINGS_DEFAULT={dayStartHour:11,weekStartDay:6};
  let sharedSettingsCache={...SHARED_SETTINGS_DEFAULT};
  let sharedSettingsLoaded=false;
  window.getSupabaseClient = () => initSettingsClient();
  function initSettingsClient(){
    if(sbSettingsClient) return sbSettingsClient;
    if(__sbCreating) return null;
    __sbCreating = true;
    try{
      const isAndroidApp = location.hostname === 'appassets.androidplatform.net';
      sbSettingsClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:!isAndroidApp }, realtime: { logLevel: 'error' } }
      );
      return sbSettingsClient;
    }catch(e){ return null; }
    finally{ __sbCreating = false; }
  }
  async function loadSharedSettingsFromCloud(){
    const sb=initSettingsClient();
    if(!sb) return {...SHARED_SETTINGS_DEFAULT};
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user){
      sharedSettingsCache={...SHARED_SETTINGS_DEFAULT};
      sharedSettingsLoaded=false;
      return {...SHARED_SETTINGS_DEFAULT};
    }
    const {data,error}=await sb.from('journal_settings')
      .select('day_start_hour,pending_day_start,week_start_day')
      .eq('user_id',session.user.id).maybeSingle();
    if(error){
      console.warn('설정 로드 실패, 기본값 사용:',error);
      return {...SHARED_SETTINGS_DEFAULT};
    }
    const norm={
      dayStartHour:Number.isInteger(data?.day_start_hour)&&data.day_start_hour>=0&&data.day_start_hour<=11?data.day_start_hour:SHARED_SETTINGS_DEFAULT.dayStartHour,
      weekStartDay:Number.isInteger(data?.week_start_day)&&data.week_start_day>=0&&data.week_start_day<=6?data.week_start_day:SHARED_SETTINGS_DEFAULT.weekStartDay,
      pendingDayStart:data?.pending_day_start||null
    };
    sharedSettingsCache=norm;
    sharedSettingsLoaded=true;
    return norm;
  }
  async function readSharedSettings(){
    if(!sharedSettingsLoaded) await loadSharedSettingsFromCloud();
    return {...sharedSettingsCache};
  }
  function notifySharedSettings(v){
    for(const item of Object.values(tabs)){
      try{item.frame.contentWindow?.postMessage({type:'journal-shared-settings-changed',settings:v},location.origin)}catch(e){}
    }
  }

  window.addEventListener('message', async (ev)=>{
    if(ev.origin !== location.origin) return;
    if(ev.data?.type !== 'journal-request-shared-settings') return;
    try{
      if(!sharedSettingsLoaded){
        await loadSharedSettingsFromCloud();
        sharedSettingsLoaded = true;
      }
      ev.source?.postMessage({
        type:'journal-shared-settings-changed',
        settings: sharedSettingsCache
      }, location.origin);
    }catch(e){ console.warn('[FIX3] 설정 응답 실패', e); }
  });
  async function writeSharedSettingsToCloud(patch){
    const sb=initSettingsClient();
    if(!sb) throw new Error('클라우드 연결 실패');
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user) throw new Error('로그인이 필요합니다. 설정은 클라우드에만 저장됩니다.');
    const current=await readSharedSettings();
    const next={...current,...patch};
    const payload={
      user_id:session.user.id,
      day_start_hour:next.dayStartHour,
      pending_day_start:next.pendingDayStart??null,
      week_start_day:next.weekStartDay,
      updated_at:new Date().toISOString()
    };
    const {error}=await sb.from('journal_settings').upsert(payload,{onConflict:'user_id'});
    if(error) throw error;
    sharedSettingsCache=next;
    notifySharedSettings(next);
    return next;
  }
  let lastTabCloudSaveTimer=null;
  let pendingLastTabCloud=null;
  let lastTabCloudSavedValue=null;
  function scheduleLastTabCloudSave(tab){
    pendingLastTabCloud=tab;
    if(lastTabCloudSaveTimer) clearTimeout(lastTabCloudSaveTimer);
    lastTabCloudSaveTimer=setTimeout(()=>{
      lastTabCloudSaveTimer=null;
      const next=pendingLastTabCloud;
      pendingLastTabCloud=null;
      if(!next || next===lastTabCloudSavedValue) return;
      void saveLastTabToCloud(next);
    },3000);
  }
  async function saveLastTabToCloud(tab){
    const sb=initSettingsClient();
    if(!sb) return;
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user) return;
    const {error}=await sb.from('journal_settings').upsert({
      user_id:session.user.id,
      last_tab:tab,
      updated_at:new Date().toISOString()
    },{onConflict:'user_id'});
    if(!error) lastTabCloudSavedValue=tab;
  }
  async function restoreLastTabFromCloud(){
    const sb=initSettingsClient();
    if(!sb) return null;
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user) return null;
    const {data}=await sb.from('journal_settings')
      .select('last_tab').eq('user_id',session.user.id).maybeSingle();
    return data?.last_tab||null;
  }
  function initSharedSettingsUI(){
    const btn=document.getElementById('sharedSettingsBtn');
    const panel=document.getElementById('sharedSettingsPanel');
    const hour=document.getElementById('sharedDayStartHour');
    const week=document.getElementById('sharedWeekStart');
    const pendingEl=document.getElementById('sharedDayStartPending');
    for(let h=0;h<12;h++){
      const o=document.createElement('option');
      o.value=String(h); o.textContent=String(h).padStart(2,'0')+':00';
      hour.appendChild(o);
    }
    function nextBoundaryOfHour(h){
      const now=new Date();
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,0,0,0);
      if(d.getTime()<=now.getTime()) d.setDate(d.getDate()+1);
      return d;
    }
    function paintPendingInfo(){
      if(!pendingEl) return;
      const p=sharedSettingsCache.pendingDayStart;
      if(!p){
        pendingEl.style.display='none';
        pendingEl.textContent='';
        return;
      }
      const d=new Date(p.effectiveAt);
      const mo=String(d.getMonth()+1).padStart(2,'0');
      const da=String(d.getDate()).padStart(2,'0');
      const hh=String(d.getHours()).padStart(2,'0');
      const mi=String(d.getMinutes()).padStart(2,'0');
      pendingEl.textContent=`(다음 적용시점 ${mo}/${da} ${hh}:${mi})`;
      pendingEl.style.display='block';
    }
    async function paint(){
      const v=await readSharedSettings();
      hour.value=String(v.pendingDayStart?v.pendingDayStart.hour:v.dayStartHour);
      week.value=String(v.weekStartDay);
      paintPendingInfo();
    }
    paint();
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const show=!panel.classList.contains('show');
      panel.classList.toggle('show',show);
      panel.setAttribute('aria-hidden',String(!show));
      if(show)paint();
    });
    panel.addEventListener('click',e=>e.stopPropagation());
    document.addEventListener('click',(e)=>{
      const t=e.target;
      const isInput=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
      if(!isInput){ try{ document.activeElement?.blur?.(); }catch(_){} }
      panel.classList.remove('show');panel.setAttribute('aria-hidden','true');
    });
    hour.addEventListener('change',async()=>{
      const newHour=+hour.value;
      const current=await readSharedSettings();
      const applied=current.dayStartHour;
      const existing=current.pendingDayStart;
      if(newHour===applied){
        if(existing){
          try{ await writeSharedSettingsToCloud({pendingDayStart:null}); paintPendingInfo(); }
          catch(e){ alert('예약 취소 실패: '+(e?.message||e)); await paint(); }
        }
        return;
      }
      try{
        const effectiveAt=nextBoundaryOfHour(applied).toISOString();
        await writeSharedSettingsToCloud({pendingDayStart:{hour:newHour,effectiveAt}});
        paintPendingInfo();
      }catch(e){
        alert('예약 저장 실패: '+(e?.message||e));
        await paint();
      }
    });
    week.addEventListener('change',async()=>{
      try{ await writeSharedSettingsToCloud({weekStartDay:+week.value}); }
      catch(e){ alert('설정 저장 실패: '+(e?.message||e)); await paint(); }
    });
    window.addEventListener('message',async(ev)=>{
      if(ev.origin!==location.origin) return;
      if(ev.data?.type!=='journal-activate-pending-day-start') return;
      try{
        const h=Number(ev.data.hour);
        if(!Number.isInteger(h)||h<0||h>11) return;
        sharedSettingsCache.dayStartHour=h;
        sharedSettingsCache.pendingDayStart=null;
        const sb=initSettingsClient();
        if(sb){
          const {data:{session}}=await sb.auth.getSession();
          if(session?.user){
            await sb.from('journal_settings').upsert({
              user_id:session.user.id,
              day_start_hour:h,
              pending_day_start:null,
              updated_at:new Date().toISOString()
            },{onConflict:'user_id'});
          }
        }
        await paint();
        notifySharedSettings(sharedSettingsCache);
      }catch(e){ console.warn('[pending-activate] 반영 실패', e); }
    });

    async function ensureDeleteFrame(kind){
      const fr=tabs[kind].frame;
      if(!fr.getAttribute('src')){
        fr.src=fr.dataset.src;
        await new Promise(r=>{
          if(fr.contentDocument?.readyState==='complete'){r();return;}
          const t=setTimeout(r,5000);
          fr.addEventListener('load',()=>{clearTimeout(t);r();},{once:true});
        });
      }else if(!fr.contentDocument || fr.contentDocument.readyState!=='complete'){
        await new Promise(r=>{
          if(fr.contentDocument?.readyState==='complete'){r();return;}
          const t=setTimeout(r,5000);
          fr.addEventListener('load',()=>{clearTimeout(t);r();},{once:true});
        });
      }
      return fr;
    }
    const JOURNAL_LABELS = { study:'공부 기록장', lecture:'강의 기록장', sleep:'수면 기록장', record:'기타 기록장' };

    function waitDeleteDone(kind){
      return new Promise(resolve => {
        const timer = setTimeout(() => {
          window.removeEventListener('message', onDone);
          resolve(false);
        }, 20000);
        function onDone(ev){
          if(ev.origin !== location.origin) return;
          if(ev.data?.type !== 'journal-delete-done') return;
          if(ev.data?.kind !== kind) return;
          clearTimeout(timer);
          window.removeEventListener('message', onDone);
          resolve(ev.data.ok !== false);
        }
        window.addEventListener('message', onDone);
      });
    }

    async function waitChildReady(frame, timeoutMs=6000){
      return new Promise(resolve=>{
        const start = Date.now();
        (function tick(){
          try{
            if(frame?.contentWindow?.__journalReady === true) return resolve(true);
          }catch(e){}
          if(Date.now() - start > timeoutMs) return resolve(false);
          setTimeout(tick, 100);
        })();
      });
    }

    async function deleteOneJournal(kind){
      const fr = await ensureDeleteFrame(kind);

      const ready = await waitChildReady(fr, 30000);
      if(!ready){
        console.warn(`[delete] ${kind} 프레임 준비 실패 — 스킵`);
        return false;
      }

      const win = fr.contentWindow;
      if(!win){ alert(`${JOURNAL_LABELS[kind]} 프레임을 찾지 못했습니다.`); return false; }

      try{
        win.__skipDeleteConfirm = true;
      }catch(e){}

      const wait = waitDeleteDone(kind);
      win.postMessage({type:'journal-delete-request', kind}, location.origin);
      return wait.finally(() => {
        try{
          win.__skipDeleteConfirm = false;
        }catch(e){}
      });
    }

    const oneButtons = {
      study:   document.getElementById('sharedDeleteStudy'),
      lecture: document.getElementById('sharedDeleteLecture'),
      sleep:   document.getElementById('sharedDeleteSleep'),
      record:  document.getElementById('sharedDeleteRecord')
    };
    Object.entries(oneButtons).forEach(([kind, btn]) => {
      btn.addEventListener('click', async () => {
        if(btn.dataset.busy === '1') return;
        if(!confirm(`${JOURNAL_LABELS[kind]} 데이터를 모두 삭제하시겠습니까?\n\n삭제한 기록은 복구할 수 없습니다.`)) return;
        btn.dataset.busy = '1';
        try{
          const ok = await deleteOneJournal(kind);
          if(ok){
            alert(`✅ ${JOURNAL_LABELS[kind]} 데이터가 삭제되었습니다.`);
          }else{
            alert(`❌ ${JOURNAL_LABELS[kind]} 삭제에 실패했습니다.\n다시 시도해주세요.`);
          }
        }catch(e){
          alert(`❌ ${JOURNAL_LABELS[kind]} 삭제 중 오류: ${e?.message || e}`);
        }
        finally{ setTimeout(()=>{ btn.dataset.busy = '0'; }, 500); }
      });
    });

    const del = document.getElementById('sharedDeleteAll');
    del.addEventListener('click', () => {
      if(del.dataset.busy === '1') return;
      if(!confirm('공부 · 강의 · 수면 · 기타 기록 데이터를 모두 삭제하시겠습니까?\n\n삭제한 기록은 복구할 수 없습니다.')) return;

      del.dataset.busy = '1';
      const originalText = del.textContent;
      del.textContent = '삭제 중…';
      del.disabled = true;

      (async () => { const kinds = ['study','lecture','sleep','record']; const results = []; for (const k of kinds) { try { const v = await deleteOneJournal(k); results.push({status:'fulfilled', value:v}); } catch(e) { results.push({status:'rejected', reason:e}); } await new Promise(r=>setTimeout(r,800)); } return results; })()
        .then((results) => {
          const failed = results
            .map((r, i) => (r.status === 'fulfilled' && r.value === true) ? null : ['study','lecture','sleep','record'][i])
            .filter(Boolean);
          if(failed.length === 0){
            alert('✅ 공부 · 강의 · 수면 · 기타 기록이 모두 삭제되었습니다.');
          }else{
            alert(`❌ 일부 기록 삭제 실패: ${failed.map(k => JOURNAL_LABELS[k]).join(', ')}\n다시 시도해주세요.`);
          }
          del.dataset.busy = '0';
          del.disabled = false;
          del.textContent = originalText;
        })
        .catch((e) => {
          alert(`❌ 전체 삭제 중 오류: ${e?.message || e}`);
          del.dataset.busy = '0';
          del.disabled = false;
          del.textContent = originalText;
        });
    });
  }
  initSharedSettingsUI();

  loadSharedSettingsFromCloud()
    .then(()=>{
      sharedSettingsLoaded = true;
      notifySharedSettings(sharedSettingsCache);
    })
    .catch(e => console.warn('[FIX3] 초기 설정 브로드캐스트 실패', e));

  const baseTabLabels={study:'📚 공부 기록장',lecture:'🎓 강의 기록장',sleep:'🌙 수면 기록장',record:'📝 기타 기록장'};
  const recordingTabLabels={study:'공부 기록장',lecture:'강의 기록장',sleep:'수면 기록장',record:'기타 기록장'};
  function setExclusiveTabStatus(kind){
    Object.entries(tabs).forEach(([key,item])=>{
      item.button.textContent=key===kind?recordingTabLabels[key]:baseTabLabels[key];
      item.button.classList.toggle('recording',key===kind);
    });
  }

  const exclusiveFrames={study:tabs.study.frame,lecture:tabs.lecture.frame,sleep:tabs.sleep.frame};
  let exclusiveActive=null;

  (function(){
    function kindFromYm(ym){
      const s = String(ym||'');
      if(s.startsWith('L:')) return 'lecture';
      if(s.startsWith('S:')) return 'sleep';
      if(s.startsWith('R:')) return null;
      if(/^\d{4}-\d{2}$/.test(s)) return 'study';
      return null;
    }

    function kindFromMonthYm(ym){
      const s = String(ym||'');
      if(s.startsWith('L:')) return 'lecture';
      if(s.startsWith('S:')) return 'sleep';
      if(s.startsWith('R:')) return 'record';
      if(/^\d{4}-\d{2}$/.test(s)) return 'study';
      return null;
    }

    let ch = null;
    let chGeneration = 0;
    let realtimeRetryTimer = null;
    let realtimeSubscribed = false;

    function updateSyncConnectionStatus(){
      const el = document.getElementById('syncConnectionStatus');
      const textEl = document.getElementById('syncConnectionText');
      if(!el || !textEl) return;

      el.classList.remove('online','offline');
      if(navigator.onLine === false){
        el.classList.add('offline');
        textEl.textContent = '오프라인';
        return;
      }
      if(realtimeSubscribed){
        el.classList.add('online');
        textEl.textContent = '온라인';
        return;
      }
      textEl.textContent = '서버 연결 중';
    }

    updateSyncConnectionStatus();

    let centralPollTimer = null;
    let centralPollBusy = false;
    let centralLastMonthSyncAt = null;
    let centralUserId = null;
    let centralActiveTimerRow = null;
    let centralLastPollAt = 0;
    let centralLastActiveFetchAt = 0;
    let centralActiveFetchBusy = false;
    let centralActiveFetchPendingAutoSwitch = false;
    const centralMonthBroadcastSig = new Map();

    let centralServerClockOffsetMs = 0;
    let centralServerClockCalibrated = false;
    let centralServerClockLastCalibratedAt = 0;
    let centralServerClockPromise = null;

    const CENTRAL_POLL_MS = 15 * 60 * 1000;
    const CENTRAL_CLOCK_MAX_AGE_MS = 5 * 60 * 1000;

    function postToFrame(target, msg){
      if(!target) return;

      try{
        // iframe element
        if(target.contentWindow){
          if(!target.getAttribute?.('src')) return;
          target.contentWindow.postMessage(msg, location.origin);
          return;
        }

        // WindowProxy (e.g. event.source)
        if(typeof target.postMessage === 'function'){
          target.postMessage(msg, location.origin);
        }
      }catch(_){}
    }

    function sendCentralServerClock(target=null){
      if(!centralServerClockCalibrated) return;
      const msg={
        type:'journal-server-clock',
        offset:centralServerClockOffsetMs,
        calibratedAt:centralServerClockLastCalibratedAt
      };
      if(target){
        postToFrame(target, msg);
        return;
      }
      for(const item of Object.values(tabs)) postToFrame(item.frame, msg);
    }

    async function calibrateCentralServerClock(force=false){
      if(!force && centralServerClockCalibrated && Date.now()-centralServerClockLastCalibratedAt < CENTRAL_CLOCK_MAX_AGE_MS){
        return centralServerClockOffsetMs;
      }
      if(centralServerClockPromise) return centralServerClockPromise;

      const sb=initSettingsClient();
      if(!sb) return centralServerClockOffsetMs;

      centralServerClockPromise=(async()=>{
        try{
          const {data:{session}}=await sb.auth.getSession();
          if(!session?.user) return centralServerClockOffsetMs;
          const t0=Date.now();
          const {data,error}=await sb.rpc('server_now');
          const t1=Date.now();
          if(error) throw error;
          const serverMs=Date.parse(data);
          if(!Number.isFinite(serverMs)) throw new Error('서버 시간을 읽지 못했습니다.');
          centralServerClockOffsetMs=Math.round(serverMs-((t0+t1)/2));
          centralServerClockCalibrated=true;
          centralServerClockLastCalibratedAt=Date.now();
          sendCentralServerClock();
        }catch(e){
          console.warn('[central] 서버 시계 보정 실패:', e);
        }finally{
          centralServerClockPromise=null;
        }
        return centralServerClockOffsetMs;
      })();

      return centralServerClockPromise;
    }

    function broadcastActiveTimer(row, source='realtime'){
      centralActiveTimerRow = row || null;
      for(const item of Object.values(tabs)){
        postToFrame(item.frame, {
          type:'journal-central-active-timer',
          row: centralActiveTimerRow,
          source
        });
      }
    }

    function broadcastMonthRow(row, source='realtime'){
      if(!row || !row.ym) return;
      const kind = kindFromMonthYm(row.ym);
      const item = kind ? tabs[kind] : null;
      if(!item) return;

      const sig=`${row.updated_at||''}|${row.deleted_at||''}`;
      if(centralMonthBroadcastSig.get(String(row.ym)) === sig) return;
      centralMonthBroadcastSig.set(String(row.ym), sig);

      postToFrame(item.frame, {
        type:'journal-central-month-row',
        row,
        source
      });
    }

    function broadcastMonthDeleted(ym){
      const kind=kindFromMonthYm(ym);
      const item=kind ? tabs[kind] : null;
      if(!item) return;
      centralMonthBroadcastSig.delete(String(ym||''));
      postToFrame(item.frame, {
        type:'journal-central-month-deleted',
        ym:String(ym||'')
      });
    }

    function pushCentralStateToFrame(frame){
      postToFrame(frame, {
        type:'journal-central-active-timer',
        row: centralActiveTimerRow,
        source:'snapshot'
      });
      sendCentralServerClock(frame);
    }

    Object.values(tabs).forEach(item=>{
      item.frame.addEventListener('load', ()=>{
        setTimeout(()=>pushCentralStateToFrame(item.frame), 0);
      });
    });

    function clearRealtimeRetry(){
      if(realtimeRetryTimer){
        clearTimeout(realtimeRetryTimer);
        realtimeRetryTimer = null;
      }
    }

    function scheduleRealtimeRetry(delay=5000){
      clearRealtimeRetry();
      realtimeRetryTimer = setTimeout(()=>{
        realtimeRetryTimer = null;
        startRealtime(0);
      }, delay);
    }

    function stopCentralPollTimer(){
      if(centralPollTimer){
        clearInterval(centralPollTimer);
        centralPollTimer = null;
      }
    }

    function startCentralPollTimer(){
      if(centralPollTimer) return;
      centralPollTimer = setInterval(()=>{
        if(document.visibilityState === 'hidden') return;
        // active_timer is polled only when Realtime is unavailable.
        if(!ch) void fetchOnce(false, false);
        void centralPoll(false);
      }, CENTRAL_POLL_MS);
    }

    function resetCentralUser(userId){
      const id = userId || null;
      if(centralUserId === id) return;
      centralUserId = id;
      centralLastMonthSyncAt = null;
      centralActiveTimerRow = null;
      centralLastPollAt = 0;
      centralLastActiveFetchAt = 0;
      centralMonthBroadcastSig.clear();
    }

    function advanceCentralMonthCursor(rows){
      let maxMs = Number.isFinite(Date.parse(centralLastMonthSyncAt || ''))
        ? Date.parse(centralLastMonthSyncAt)
        : -Infinity;

      for(const row of (rows || [])){
        const ms = Date.parse(row?.updated_at || '');
        if(Number.isFinite(ms) && ms > maxMs) maxMs = ms;
      }

      if(Number.isFinite(maxMs)){
        centralLastMonthSyncAt = new Date(maxMs).toISOString();
      }
    }

    function applyFromRow(row, opts){
      const autoSwitch = opts && opts.autoSwitch === true;
      const prevActive = exclusiveActive;

      if(row && row.status === 'running'){
        const kind = kindFromYm(row.ym);
        if(kind && tabs[kind]){
          exclusiveActive = kind;
          setExclusiveTabStatus(kind);

          if(autoSwitch && prevActive !== kind){
            const a = document.activeElement;
            const isTyping = !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable));
            if(!isTyping){
              try{ openTab(kind, true); }catch(_){}
            }
          }
          return;
        }
      }

      exclusiveActive = null;
      setExclusiveTabStatus(null);
    }

    function handleActiveRow(row, opts={}){
      const normalized = row && Object.keys(row).length ? row : null;
      centralActiveTimerRow = normalized;
      applyFromRow(normalized, opts);
      broadcastActiveTimer(normalized, opts.source || 'realtime');
    }

    async function fetchOnce(autoSwitch, force=false){
      const sb = initSettingsClient();
      if(!sb) return;
      if(centralActiveFetchBusy){
        if(autoSwitch === true) centralActiveFetchPendingAutoSwitch = true;
        return;
      }
      if(!force && Date.now()-centralLastActiveFetchAt < 30000){
        if(autoSwitch === true){
          applyFromRow(centralActiveTimerRow, {autoSwitch:true});
        }
        return;
      }

      centralActiveFetchBusy=true;
      let fetchedOk=false;
      try{
        const {data:{session}} = await sb.auth.getSession();
        const user = session?.user;
        if(!user) return;

        resetCentralUser(user.id);

        const {data:row,error} = await sb.from('active_timer')
          .select('*')
          .eq('user_id', user.id)
          .maybeSingle();

        if(error) throw error;

        handleActiveRow(row, {
          autoSwitch: autoSwitch === true,
          source:'fetch'
        });
        fetchedOk=true;
        centralLastActiveFetchAt=Date.now();
      }catch(e){
        console.warn('[central] active_timer 조회 실패:', e);
      }finally{
        centralActiveFetchBusy=false;
        const needSwitch=centralActiveFetchPendingAutoSwitch;
        centralActiveFetchPendingAutoSwitch=false;
        if(needSwitch){
          if(fetchedOk) applyFromRow(centralActiveTimerRow, {autoSwitch:true});
          else void fetchOnce(true, true);
        }
      }
    }

    async function centralPoll(force=false){
      const sb = initSettingsClient();
      if(!sb || centralPollBusy) return;

      const now = Date.now();
      if(!force && now - centralLastPollAt < 30000) return;

      centralPollBusy = true;
      try{
        const {data:{session}} = await sb.auth.getSession();
        const user = session?.user;
        if(!user) return;

        resetCentralUser(user.id);

        let monthQuery = sb.from('study_months')
          .select('ym,data,updated_at,deleted_at,user_id')
          .eq('user_id', user.id)
          .order('updated_at', {ascending:true});

        // Cursor is advanced only from rows actually received.
        // gte intentionally re-reads the latest timestamp as a tiny overlap,
        // avoiding a same-timestamp edge case without using "now - N seconds".
        if(centralLastMonthSyncAt){
          monthQuery = monthQuery.gte('updated_at', centralLastMonthSyncAt);
        }

        const monthRes = await monthQuery;

        if(monthRes.error){
          console.warn('[central] study_months 폴링 실패:', monthRes.error);
        }else{
          const rows = monthRes.data || [];
          for(const row of rows) broadcastMonthRow(row, 'poll');
          advanceCentralMonthCursor(rows);
        }

        centralLastPollAt = Date.now();
      }catch(e){
        console.warn('[central] 폴링 실패:', e);
      }finally{
        centralPollBusy = false;
      }
    }

    async function stopRealtime(){
      clearRealtimeRetry();
      stopCentralPollTimer();
      chGeneration++;

      const old = ch;
      ch = null;
      realtimeSubscribed = false;
      updateSyncConnectionStatus();

      if(old){
        const sb = initSettingsClient();
        try{
          if(sb) await sb.removeChannel(old);
          else await old.unsubscribe();
        }catch(_){
          try{ await old.unsubscribe(); }catch(__){}
        }
      }

      resetCentralUser(null);
      exclusiveActive = null;
      setExclusiveTabStatus(null);
      broadcastActiveTimer(null, 'signed-out');
    }

    function startRealtime(retry=0){
      const sb = initSettingsClient();
      if(!sb || ch) return;

      const generation = ++chGeneration;

      sb.auth.getSession().then(({data:{session}})=>{
        if(generation !== chGeneration || ch) return;

        const user = session?.user;
        if(!user){
          if(retry < 20){
            clearRealtimeRetry();
            realtimeRetryTimer = setTimeout(()=>{
              realtimeRetryTimer = null;
              startRealtime(retry + 1);
            }, 500 + retry * 200);
          }
          return;
        }

        resetCentralUser(user.id);

        if(generation !== chGeneration || ch) return;

        // Parent owns the only journal Realtime channel.
        // It carries both active_timer and study_months changes.
        const next = sb.channel(`journal-central-${user.id}-${generation}`)
          .on(
            'postgres_changes',
            {event:'*',schema:'public',table:'active_timer',filter:`user_id=eq.${user.id}`},
            (payload)=>{
              const row = payload?.new && Object.keys(payload.new).length
                ? payload.new
                : null;
              handleActiveRow(row, {
                autoSwitch:true,
                source:'realtime'
              });
            }
          )
          .on(
            'postgres_changes',
            {event:'*',schema:'public',table:'study_months',filter:`user_id=eq.${user.id}`},
            (payload)=>{
              const row = payload?.new && Object.keys(payload.new).length
                ? payload.new
                : null;

              if(row){
                broadcastMonthRow(row, 'realtime');
                return;
              }

              // Hard DELETE is rare; soft deletes arrive as UPDATE with deleted_at.
              // Parent already knows exactly which ym disappeared, so no child re-query is needed.
              const oldYm = payload?.old?.ym;
              if(oldYm){
                broadcastMonthDeleted(oldYm);
              }else{
                for(const item of Object.values(tabs)){
                  postToFrame(item.frame, {type:'journal-central-force-sync'});
                }
              }
            }
          );

        ch = next;
        startCentralPollTimer();

        next.subscribe((status)=>{
          if(ch !== next) return;

          if(status === 'SUBSCRIBED'){
            realtimeSubscribed = true;
            updateSyncConnectionStatus();
            void fetchOnce(true, true);
            void calibrateCentralServerClock(false);
            void centralPoll(true);
            return;
          }

          if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
            realtimeSubscribed = false;
            updateSyncConnectionStatus();
            ch = null;

            Promise.resolve(sb.removeChannel(next))
              .catch(async ()=>{
                try{ await next.unsubscribe(); }catch(_){}
              })
              .finally(()=>{
                if(generation === chGeneration){
                  scheduleRealtimeRetry(5000);
                }
              });
          }
        });
      }).catch(()=>{
        if(generation === chGeneration && !ch){
          scheduleRealtimeRetry(5000);
        }
      });
    }

    window.refreshExclusiveServerState = fetchOnce;
    window.stopExclusiveTabRealtime = ()=>{ void stopRealtime(); };
    window.restartExclusiveTabRealtime = ()=>{
      void stopRealtime().finally(()=>startRealtime(0));
    };
    window.runCentralJournalSync = ()=>centralPoll(true);
    window.runWidgetSync = async ()=>{
      while(centralPollBusy) await new Promise(resolve=>setTimeout(resolve,100));
      await centralPoll(true);
      // 강의·수면 화면이 모두 로드되고 자기 타이머를 위젯에 보낼 시간을 준 뒤에 종료
      try{
        await Promise.race([
          window.__preloadFramesPromise||Promise.resolve(),
          new Promise(r=>setTimeout(r,9000))
        ]);
      }catch(_){}
      setTimeout(()=>window.NativeWidget?.finishBackgroundSync?.(), 4500);
    };
    window.getCentralActiveTimerSnapshot = ()=>{
      return centralActiveTimerRow ? {...centralActiveTimerRow} : null;
    };

    window.addEventListener('message', (ev)=>{
      if(ev.origin !== location.origin) return;

      if(ev.data?.type === 'journal-request-server-clock'){
        const forceClock=ev.data?.force === true;
        if(!forceClock && centralServerClockCalibrated && Date.now()-centralServerClockLastCalibratedAt < CENTRAL_CLOCK_MAX_AGE_MS){
          sendCentralServerClock(ev.source);
        }else{
          void calibrateCentralServerClock(forceClock).finally(()=>sendCentralServerClock(ev.source));
        }
        return;
      }

      if(ev.data?.type !== 'journal-central-sync-request') return;

      pushCentralStateToFrame(ev.source);

      // "full" is reserved for foreground/app-resume recovery.
      // Normal tab changes use the in-memory parent snapshot and do not hit Supabase.
      if(ev.data?.full === true){
        void fetchOnce(false, false);
        void centralPoll(false);
      }
    });

    startRealtime();

    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible'){
        void fetchOnce(false, false);
        void calibrateCentralServerClock(false);
        void centralPoll(false);
      }
    });

    window.addEventListener('pageshow', ()=>{
      void fetchOnce(false, false);
      void calibrateCentralServerClock(false);
      void centralPoll(false);
    });

    // Network can recover while the app stays visible, so do not wait for
    // visibility/pageshow or the next periodic poll. Reconcile immediately.
    window.addEventListener('offline', ()=>{
      updateSyncConnectionStatus();
    });

    window.addEventListener('online', ()=>{
      updateSyncConnectionStatus();
      if(!ch) startRealtime(0);
      void fetchOnce(false, true);
      void calibrateCentralServerClock(false);
      void centralPoll(true);
    });

  })();

  async function ensureExclusiveFrameLoaded(kind){
    const frame=exclusiveFrames[kind];
    if(!frame) return null;
    if(!frame.getAttribute('src') && frame.dataset.src){
      frame.src=frame.dataset.src;
      await new Promise(r=>frame.addEventListener('load',r,{once:true}));
    }else if(frame.getAttribute('src') && (!frame.contentDocument || frame.contentDocument.readyState!=='complete')){
      await new Promise(r=>{
        if(frame.contentDocument && frame.contentDocument.readyState==='complete'){ r(); return; }
        frame.addEventListener('load',r,{once:true});
      });
    }
    return frame;
  }

  async function stopExclusive(kind, atMs){
    const frame=await ensureExclusiveFrameLoaded(kind);
    return new Promise(resolve=>{
      if(!frame?.contentWindow){resolve(true);return}
      const req='stop-'+Date.now()+'-'+Math.random().toString(36).slice(2);
      const timer=setTimeout(()=>{
        window.removeEventListener('message',done);
        console.warn('[FIX5] stopExclusive 응답 타임아웃:', kind);
        resolve(false);
      },3000);
      function done(ev){
        if(ev.origin!==location.origin||ev.source!==frame.contentWindow||
           ev.data?.type!=='exclusive-session-stopped'||ev.data?.req!==req)return;
        clearTimeout(timer);window.removeEventListener('message',done);resolve(ev.data.ok!==false);
      }
      window.addEventListener('message',done);
      frame.contentWindow.postMessage({type:'exclusive-session-stop',kind,req,at:atMs},location.origin);
    });
  }
  window.addEventListener('message',ev=>{
    if(ev.origin!==location.origin)return;
    const type=ev.data?.type;
    if(type==='exclusive-session-ended'){
      window.refreshExclusiveServerState?.();
      return;
    }
    if(type==='exclusive-session-cancel-start'){
      window.refreshExclusiveServerState?.(false, true);
      return;
    }
    if(type!=='exclusive-session-start')return;
    const req=ev.data?.req;
    ev.source?.postMessage({type:'exclusive-session-result',req,ok:true},location.origin);
    window.refreshExclusiveServerState?.();
  });

</script>

 function fmtSet(t){return `⏰️ ${fmt(t)} 알람이 울릴 예정입니다 !`}

   function alignedDue(ms){const n=new Date();n.setSeconds(0,0);return n.getTime()+ms}

   async function fire(){const a=read();if(!a?.enabled)return;clearTimeout(timer);clearInterval(watch);$('#alarmStatus').textContent=fmtSet(a.due);let sounded=false;try{if(!ring){const u=await audioURL();if(u)ring=new Audio(u)}if(ring){ring.loop=true;ring.volume=1;ring.currentTime=0;await ring.play();sounded=!ring.paused}}catch(e){sounded=false}if(!sounded){try{await beep();sounded=true}catch(e){}}try{const buzz=()=>{navigator.vibrate?.([900,250,900,250,1200,300]);notifyRing()};buzz();clearInterval(vibeTimer);vibeTimer=setInterval(buzz,4000)}catch(e){};notifyRing();write({...a,enabled:false,ringing:true});const b=$('#alarmStop');b.hidden=false;b.classList.add('show');b.style.display='inline-block';if(!sounded){$('#alarmStatus').textContent='🔔 알람 시간! (소리 재생이 막혀 진동/알림으로 대신 울리는 중)'}}
   function arm(a){clearTimeout(timer);clearInterval(watch);ui(a);const left=a.due-Date.now();if(left<=0)return fire();timer=setTimeout(fire,left);watch=setInterval(()=>{const x=read();if(x?.enabled&&Date.now()>=x.due)fire()},500)}
   function catchUp(){const x=read();if(!x)return;if(x.enabled&&Date.now()>=x.due){fire()}else if(x.enabled){arm(x)}}
   document.addEventListener('DOMContentLoaded',async()=>{await refreshSounds();$('#alarmSoundSelect').onchange=async()=>{localStorage.setItem(SELECT_KEY,$('#alarmSoundSelect').value);await cacheSelected()};$('#alarmHours').addEventListener('input',e=>{clampAlarmInput(e.target,24);updatePreview()});$('#alarmMinutes').addEventListener('input',e=>{clampAlarmInput(e.target,59);updatePreview()});$('#alarmPreview').onclick=async()=>{await cacheSelected();const u=await audioURL();if(!u)return alert('알람음을 선택해주세요.');try{const preview=new Audio(u);preview.volume=1;await preview.play();setTimeout(()=>{try{preview.pause();preview.currentTime=0}catch(e){}},2500)}catch(e){alert('미리듣기를 재생할 수 없습니다.')}};$('#alarmStart').onclick=async()=>{const h=Math.max(0,Math.min(24,parseInt($('#alarmHours').value)||0)),m=Math.max(0,Math.min(59,parseInt($('#alarmMinutes').value)||0)),ms=(h*60+m)*60000;if(ms<60000)return alert('알람 시간을 1분 이상 설정해주세요.');if(!$('#alarmSoundSelect').value)return alert('알람음을 선택해주세요.');await ensureNotifyPermission();await cacheSelected();stopRing();try{const u=await audioURL();if(u){ring=new Audio(u);ring.loop=true;ring.volume=1;await ring.play();ring.pause();ring.currentTime=0}ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume()}catch(e){}const a={enabled:true,ringing:false,due:alignedDue(ms),sound:$('#alarmSoundSelect').value};write(a);arm(a);try{if(window.NativeAlarm&&typeof window.NativeAlarm.scheduleAt==='function'){window.NativeAlarm.scheduleAt(a.due,'기록장 알람')}}catch(e){console.warn('[Alarm] 네이티브 예약 실패',e)}};$('#alarmCancel').onclick=()=>{if(!confirm('알람을 정말 해제하시겠습니까?'))return;resetAlarm();try{window.NativeAlarm?.cancel?.()}catch(e){}};$('#alarmStop').onclick=()=>{resetAlarm();try{window.NativeAlarm?.cancel?.()}catch(e){}};const a=read();if(a?.sound&&[...$('#alarmSoundSelect').options].some(o=>o.value===a.sound))$('#alarmSoundSelect').value=a.sound;if(a?.enabled)arm(a);else ui(null);window.addEventListener('storage',e=>{if(e.key===KEY){const x=read();if(x?.enabled)arm(x);else ui(null)}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){catchUp()}});window.addEventListener('pageshow',()=>{catchUp()});window.addEventListener('focus',()=>{catchUp()})});
  })();

  function ensureFrameLoaded(kind){
    return new Promise((resolve,reject)=>{
      const frame=tabs[kind]?.frame;
      if(!frame)return reject(new Error('frame not found'));
      const ready=()=>{
        try{
          return !!frame.getAttribute('src')
            && frame.contentWindow?.location?.href!=='about:blank'
            && typeof frame.contentWindow?.collectBackupData==='function'
            && typeof frame.contentWindow?.applyBackupRestore==='function';
        }catch(e){ return false; }
      };
      if(ready()) return resolve(frame);
      if(!frame.getAttribute('src') && frame.dataset.src) frame.src=frame.dataset.src;
      const start=Date.now();
      (function tick(){
        if(ready()) return resolve(frame);
        if(Date.now()-start>15000){
          return reject(new Error('['+kind+'] collectBackupData 함수를 찾지 못했습니다 (타임아웃)'));
        }
        setTimeout(tick,120);
      })();
    });
  }
  let sharedBackupDirectoryHandle=null;
  async function downloadJSON(data,name){
    const text=JSON.stringify(data,null,2);
    if(sharedBackupDirectoryHandle){
      try{
        const permission=await sharedBackupDirectoryHandle.queryPermission({mode:'readwrite'});
        if(permission==='granted'||await sharedBackupDirectoryHandle.requestPermission({mode:'readwrite'})==='granted'){
          const fileHandle=await sharedBackupDirectoryHandle.getFileHandle(name,{create:true});
          const writable=await fileHandle.createWritable();
          await writable.write(text);await writable.close();return;
        }
      }catch(e){}
    }
    /* 안드로이드 앱(WebView)은 blob 다운로드가 안 되므로 네이티브로 저장 */
    if(window.NativeFile&&typeof window.NativeFile.saveTextFile==='function'){
      try{ if(window.NativeFile.saveTextFile(name,'application/json',text))return; }catch(e){}
    }
    const blob=new Blob([text],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function backupDate(){
    const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  async function getJournalBackup(kind){
    const frame=await ensureFrameLoaded(kind);
    const fn=frame.contentWindow?.collectBackupData;
    if(typeof fn!=='function')throw new Error('backup function unavailable');
    return await fn.call(frame.contentWindow);
  }
  function initSharedBackupUI(){
    const main=document.getElementById('sharedBackupBtn'),choice=document.getElementById('sharedBackupChoice');
    const restore=document.getElementById('sharedRestoreBtn'),file=document.getElementById('sharedRestoreFile');
    const locationBtn=document.getElementById('sharedBackupLocationBtn'),locationStatus=document.getElementById('sharedBackupLocationStatus');
    /* 안드로이드 앱: 네이티브 폴더 선택창 사용 (WebView는 showDirectoryPicker 미지원) */
    const hasNativeFolder=!!(window.NativeFile&&typeof window.NativeFile.pickBackupFolder==='function');
    if(hasNativeFolder){
      window.onBackupFolderPicked=(name)=>{locationStatus.textContent=`저장 위치: ${name}`;};
      try{const n=window.NativeFile.getBackupFolderName();if(n)locationStatus.textContent=`저장 위치: ${n}`;}catch(e){}
    }
    locationBtn.addEventListener('click',async()=>{
      if(hasNativeFolder){try{window.NativeFile.pickBackupFolder();}catch(e){alert('저장 위치를 설정하지 못했습니다.');}return;}
      if(typeof window.showDirectoryPicker!=='function'){alert('이 브라우저에서는 저장 위치를 직접 지정할 수 없습니다. 백업 파일은 기본 다운로드 폴더에 저장됩니다.');return;}
      try{
        sharedBackupDirectoryHandle=await window.showDirectoryPicker({mode:'readwrite'});
        locationStatus.textContent=`저장 위치: ${sharedBackupDirectoryHandle.name}`;
      }catch(e){if(e?.name!=='AbortError')alert('저장 위치를 설정하지 못했습니다.');}
    });
    main.addEventListener('click',()=>{const open=!choice.classList.contains('open');choice.classList.toggle('open',open);choice.setAttribute('aria-hidden',String(!open));});
    choice.querySelectorAll('[data-backup-kind]').forEach(btn=>btn.addEventListener('click',async()=>{
      const kind=btn.dataset.backupKind;
      try{
        if(kind==='all'){
          const [study,lecture,sleep,record]=await Promise.all(['study','lecture','sleep','record'].map(getJournalBackup));
          downloadJSON({app:'journal-all',version:2,exportedAt:new Date().toISOString(),study,lecture,sleep,record},`journal-all-backup-${backupDate()}.json`);
        }else{
          const data=await getJournalBackup(kind);
          const names={study:'study-log',lecture:'lecture-log',sleep:'sleep-log'};
          downloadJSON(data,`${names[kind]}-backup-${backupDate()}.json`);
        }
        choice.classList.remove('open');choice.setAttribute('aria-hidden','true');
      }catch(e){alert('백업 파일을 만들지 못했습니다. 잠시 후 다시 시도해주세요.');}
    }));
    restore.addEventListener('click',()=>file.click());
    file.addEventListener('change', async () => {
      const f = file.files?.[0];
      if(!f) return;
      file.value = '';
      try{
        const text = await f.text();
        const backup = JSON.parse(text);
        if(backup?.app !== 'journal-all'){
          alert('전체 백업 파일이 아닙니다. (journal-all-backup-*.json 만 지원)');
          return;
        }
        const sections = ['study','lecture','sleep','record'];
        const labels = {study:'공부',lecture:'강의',sleep:'수면',record:'기타'};
        const counts = sections.map(k => `${labels[k]} ${Object.keys(backup[k]?.months||{}).length}개월`).join('\n');
        const totalMonths = sections.reduce((s,k)=>s+Object.keys(backup[k]?.months||{}).length, 0);
        if(!totalMonths){ alert('백업 파일에 기록이 없습니다.'); return; }
        if(!confirm(`⚠️ 이 백업 파일로 기록을 복원합니다.\n\n백업에 담긴 달만 덮어씁니다.\n백업 이후에 추가된 달과 다른 기록장은 그대로 유지됩니다.\n\n파일 내용:\n${counts}\n\n계속할까요?`)) return;

        const results = {};
        for(const kind of sections){
          try{
            const frame = await ensureFrameLoaded(kind);
            const done = await new Promise((resolve) => {
              const timer = setTimeout(()=>{
                window.removeEventListener('message', onDone);
                resolve({ok:false, error:'응답 시간 초과'});
              }, 60000);
              function onDone(ev){
                if(ev.origin !== location.origin) return;
                if(ev.data?.type !== 'journal-restore-done') return;
                if(ev.data?.kind !== kind) return;
                clearTimeout(timer);
                window.removeEventListener('message', onDone);
                resolve(ev.data);
              }
              window.addEventListener('message', onDone);
              frame.contentWindow.postMessage({
                type:'journal-restore-request',
                kind,
                data: backup[kind] || { months: {} }
              }, location.origin);
            });
            results[kind] = done;
          }catch(e){
            results[kind] = {ok:false, error:String(e?.message||e)};
          }
        }
        const failed = sections.filter(k => !results[k]?.ok);
        if(failed.length === 0){
          alert('✅ 복원 완료\n\n' + sections.map(k => `${labels[k]} ${results[k].months||0}개월`).join('\n'));
        }else{
          alert('⚠️ 일부 복원 실패\n\n' + failed.map(k => `${labels[k]}: ${results[k]?.error||'알 수 없음'}`).join('\n'));
        }
      }catch(e){
        console.error('[restore] 실패', e);
        alert('복원 파일을 읽지 못했습니다: ' + (e?.message||e));
      }
    });
  }
  initSharedBackupUI();

  (function initSnapshotUI(){
    const btn    = document.getElementById('sharedSnapshotBtn');
    const panel  = document.getElementById('sharedSnapshotPanel');
    const list   = document.getElementById('sharedSnapshotList');
    if(!btn || !panel || !list) return;

    async function getSb(){
      const sb = initSettingsClient();
      if(!sb) throw new Error('클라우드 연결 실패');
      const {data:{session}} = await sb.auth.getSession();
      if(!session?.user) throw new Error('로그인이 필요합니다');
      return { sb, user: session.user };
    }

    async function loadSnapshots(){
      list.innerHTML = '<div style="padding:10px;text-align:center;font-size:11px;color:#6b7773;">불러오는 중…</div>';
      try{
        const { sb, user } = await getSb();
        const { data, error } = await sb.from('study_months_snapshots')
          .select('snapshot_at')
          .eq('user_id', user.id)
          .order('snapshot_at', { ascending: false });
        if(error) throw error;

        if(!data || !data.length){
          list.innerHTML = '<div style="padding:14px 8px;text-align:center;font-size:11px;color:#6b7773;line-height:1.5;">아직 스냅샷이 없습니다.<br>매주 일요일 새벽 3시에 자동 생성됩니다.</div>';
          return;
        }
        const counts = {};
        data.forEach(r => { counts[r.snapshot_at] = (counts[r.snapshot_at] || 0) + 1; });
        const dates = Object.keys(counts).sort().reverse();

        list.innerHTML = dates.map(dt => {
          const d = new Date(dt);
          const label = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
          return `<button class="backup-choice-btn" data-snap="${dt}" type="button">${label}</button>`;
        }).join('');

        list.querySelectorAll('[data-snap]').forEach(b => {
          b.addEventListener('click', () => restore(b.dataset.snap));
        });
      }catch(e){
        list.innerHTML = '<div style="padding:12px 8px;text-align:center;font-size:11px;color:#b42318;">불러오기 실패: ' + (e?.message || e) + '</div>';
      }
    }

    async function restore(snapshotAt){
      const d = new Date(snapshotAt);
      const label = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      if(!confirm(`⚠️ ${label} 시점의 스냅샷으로 복원합니다.\n\n이 스냅샷에 담긴 달만 덮어씁니다.\n스냅샷 이후 추가된 기록과 다른 기록장은 그대로 유지됩니다.\n\n계속할까요?`)) return;

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = '복원 중…';
      try{
        const { sb, user } = await getSb();

        const { data: snapRows, error: readErr } = await sb.from('study_months_snapshots')
          .select('ym, data, deleted_at, updated_at')
          .eq('user_id', user.id)
          .eq('snapshot_at', snapshotAt);
        if(readErr) throw readErr;
        if(!snapRows || !snapRows.length) throw new Error('스냅샷 데이터가 없습니다');

      const _prefixOf = ym => {
        const s = String(ym||'');
        if(/^\d{4}-\d{2}$/.test(s)) return 'study';
        if(s.startsWith('L:')) return 'lecture';
        if(s.startsWith('S:')) return 'sleep';
        if(s.startsWith('R:')) return 'record';
        return null;
      };
      const _snapPrefixes = new Set(snapRows.map(r => _prefixOf(r.ym)).filter(Boolean));
      const { data: _curRows } = await sb.from('study_months')
        .select('ym').eq('user_id', user.id);
      const _curPrefixes = new Set((_curRows||[]).map(r => _prefixOf(r.ym)).filter(Boolean));
      const _labels = { study:'공부 기록장', lecture:'강의 기록장', sleep:'수면 기록장', record:'기타 기록장' };
      const _snapHasRealData = snapRows.some(r => {
        const d = r.data || {};
        return Object.values(d).some(day => day && Array.isArray(day.periods) && day.periods.length > 0);
      });
      if(!_snapHasRealData){
        alert('⚠️ 이 스냅샷은 데이터가 비어 있습니다.\n\n스냅샷 생성이 실패한 것으로 보입니다.\n복원을 중단합니다.');
        btn.disabled = false; btn.textContent = orig; return;
      }
      const _willKeep = [..._curPrefixes].filter(p => !_snapPrefixes.has(p));
      const _willRestore = [..._snapPrefixes];
      if(_willKeep.length){
        const _keepNames = _willKeep.map(p => _labels[p] || p).join(', ');
        const _restoreNames = _willRestore.length
          ? _willRestore.map(p => _labels[p] || p).join(', ')
          : '없음';
        if(!confirm(
          `ℹ️ 이 스냅샷에 포함되지 않은 기록장이 있습니다.\n\n` +
          `복원될 기록장: ${_restoreNames}\n` +
          `그대로 유지될 기록장: ${_keepNames}\n\n` +
          `이 스냅샷에 담긴 기록장만 덮어씁니다.\n` +
          `나머지 기록장 데이터는 삭제되지 않고 그대로 유지됩니다.\n\n` +
          `계속할까요?`
        )){
          btn.disabled = false; btn.textContent = orig; return;
        }
      }

        const nowIso = new Date().toISOString();
        const inserts = snapRows.map(r => ({
          user_id: user.id,
          ym: r.ym,
          data: r.data,
          deleted_at: r.deleted_at || null,
          updated_at: nowIso
        }));
        const { error: insErr } = await sb.from('study_months').upsert(inserts, { onConflict: 'user_id,ym' });
        if(insErr) throw insErr;

        try{ await sb.from('active_timer').delete().eq('user_id', user.id); }catch(_){}

        for(const item of Object.values(tabs)){
          try{
            item.frame.contentWindow?.postMessage({ type:'journal-force-refresh' }, location.origin);
          }catch(_){}
        }

        alert(`✅ ${label} 시점으로 복원 완료\n\n${inserts.length}개 기록을 덮어썼습니다.\n(스냅샷에 없던 기록은 그대로 유지됨)`);
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden','true');
      }catch(e){
        console.error('[snapshot restore]', e);
        alert('❌ 스냅샷 복원 실패: ' + (e?.message || e));
      }finally{
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    let _snapLoaded = false;

    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const open = !panel.classList.contains('open');
      panel.classList.toggle('open', open);
      panel.setAttribute('aria-hidden', String(!open));
      if(open){
        list.hidden = false;
        _snapLoaded = false;
        await loadSnapshots();
        _snapLoaded = true;
      }
    });
  })();
</script>

<script id="preload-record-frames">
// 위젯 3칸(공부/강의/수면) 모두 경과 타이머를 보내도록, 탭을 열지 않아도 강의·수면 화면을 미리 로드
let __resolvePreload;
window.__preloadFramesPromise=new Promise(r=>{__resolvePreload=r});
function __loadFrameOnce(id){
  const f=document.getElementById(id);
  if(!f)return Promise.resolve();
  return new Promise(res=>{
    const done=()=>res();
    let ready=false;
    try{ready=!!f.getAttribute('src')&&f.contentDocument&&f.contentDocument.readyState==='complete'}catch(_){}
    if(ready)return res();
    f.addEventListener('load',done,{once:true});
    if(!f.getAttribute('src')&&f.dataset.src)f.src=f.dataset.src;
  });
}
function __preloadFrames(){
  Promise.all([__loadFrameOnce('lectureFrame'),__loadFrameOnce('sleepFrame')]).then(()=>__resolvePreload());
}
// 이미 로드가 끝난 뒤(load 이벤트 이후)에 실행돼도 동작하도록 처리
if(document.readyState==='complete')setTimeout(__preloadFrames,300);
else window.addEventListener('load',()=>setTimeout(__preloadFrames,300));
</script>
<script id="fcm-token-register">
// 이 기기의 푸시 주소(토큰)를 로그인한 계정으로 Supabase(device_tokens)에 등록
(()=>{
  let lastSent='';
  async function register(){
    try{
      const nw=window.NativeWidget;
      if(!nw||typeof nw.getFcmToken!=='function')return;
      const token=nw.getFcmToken();
      if(!token)return;
      const sb=window.getSupabaseClient&&window.getSupabaseClient();
      if(!sb)return;
      const {data}=await sb.auth.getSession();
      const uid=data&&data.session&&data.session.user&&data.session.user.id;
      if(!uid)return;
      const key=uid+'|'+token;
      if(key===lastSent)return;
      const {error}=await sb.from('device_tokens').upsert(
        {user_id:uid,device_id:nw.getDeviceId(),token:token,updated_at:new Date().toISOString()},
        {onConflict:'user_id,device_id'});
      if(!error)lastSent=key;
    }catch(e){}
  }
  setTimeout(register,4000);
  setInterval(register,30000);
})();
</script>
