    if(window.NativeFile&&typeof window.NativeFile.saveTextFile==='function'){
      try{ if(window.NativeFile.saveTextFile(name,'application/json',text))return; }catch(e){}
    }
    const blob=new Blob([text],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function backupDate(){
    const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  async function getJournalBackup(kind){
    const frame=await ensureFrameLoaded(kind);
    const fn=frame.contentWindow?.collectBackupData;
    if(typeof fn!=='function')throw new Error('backup function unavailable');
    return await fn.call(frame.contentWindow);
  }
  function initSharedBackupUI(){
    const main=document.getElementById('sharedBackupBtn'),choice=document.getElementById('sharedBackupChoice');
    const restore=document.getElementById('sharedRestoreBtn'),file=document.getElementById('sharedRestoreFile');
    const locationBtn=document.getElementById('sharedBackupLocationBtn'),locationStatus=document.getElementById('sharedBackupLocationStatus');
    /* 안드로이드 앱: 네이티브 폴더 선택창 사용 (WebView는 showDirectoryPicker 미지원) */
    const hasNativeFolder=!!(window.NativeFile&&typeof window.NativeFile.pickBackupFolder==='function');
    if(hasNativeFolder){
      window.onBackupFolderPicked=(name)=>{locationStatus.textContent=`저장 위치: ${name}`;};
      try{const n=window.NativeFile.getBackupFolderName();if(n)locationStatus.textContent=`저장 위치: ${n}`;}catch(e){}
    }
    locationBtn.addEventListener('click',async()=>{
      if(hasNativeFolder){try{window.NativeFile.pickBackupFolder();}catch(e){alert('저장 위치를 설정하지 못했습니다.');}return;}
      if(typeof window.showDirectoryPicker!=='function'){alert('이 브라우저에서는 저장 위치를 직접 지정할 수 없습니다. 백업 파일은 기본 다운로드 폴더에 저장됩니다.');return;}
      try{
        sharedBackupDirectoryHandle=await window.showDirectoryPicker({mode:'readwrite'});
        locationStatus.textContent=`저장 위치: ${sharedBackupDirectoryHandle.name}`;
      }catch(e){if(e?.name!=='AbortError')alert('저장 위치를 설정하지 못했습니다.');}
    });
    main.addEventListener('click',()=>{const open=!choice.classList.contains('open');choice.classList.toggle('open',open);choice.setAttribute('aria-hidden',String(!open));});
    choice.querySelectorAll('[data-backup-kind]').forEach(btn=>btn.addEventListener('click',async()=>{
      const kind=btn.dataset.backupKind;
      try{
        if(kind==='all'){
          const [study,lecture,sleep,record]=await Promise.all(['study','lecture','sleep','record'].map(getJournalBackup));
          downloadJSON({app:'journal-all',version:2,exportedAt:new Date().toISOString(),study,lecture,sleep,record},`journal-all-backup-${backupDate()}.json`);
        }else{
          const data=await getJournalBackup(kind);
          const names={study:'study-log',lecture:'lecture-log',sleep:'sleep-log'};
          downloadJSON(data,`${names[kind]}-backup-${backupDate()}.json`);
        }
        choice.classList.remove('open');choice.setAttribute('aria-hidden','true');
      }catch(e){alert('백업 파일을 만들지 못했습니다. 잠시 후 다시 시도해주세요.');}
    }));
    restore.addEventListener('click',()=>file.click());
    file.addEventListener('change', async () => {
      const f = file.files?.[0];
      if(!f) return;
      file.value = '';
      try{
        const text = await f.text();
        const backup = JSON.parse(text);
        if(backup?.app !== 'journal-all'){
          alert('전체 백업 파일이 아닙니다. (journal-all-backup-*.json 만 지원)');
          return;
        }
        const sections = ['study','lecture','sleep','record'];
        const labels = {study:'공부',lecture:'강의',sleep:'수면',record:'기타'};
        const counts = sections.map(k => `${labels[k]} ${Object.keys(backup[k]?.months||{}).length}개월`).join('\n');
        const totalMonths = sections.reduce((s,k)=>s+Object.keys(backup[k]?.months||{}).length, 0);
        if(!totalMonths){ alert('백업 파일에 기록이 없습니다.'); return; }
        if(!confirm(`⚠️ 이 백업 파일로 기록을 복원합니다.\n\n백업에 담긴 달만 덮어씁니다.\n백업 이후에 추가된 달과 다른 기록장은 그대로 유지됩니다.\n\n파일 내용:\n${counts}\n\n계속할까요?`)) return;

        const results = {};
        for(const kind of sections){
          try{
            const frame = await ensureFrameLoaded(kind);
            const done = await new Promise((resolve) => {
              const timer = setTimeout(()=>{
                window.removeEventListener('message', onDone);
                resolve({ok:false, error:'응답 시간 초과'});
              }, 60000);
              function onDone(ev){
                if(ev.origin !== location.origin) return;
                if(ev.data?.type !== 'journal-restore-done') return;
                if(ev.data?.kind !== kind) return;
                clearTimeout(timer);
                window.removeEventListener('message', onDone);
                resolve(ev.data);
              }
              window.addEventListener('message', onDone);
              frame.contentWindow.postMessage({
                type:'journal-restore-request',
                kind,
                data: backup[kind] || { months: {} }
              }, location.origin);
            });
            results[kind] = done;
          }catch(e){
            results[kind] = {ok:false, error:String(e?.message||e)};
          }
        }
        const failed = sections.filter(k => !results[k]?.ok);
        if(failed.length === 0){
          alert('✅ 복원 완료\n\n' + sections.map(k => `${labels[k]} ${results[k].months||0}개월`).join('\n'));
        }else{
          alert('⚠️ 일부 복원 실패\n\n' + failed.map(k => `${labels[k]}: ${results[k]?.error||'알 수 없음'}`).join('\n'));
        }
      }catch(e){
        console.error('[restore] 실패', e);
        alert('복원 파일을 읽지 못했습니다: ' + (e?.message||e));
      }
    });
  }
  initSharedBackupUI();

  (function initSnapshotUI(){
    const btn    = document.getElementById('sharedSnapshotBtn');
    const panel  = document.getElementById('sharedSnapshotPanel');
    const list   = document.getElementById('sharedSnapshotList');
    if(!btn || !panel || !list) return;

    async function getSb(){
      const sb = initSettingsClient();
      if(!sb) throw new Error('클라우드 연결 실패');
      const {data:{session}} = await sb.auth.getSession();
      if(!session?.user) throw new Error('로그인이 필요합니다');
      return { sb, user: session.user };
    }

    async function loadSnapshots(){
      list.innerHTML = '<div style="padding:10px;text-align:center;font-size:11px;color:#6b7773;">불러오는 중…</div>';
      try{
        const { sb, user } = await getSb();
        const { data, error } = await sb.from('study_months_snapshots')
          .select('snapshot_at')
          .eq('user_id', user.id)
          .order('snapshot_at', { ascending: false });
        if(error) throw error;

        if(!data || !data.length){
          list.innerHTML = '<div style="padding:14px 8px;text-align:center;font-size:11px;color:#6b7773;line-height:1.5;">아직 스냅샷이 없습니다.<br>매주 일요일 새벽 3시에 자동 생성됩니다.</div>';
          return;
        }
        const counts = {};
        data.forEach(r => { counts[r.snapshot_at] = (counts[r.snapshot_at] || 0) + 1; });
        const dates = Object.keys(counts).sort().reverse();

        list.innerHTML = dates.map(dt => {
          const d = new Date(dt);
          const label = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
          return `<button class="backup-choice-btn" data-snap="${dt}" type="button">${label}</button>`;
        }).join('');

        list.querySelectorAll('[data-snap]').forEach(b => {
          b.addEventListener('click', () => restore(b.dataset.snap));
        });
      }catch(e){
        list.innerHTML = '<div style="padding:12px 8px;text-align:center;font-size:11px;color:#b42318;">불러오기 실패: ' + (e?.message || e) + '</div>';
      }
    }

    async function restore(snapshotAt){
      const d = new Date(snapshotAt);
      const label = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      if(!confirm(`⚠️ ${label} 시점의 스냅샷으로 복원합니다.\n\n이 스냅샷에 담긴 달만 덮어씁니다.\n스냅샷 이후 추가된 기록과 다른 기록장은 그대로 유지됩니다.\n\n계속할까요?`)) return;

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = '복원 중…';
      try{
        const { sb, user } = await getSb();

        const { data: snapRows, error: readErr } = await sb.from('study_months_snapshots')
          .select('ym, data, deleted_at, updated_at')
          .eq('user_id', user.id)
          .eq('snapshot_at', snapshotAt);
        if(readErr) throw readErr;
        if(!snapRows || !snapRows.length) throw new Error('스냅샷 데이터가 없습니다');

      const _prefixOf = ym => {
        const s = String(ym||'');
        if(/^\d{4}-\d{2}$/.test(s)) return 'study';
        if(s.startsWith('L:')) return 'lecture';
        if(s.startsWith('S:')) return 'sleep';
        if(s.startsWith('R:')) return 'record';
        return null;
      };
      const _snapPrefixes = new Set(snapRows.map(r => _prefixOf(r.ym)).filter(Boolean));
      const { data: _curRows } = await sb.from('study_months')
        .select('ym').eq('user_id', user.id);
      const _curPrefixes = new Set((_curRows||[]).map(r => _prefixOf(r.ym)).filter(Boolean));
      const _labels = { study:'공부 기록장', lecture:'강의 기록장', sleep:'수면 기록장', record:'기타 기록장' };
      const _snapHasRealData = snapRows.some(r => {
        const d = r.data || {};
        return Object.values(d).some(day => day && Array.isArray(day.periods) && day.periods.length > 0);
      });
      if(!_snapHasRealData){
        alert('⚠️ 이 스냅샷은 데이터가 비어 있습니다.\n\n스냅샷 생성이 실패한 것으로 보입니다.\n복원을 중단합니다.');
        btn.disabled = false; btn.textContent = orig; return;
      }
      const _willKeep = [..._curPrefixes].filter(p => !_snapPrefixes.has(p));
      const _willRestore = [..._snapPrefixes];
      if(_willKeep.length){
        const _keepNames = _willKeep.map(p => _labels[p] || p).join(', ');
        const _restoreNames = _willRestore.length
          ? _willRestore.map(p => _labels[p] || p).join(', ')
          : '없음';
        if(!confirm(
          `ℹ️ 이 스냅샷에 포함되지 않은 기록장이 있습니다.\n\n` +
          `복원될 기록장: ${_restoreNames}\n` +
          `그대로 유지될 기록장: ${_keepNames}\n\n` +
          `이 스냅샷에 담긴 기록장만 덮어씁니다.\n` +
          `나머지 기록장 데이터는 삭제되지 않고 그대로 유지됩니다.\n\n` +
          `계속할까요?`
        )){
          btn.disabled = false; btn.textContent = orig; return;
        }
      }

        const nowIso = new Date().toISOString();
        const inserts = snapRows.map(r => ({
          user_id: user.id,
          ym: r.ym,
          data: r.data,
          deleted_at: r.deleted_at || null,
          updated_at: nowIso
        }));
        const { error: insErr } = await sb.from('study_months').upsert(inserts, { onConflict: 'user_id,ym' });
        if(insErr) throw insErr;

        try{ await sb.from('active_timer').delete().eq('user_id', user.id); }catch(_){}

        for(const item of Object.values(tabs)){
          try{
            item.frame.contentWindow?.postMessage({ type:'journal-force-refresh' }, location.origin);
          }catch(_){}
        }

        alert(`✅ ${label} 시점으로 복원 완료\n\n${inserts.length}개 기록을 덮어썼습니다.\n(스냅샷에 없던 기록은 그대로 유지됨)`);
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden','true');
      }catch(e){
        console.error('[snapshot restore]', e);
        alert('❌ 스냅샷 복원 실패: ' + (e?.message || e));
      }finally{
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    let _snapLoaded = false;

    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const open = !panel.classList.contains('open');
      panel.classList.toggle('open', open);
      panel.setAttribute('aria-hidden', String(!open));
      if(open){
        list.hidden = false;
        _snapLoaded = false;
        await loadSnapshots();
        _snapLoaded = true;
      }
    });
  })();
</script>

<script id="preload-record-frames">
// 위젯 3칸(공부/강의/수면) 모두 경과 타이머를 보내도록, 탭을 열지 않아도 강의·수면 화면을 미리 로드
let __resolvePreload;
window.__preloadFramesPromise=new Promise(r=>{__resolvePreload=r});
function __loadFrameOnce(id){
  const f=document.getElementById(id);
  if(!f)return Promise.resolve();
  return new Promise(res=>{
    const done=()=>res();
    let ready=false;
    try{ready=!!f.getAttribute('src')&&f.contentDocument&&f.contentDocument.readyState==='complete'}catch(_){}
    if(ready)return res();
    f.addEventListener('load',done,{once:true});
    if(!f.getAttribute('src')&&f.dataset.src)f.src=f.dataset.src;
  });
}
function __preloadFrames(){
  // 위젯의 시작/종료 액션에서는 대상 기록장만 로드합니다.
  // 다른 두 프레임까지 미리 로드하면 각 화면의 초기 동기화가 서로의
  // 경과 타이머 상태를 빈 값으로 덮어쓰는 경쟁 조건이 생길 수 있습니다.
  const qp=new URLSearchParams(location.search);
  const actionKind=qp.get('widget_kind') || '';
  if(qp.get('widget_action') && actionKind){
    const targetId = actionKind==='lecture' ? 'lectureFrame'
      : actionKind==='sleep' ? 'sleepFrame'
      : 'studyFrame';
    __loadFrameOnce(targetId).then(()=>__resolvePreload());
    return;
  }
  Promise.all([__loadFrameOnce('lectureFrame'),__loadFrameOnce('sleepFrame')]).then(()=>__resolvePreload());
}
// 이미 로드가 끝난 뒤(load 이벤트 이후)에 실행돼도 동작하도록 처리
if(document.readyState==='complete')setTimeout(__preloadFrames,300);
else window.addEventListener('load',()=>setTimeout(__preloadFrames,300));
</script>
<script id="widget-action-runner">
// 새 위젯(시작/종료 버튼)이 숨은 화면(?bg=1)에서 호출: 해당 기록장 화면의 시작/종료 버튼을 그대로 눌러 준다.
// 결과는 NativeWidget.widgetActionDone 으로 전달: ok / already / need_input / login / offline / fail / error
(()=>{
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const ATTR={study:'data-study-action',lecture:'data-lecture-action',sleep:'data-lecture-action'};
  const FRAME={study:'studyFrame',lecture:'lectureFrame',sleep:'sleepFrame'};
  const report=r=>{try{window.NativeWidget&&window.NativeWidget.widgetActionDone&&window.NativeWidget.widgetActionDone(String(r))}catch(_){}};
  async function waitFor(fn,timeout,step=150){
    const t0=Date.now();
    for(;;){
      let v=null;
      try{v=fn()}catch(_){}
      if(v) return v;
      if(Date.now()-t0>timeout) return null;
      await sleep(step);
    }
  }
  function latest(doc,attr){
    const list=Array.from(doc.querySelectorAll('#periodList button['+attr+']'));
    if(!list.length) return {idx:-1,btns:{}};
    const max=Math.max(...list.map(b=>Number(b.dataset.idx)));
    const btns={};
    list.filter(b=>Number(b.dataset.idx)===max).forEach(b=>{btns[b.getAttribute(attr)]=b});
    return {idx:max,btns};
  }
  // 공부 화면: 위젯에서는 시작/종료 페이지를 1로 채워 제한 없이 시작·종료할 수 있게 한다.
  // 앱에서 이미 입력한 값은 덮어쓰지 않고, 비어 있는 칸만 채운다. (앱의 입력 처리 경로를 그대로 사용)
  async function settle(win){
    await sleep(200);
    await waitFor(()=>win.eval('userActionCount')===0,8000,100);
    await sleep(300);
  }
  function pageInput(doc,idx,key){
    return doc.querySelector('#periodList input[data-k="'+key+'"][data-idx="'+idx+'"]');
  }
  async function fillBlankPage(doc,win,idx,key,val){
    const el=pageInput(doc,idx,key);
    if(!el||el.disabled) return false;
    if(String(el.value||'').trim()!=='') return true;
    el.value=String(val);
    el.dispatchEvent(new Event('input',{bubbles:true}));
    await settle(win);
    return true;
  }
  async function fillStartPage(doc,win,idx){
    return fillBlankPage(doc,win,idx,'startPage',1);
  }
  async function fillEndPage(doc,win,idx){
    // 시작 페이지가 1보다 크면(앱에서 직접 입력한 경우) 종료 < 시작 오류가 나지 않도록 시작 페이지와 같은 값으로 채움
    const sp=pageInput(doc,idx,'startPage');
    const n=sp?parseInt(String(sp.value||'').trim(),10):1;
    return fillBlankPage(doc,win,idx,'endPage',Number.isFinite(n)&&n>1?n:1);
  }
  window.runWidgetAction=async(kind,action)=>{
    try{
      if(!FRAME[kind]||(action!=='start'&&action!=='end')){report('error');return}
      if(navigator.onLine===false){report('offline');return}
      await __loadFrameOnce(FRAME[kind]);
      const frame=document.getElementById(FRAME[kind]);
      const attr=ATTR[kind];
      const doc=await waitFor(()=>{
        const d=frame.contentDocument;
        return d&&d.readyState==='complete'&&d.getElementById('periodList')?d:null;
      },10000);
      if(!doc){report('error');return}
      const win=frame.contentWindow;
      const loggedIn=await waitFor(()=>win.eval('typeof cloudUser!=="undefined" && !!cloudUser'),8000);
      if(!loggedIn){report('login');return}
      // 시작/종료 전에 최신 기록으로 맞춤 (기록 추가 버튼과 같은 순서)
      try{await win.autoSyncFromCloud();await win.renderCurrentView()}catch(_){}
      await sleep(300);

      let st=latest(doc,attr);
      if(kind==='study'&&st.idx>=0){
        // 최신 카드의 빈 페이지 칸을 1로 채운 뒤 버튼 상태를 다시 읽음
        if(action==='start'&&!st.btns['cancel-start']) await fillStartPage(doc,win,st.idx);
        if(action==='end'&&st.btns['cancel-start']&&!st.btns['cancel-end']) await fillEndPage(doc,win,st.idx);
        st=latest(doc,attr);
      }
      const running=!!st.btns['cancel-start']&&!st.btns['cancel-end'];
      let target=null;
      if(action==='start'){
        if(running){report('already');return}
        if(!st.btns.start){
          // 카드가 없거나 마지막 카드가 이미 종료됨 → 새 카드를 만든 뒤 시작
          if(kind==='study'&&st.idx>=0){
            // 새 교시 추가는 앞 교시의 시작/끝 페이지가 모두 있어야 하므로 빈 칸만 1로 채움
            await fillStartPage(doc,win,st.idx);
            await fillEndPage(doc,win,st.idx);
          }
          const add=doc.getElementById('addPeriod');
          if(!add){report('error');return}
          add.click();
          const next=await waitFor(()=>{const s2=latest(doc,attr);return s2.btns.start&&s2.idx>st.idx?s2:null},8000);
          if(!next){report('fail');return}
          st=next;
          if(kind==='study'){
            await fillStartPage(doc,win,st.idx);
            st=latest(doc,attr);
          }
        }
        if(!st.btns.start||st.btns.start.disabled){report(kind==='study'?'fail':'need_input');return}
        target=st.btns.start;
      }else{
        if(!running){report('already');return}
        if(!st.btns.end||st.btns.end.disabled){report('fail');return}
        target=st.btns.end;
      }

      target.click();
      await sleep(300);
      await waitFor(()=>!Array.from(doc.querySelectorAll('button')).some(b=>b.textContent.trim()==='⏳'),12000,200);
      await sleep(500);
      const after=latest(doc,attr);
      const ok=action==='start'?!!after.btns['cancel-start']&&!after.btns['cancel-end']:!!after.btns['cancel-end'];
      if(!ok){report('fail');return}
      report('ok');
      // 알림바·위젯 반영을 위해 기존 위젯 동기화 절차로 마무리 (끝나면 숨은 화면 종료)
      setTimeout(()=>{try{window.NativeWidget&&window.NativeWidget.finishBackgroundSync&&window.NativeWidget.finishBackgroundSync()}catch(_){}},15000);
      if(window.runWidgetSync) await window.runWidgetSync();
    }catch(e){
      console.error('[widget-action]',e);
      report('error');
    }
  };
})();
</script>
<script id="fcm-token-register">
// 이 기기의 푸시 주소(토큰)를 로그인한 계정으로 Supabase(device_tokens)에 등록
(()=>{
  if(new URLSearchParams(location.search).get('bg')==='1')return; // 백그라운드 동기화 중에는 토큰 재등록(쓰기) 생략
  let lastSent='';
  try{ lastSent=localStorage.getItem('journal_last_device_token_key')||''; }catch(_){}
  async function register(){
    try{
      const nw=window.NativeWidget;
      if(!nw||typeof nw.getFcmToken!=='function')return;
      const token=nw.getFcmToken();
      if(!token)return;
      const sb=window.getSupabaseClient&&window.getSupabaseClient();
      if(!sb)return;
      const {data}=await sb.auth.getSession();
      const uid=data&&data.session&&data.session.user&&data.session.user.id;
      if(!uid)return;
      const key=uid+'|'+token;
      if(key===lastSent)return;
      const {error}=await sb.from('device_tokens').upsert(
        {user_id:uid,device_id:nw.getDeviceId(),token:token,updated_at:new Date().toISOString()},
        {onConflict:'user_id,device_id'});
      if(!error){ lastSent=key; try{localStorage.setItem('journal_last_device_token_key',key);}catch(_){} }
    }catch(e){}
  }
  setTimeout(register,4000);
  setInterval(register,30000);
})();
</script>
