<body><button id="pwaInstallBtn" type="button">앱 설치</button>

<div class="shell" id="shell">
  <div class="tabs">
    <button id="studyTab" class="active study">📚 공부 기록장</button>
    <button id="lectureTab" class="lecture">🎓 강의 기록장</button>
    <button id="sleepTab" class="sleep">🌙 수면 기록장</button>
    <button id="recordTab" class="record">📝 기타 기록장</button>
    <button id="sharedSettingsBtn" class="shared-settings-btn" type="button" aria-label="공통 설정" title="공통 설정">⚙</button>
  </div>
  <div id="sharedSettingsPanel" class="shared-settings-panel" aria-hidden="true">
    <div class="shared-settings-title">⚙ 공통 설정</div>
    <label class="shared-settings-row"><span>하루 집계 기준시점</span><select id="sharedDayStartHour"></select></label>
    <div id="sharedDayStartPending" class="shared-pending-note" style="display:none;"></div>
    <div class="shared-settings-note">자정(00:00)부터 오전 11:00까지 선택할 수 있습니다. 선택한 시간 전의 기록은 전날 기록으로 집계됩니다.</div>
    <label class="shared-settings-row"><span>1주 시작 요일</span><select id="sharedWeekStart">
      <option value="0">일요일</option><option value="1">월요일</option><option value="2">화요일</option>
      <option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option><option value="6">토요일</option>
    </select></label>
    <div class="shared-settings-note">선택한 요일부터 한 주가 시작되며 주간 통계에 공통 적용됩니다.</div>
    <div class="shared-settings-note">공통 설정은 공부 · 강의 · 수면 · 기타 기록장에 모두 적용됩니다.</div>
    <div class="shared-data-actions">
      <button id="sharedBackupBtn" class="shared-data-btn" type="button">데이터 백업</button>
      <button id="sharedRestoreBtn" class="shared-data-btn" type="button">데이터 복원</button>
    </div>
    <button id="sharedBackupLocationBtn" class="shared-backup-location" type="button">백업파일 저장 위치 설정</button>
    <div id="sharedBackupLocationStatus" class="shared-backup-location-status">저장 위치: 기본 다운로드 폴더</div>
    <div id="sharedBackupChoice" class="backup-choice" aria-hidden="true">
      <div class="backup-choice-title">전체 기록장을 백업합니다</div>
      <div class="backup-choice-grid">

        <button class="backup-choice-btn" data-backup-kind="all" type="button">전체 기록장 백업 (공부 · 강의 · 수면 · 기타)</button>
      </div>
    </div>
    <input id="sharedRestoreFile" type="file" accept="application/json,.json">
    <button id="sharedSnapshotBtn" type="button" style="-webkit-appearance:none;appearance:none;box-sizing:border-box;display:block;width:100%;height:44px;margin:10px 0 0;padding:0 12px;border:1px solid #d9dfdc;border-radius:12px;background:#fff;color:#1f2926;font:900 13px/1 Inter,system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:none;outline:none;">스냅샷에서 복원</button>

<div id="sharedSnapshotPanel" class="backup-choice" aria-hidden="true" onclick="if(event.target===this){this.classList.remove('open');this.setAttribute('aria-hidden','true');}">
      <button id="sharedSnapshotPickBtn" type="button" style="-webkit-appearance:none;appearance:none;box-sizing:border-box;display:block;width:100%;height:40px;padding:0 12px;border:1px solid #d9dfdc;border-radius:10px;background:#fff;color:#1f2926;font:900 12.5px/1 Inter,system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:none;outline:none;">복원 시점 선택 ▼</button>
      <div id="sharedSnapshotList" class="backup-choice-grid" hidden style="margin-top:8px;"></div>

<script>
  const SUPABASE_URL = 'https://nvpvxtwebzefhgulswsv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_z5OzUt5AQhpWK-ZXl-3blQ_jav06IYo';

  // ── 로그인 유지 정책 ─────────────────────────────
  //  모든 환경(앱 / PWA / 브라우저)에서 사용자가 직접 로그아웃하기 전에는 자동으로 로그아웃하지 않는다.
  const ENV_APP = location.hostname === 'appassets.androidplatform.net';
  const ENV_PWA = (()=>{
    try{
      if(window.matchMedia){
        for(const m of ['standalone','fullscreen','minimal-ui','window-controls-overlay']){
          if(window.matchMedia('(display-mode: '+m+')').matches) return true;
        }
      }
      if(navigator.standalone === true) return true;
      if(String(document.referrer||'').startsWith('android-app://')) return true;
    }catch(_){}
    return false;
  })();
  const ENV_BROWSER = !ENV_APP && !ENV_PWA;
  // 브라우저는 로그인 정보를 별도 키에 저장한다(기존 브라우저 로그인 유지를 위해 키는 그대로 둔다).
  const BROWSER_AUTH_KEY = 'sb-journal-browser-auth';

  // 로그인 세션 백업 + 원치 않는 로그아웃 자동 복구
  const AUTH_BACKUP_KEY = 'journal:auth-backup';
  let __intentionalSignOut = false;   // 사용자가 로그아웃 버튼을 눌렀을 때만 true
  let __recovering = false, __lastRecoverAt = 0;
  function saveAuthBackup(session){
    try{
      if(session?.refresh_token) localStorage.setItem(AUTH_BACKUP_KEY, JSON.stringify({
        access_token: session.access_token, refresh_token: session.refresh_token
      }));
    }catch(_){}
  }
  function clearAuthBackup(){ try{ localStorage.removeItem(AUTH_BACKUP_KEY); }catch(_){} }
  async function recoverUnexpectedSignOut(sb){
    if(__recovering || Date.now() - __lastRecoverAt < 30000) return;
    let b = null;
    try{ b = JSON.parse(localStorage.getItem(AUTH_BACKUP_KEY) || 'null'); }catch(_){}
    if(!b?.refresh_token) return;
    __recovering = true; __lastRecoverAt = Date.now();
    try{
      const {error} = await sb.auth.setSession({access_token:b.access_token, refresh_token:b.refresh_token});
      if(error) clearAuthBackup();   // 서버가 토큰을 완전히 무효 처리한 경우에만 포기
    }catch(_){}
    finally{ __recovering = false; }
  }

  // 토큰 갱신 요청이 나가는 동안 앱(네이티브)에 알려, 숨은 WebView 가 그 사이 종료되며
  // 새 토큰을 저장하지 못해 로그아웃되는 일을 막는다.
  function __authFetch(input, init){
    let isRefresh = false;
    try{
      const u = typeof input === 'string' ? input : (input && input.url) || '';
      isRefresh = u.includes('/auth/v1/token') && u.includes('grant_type=refresh_token');
    }catch(_){}
    if(!isRefresh) return fetch(input, init);
    try{ window.NativeWidget?.authRefreshBegin?.(); }catch(_){}
    const done = ()=>setTimeout(()=>{ try{ window.NativeWidget?.authRefreshEnd?.(); }catch(_){} }, 2000);
    return fetch(input, init).then(r=>{ done(); return r; }, e=>{ done(); throw e; });
  }

  let sbSettingsClient = null;
  let __sbCreating = false;

  const shell=document.getElementById('shell');
  const tabs={
   study:{button:document.getElementById('studyTab'),frame:document.getElementById('studyFrame')},
   lecture:{button:document.getElementById('lectureTab'),frame:document.getElementById('lectureFrame')},
   sleep:{button:document.getElementById('sleepTab'),frame:document.getElementById('sleepFrame')},
   record:{button:document.getElementById('recordTab'),frame:document.getElementById('recordFrame')}
  };

  const LAST_TAB_LOCAL_KEY='journal:last-tab';

  function openTab(which, skipSave){
    Object.entries(tabs).forEach(([key,item])=>{
      const active=key===which;
      item.button.classList.toggle('active',active);
      item.frame.classList.toggle('active',active);
      if(active && !item.frame.getAttribute('src') && item.frame.dataset.src){
        item.frame.src=item.frame.dataset.src;
      }
      try{
        item.frame.contentWindow?.postMessage({
          type: active ? 'journal-resume' : 'journal-pause'
        }, location.origin);
        if(active){
          setTimeout(()=>{ try{ window.loadVisibleMonthForActiveTab?.(key); }catch(_){} }, 120);
        }
      }catch(e){}
    });
    try{ localStorage.setItem(LAST_TAB_LOCAL_KEY, which); }catch(_){}
  }
  Object.entries(tabs).forEach(([key,item])=>item.button.onclick=()=>openTab(key));
  let first='study';
  try{
    const localTab=localStorage.getItem(LAST_TAB_LOCAL_KEY);
    if(localTab && tabs[localTab]) first=localTab;
  }catch(_){}
  openTab(first, true);

  const SHARED_SETTINGS_DEFAULT={dayStartHour:11,weekStartDay:6};
  let sharedSettingsCache={...SHARED_SETTINGS_DEFAULT};
  let sharedSettingsLoaded=false;
  let sharedSettingsLoadPromise=null;
  let sharedSettingsLoadOk=false;
  let sharedSettingsUserId=null;
  window.getSupabaseClient = () => initSettingsClient();
  window.markLocalCloudChange = ()=>{ try{ localStorage.setItem('journal_last_local_change_at', String(Date.now())); }catch(_){} };
  function initSettingsClient(){
    if(sbSettingsClient) return sbSettingsClient;
    if(__sbCreating) return null;
    __sbCreating = true;
    try{
      const isAndroidApp = location.hostname === 'appassets.androidplatform.net';
      sbSettingsClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        { auth: Object.assign(
            { persistSession:true, autoRefreshToken:true, detectSessionInUrl:!isAndroidApp },
            ENV_BROWSER ? { storageKey: BROWSER_AUTH_KEY } : {}
          ), realtime: { logLevel: 'error' }, global: { fetch: __authFetch } }
      );
      const __sb = sbSettingsClient;
      const __origSignOut = __sb.auth.signOut.bind(__sb.auth);
      // 로그아웃은 누른 기기에서만 적용(local). 범위를 지정하지 않으면 모든 기기의 세션이 한꺼번에 폐기되기 때문.
      __sb.auth.signOut = async (opts)=>{ __intentionalSignOut = true; clearAuthBackup(); return __origSignOut(opts && opts.scope ? opts : { scope:'local' }); };
      __sb.auth.onAuthStateChange((event, session)=>{
        if(session && (event==='SIGNED_IN' || event==='TOKEN_REFRESHED' || event==='INITIAL_SESSION')){
          __intentionalSignOut = false;
          saveAuthBackup(session);
        }else if(event==='SIGNED_OUT' && !__intentionalSignOut){
          setTimeout(()=>{ void recoverUnexpectedSignOut(__sb); }, 0);
        }
      });
      // 앱을 다시 켜거나 네트워크가 돌아왔을 때, 만료 임박 토큰을 즉시 갱신
      const __keepAlive = ()=>{ try{ void __sb.auth.getSession(); }catch(_){} };
      document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') __keepAlive(); });
      window.addEventListener('focus', __keepAlive);
      window.addEventListener('online', __keepAlive);
      return sbSettingsClient;
    }catch(e){ return null; }
    finally{ __sbCreating = false; }
  }
  // 숨은 동기화(bg=1)는 매번 새 화면이 떠서 journal_settings 를 다시 읽던 것을 30분 캐시로 대체
  const IS_BG_PAGE=new URLSearchParams(location.search).get('bg')==='1';
  const SETTINGS_CACHE_KEY='journal:settings-cache:';
  const SETTINGS_CACHE_MS=30*60*1000;
  function readSettingsCache(uid){
    try{
      const c=JSON.parse(localStorage.getItem(SETTINGS_CACHE_KEY+uid)||'null');
      if(c && c.v && Date.now()-Number(c.at)<SETTINGS_CACHE_MS) return c.v;
    }catch(_){}
    return null;
  }
  function writeSettingsCache(uid,v){
    try{ localStorage.setItem(SETTINGS_CACHE_KEY+uid, JSON.stringify({at:Date.now(),v})); }catch(_){}
  }
  async function loadSharedSettingsFromCloud(){
    if(sharedSettingsLoadPromise) return sharedSettingsLoadPromise;
    if(sharedSettingsLoaded){
      try{
        const sb=initSettingsClient();
        const {data:{session}}=await sb.auth.getSession();
        const uid=String(session?.user?.id||'');
        if(uid && uid===sharedSettingsUserId) return {...sharedSettingsCache};
      }catch(_){}
      sharedSettingsLoaded=false;
      sharedSettingsLoadOk=false;
      sharedSettingsUserId=null;
    }

    sharedSettingsLoadPromise=(async()=>{
      const sb=initSettingsClient();
      if(!sb){
        sharedSettingsLoadOk=false;
        return {...SHARED_SETTINGS_DEFAULT};
      }
      const {data:{session}}=await sb.auth.getSession();
      if(!session?.user){
        sharedSettingsCache={...SHARED_SETTINGS_DEFAULT};
        sharedSettingsLoaded=false;
        sharedSettingsLoadOk=false;
        sharedSettingsUserId=null;
        return {...SHARED_SETTINGS_DEFAULT};
      }
      const currentUserId=String(session.user.id||'');
      if(IS_BG_PAGE){
        const cached=readSettingsCache(currentUserId);
        if(cached){
          sharedSettingsCache=cached;
          sharedSettingsUserId=currentUserId;
          sharedSettingsLoaded=true;
          sharedSettingsLoadOk=true;
          return cached;
        }
      }
      const {data,error}=await sb.from('journal_settings')
        .select('day_start_hour,pending_day_start,week_start_day')
        .eq('user_id',session.user.id).maybeSingle();
      if(error){
        console.warn('설정 로드 실패, 기본값 사용:',error);
        sharedSettingsLoadOk=false;
        return {...SHARED_SETTINGS_DEFAULT};
      }
      const norm={
        dayStartHour:Number.isInteger(data?.day_start_hour)&&data.day_start_hour>=0&&data.day_start_hour<=11?data.day_start_hour:SHARED_SETTINGS_DEFAULT.dayStartHour,
        weekStartDay:Number.isInteger(data?.week_start_day)&&data.week_start_day>=0&&data.week_start_day<=6?data.week_start_day:SHARED_SETTINGS_DEFAULT.weekStartDay,
        pendingDayStart:data?.pending_day_start||null
      };
      sharedSettingsCache=norm;
      sharedSettingsUserId=currentUserId;
      sharedSettingsLoaded=true;
      sharedSettingsLoadOk=true;
      writeSettingsCache(currentUserId,norm);
      return norm;
    })();

    try{
      return await sharedSettingsLoadPromise;
    }finally{
      sharedSettingsLoadPromise=null;
    }
  }
  async function readSharedSettings(){
    if(!sharedSettingsLoaded) await loadSharedSettingsFromCloud();
    return {...sharedSettingsCache};
  }
  function notifySharedSettings(v){
    for(const item of Object.values(tabs)){
      try{item.frame.contentWindow?.postMessage({type:'journal-shared-settings-changed',settings:v},location.origin)}catch(e){}
    }
  }

  window.addEventListener('message', async (ev)=>{
    if(ev.origin !== location.origin) return;
    if(ev.data?.type !== 'journal-request-shared-settings') return;
    try{
      if(!sharedSettingsLoaded){
        await loadSharedSettingsFromCloud();
        sharedSettingsLoaded = true;
      }
      ev.source?.postMessage({
        type:'journal-shared-settings-changed',
        settings: sharedSettingsCache
      }, location.origin);
    }catch(e){ console.warn('[FIX3] 설정 응답 실패', e); }
  });
  async function writeSharedSettingsToCloud(patch){
    const sb=initSettingsClient();
    if(!sb) throw new Error('클라우드 연결 실패');
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user) throw new Error('로그인이 필요합니다. 설정은 클라우드에만 저장됩니다.');
    const current=await readSharedSettings();
    const next={...current,...patch};
    const payload={
      user_id:session.user.id,
      day_start_hour:next.dayStartHour,
      pending_day_start:next.pendingDayStart??null,
      week_start_day:next.weekStartDay,
      updated_at:new Date().toISOString()
    };
    const {error}=await sb.from('journal_settings').upsert(payload,{onConflict:'user_id'});
    if(error) throw error;
    sharedSettingsCache=next;
    writeSettingsCache(String(session.user.id),next);
    notifySharedSettings(next);
    return next;
  }
  function initSharedSettingsUI(){
    const btn=document.getElementById('sharedSettingsBtn');
    const panel=document.getElementById('sharedSettingsPanel');
    const hour=document.getElementById('sharedDayStartHour');
    const week=document.getElementById('sharedWeekStart');
    const pendingEl=document.getElementById('sharedDayStartPending');
    for(let h=0;h<12;h++){
      const o=document.createElement('option');
      o.value=String(h); o.textContent=String(h).padStart(2,'0')+':00';
      hour.appendChild(o);
    }
    function nextBoundaryOfHour(h){
      const now=new Date();
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,0,0,0);
      if(d.getTime()<=now.getTime()) d.setDate(d.getDate()+1);
      return d;
    }
    function paintPendingInfo(){
      if(!pendingEl) return;
      const p=sharedSettingsCache.pendingDayStart;
      if(!p){
        pendingEl.style.display='none';
        pendingEl.textContent='';
        return;
      }
      const d=new Date(p.effectiveAt);
      const mo=String(d.getMonth()+1).padStart(2,'0');
      const da=String(d.getDate()).padStart(2,'0');
      const hh=String(d.getHours()).padStart(2,'0');
      const mi=String(d.getMinutes()).padStart(2,'0');
      pendingEl.textContent=`(다음 적용시점 ${mo}/${da} ${hh}:${mi})`;
      pendingEl.style.display='block';
    }
    async function paint(){
      const v=await readSharedSettings();
      hour.value=String(v.pendingDayStart?v.pendingDayStart.hour:v.dayStartHour);
      week.value=String(v.weekStartDay);
      paintPendingInfo();
    }
    paint();
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const show=!panel.classList.contains('show');
      panel.classList.toggle('show',show);
      panel.setAttribute('aria-hidden',String(!show));
      if(show)paint();
    });
    panel.addEventListener('click',e=>e.stopPropagation());
    document.addEventListener('click',(e)=>{
      const t=e.target;
      const isInput=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
      if(!isInput){ try{ document.activeElement?.blur?.(); }catch(_){} }
      panel.classList.remove('show');panel.setAttribute('aria-hidden','true');
    });
    hour.addEventListener('change',async()=>{
      const newHour=+hour.value;
      const current=await readSharedSettings();
      const applied=current.dayStartHour;
      const existing=current.pendingDayStart;
      if(newHour===applied){
        if(existing){
          try{ await writeSharedSettingsToCloud({pendingDayStart:null}); paintPendingInfo(); }
          catch(e){ alert('예약 취소 실패: '+(e?.message||e)); await paint(); }
        }
        return;
      }
      try{
        const effectiveAt=nextBoundaryOfHour(applied).toISOString();
        await writeSharedSettingsToCloud({pendingDayStart:{hour:newHour,effectiveAt}});
        paintPendingInfo();
      }catch(e){
        alert('예약 저장 실패: '+(e?.message||e));
        await paint();
      }
    });
    week.addEventListener('change',async()=>{
      try{ await writeSharedSettingsToCloud({weekStartDay:+week.value}); }
      catch(e){ alert('설정 저장 실패: '+(e?.message||e)); await paint(); }
    });
    window.addEventListener('message',async(ev)=>{
      if(ev.origin!==location.origin) return;
      if(ev.data?.type!=='journal-activate-pending-day-start') return;
      try{
        const h=Number(ev.data.hour);
        if(!Number.isInteger(h)||h<0||h>11) return;
        sharedSettingsCache.dayStartHour=h;
        sharedSettingsCache.pendingDayStart=null;
        const sb=initSettingsClient();
        if(sb){
          const {data:{session}}=await sb.auth.getSession();
          if(session?.user){
            await sb.from('journal_settings').upsert({
              user_id:session.user.id,
              day_start_hour:h,
              pending_day_start:null,
              updated_at:new Date().toISOString()
            },{onConflict:'user_id'});
          }
        }
        await paint();
        notifySharedSettings(sharedSettingsCache);
      }catch(e){ console.warn('[pending-activate] 반영 실패', e); }
    });

    async function ensureDeleteFrame(kind){
      const fr=tabs[kind].frame;
      if(!fr.getAttribute('src')){
        fr.src=fr.dataset.src;
        await new Promise(r=>{
          if(fr.contentDocument?.readyState==='complete'){r();return;}
          const t=setTimeout(r,5000);
          fr.addEventListener('load',()=>{clearTimeout(t);r();},{once:true});
        });
      }else if(!fr.contentDocument || fr.contentDocument.readyState!=='complete'){
        await new Promise(r=>{
          if(fr.contentDocument?.readyState==='complete'){r();return;}
          const t=setTimeout(r,5000);
          fr.addEventListener('load',()=>{clearTimeout(t);r();},{once:true});
        });
      }
      return fr;
    }
    const JOURNAL_LABELS = { study:'공부 기록장', lecture:'강의 기록장', sleep:'수면 기록장', record:'기타 기록장' };

    function waitDeleteDone(kind){
      return new Promise(resolve => {
        const timer = setTimeout(() => {
          window.removeEventListener('message', onDone);
          resolve(false);
        }, 20000);
        function onDone(ev){
          if(ev.origin !== location.origin) return;
          if(ev.data?.type !== 'journal-delete-done') return;
          if(ev.data?.kind !== kind) return;
          clearTimeout(timer);
          window.removeEventListener('message', onDone);
          resolve(ev.data.ok !== false);
        }
        window.addEventListener('message', onDone);
      });
    }

    async function waitChildReady(frame, timeoutMs=6000){
      return new Promise(resolve=>{
        const start = Date.now();
        (function tick(){
          try{
            if(frame?.contentWindow?.__journalReady === true) return resolve(true);
          }catch(e){}
          if(Date.now() - start > timeoutMs) return resolve(false);
          setTimeout(tick, 100);
        })();
      });
    }

    async function deleteOneJournal(kind){
      const fr = await ensureDeleteFrame(kind);

      const ready = await waitChildReady(fr, 30000);
      if(!ready){
        console.warn(`[delete] ${kind} 프레임 준비 실패 — 스킵`);
        return false;
      }

      const win = fr.contentWindow;
      if(!win){ alert(`${JOURNAL_LABELS[kind]} 프레임을 찾지 못했습니다.`); return false; }

      try{
        win.__skipDeleteConfirm = true;
      }catch(e){}

      const wait = waitDeleteDone(kind);
      win.postMessage({type:'journal-delete-request', kind}, location.origin);

          win.__skipDeleteConfirm = false;
        }catch(e){}

    }

    const oneButtons = {

    const del = document.getElementById('sharedDeleteAll');
    del.addEventListener('click', () => {
      if(del.dataset.busy === '1') return;
      if(!confirm('공부 · 강의 · 수면 · 기타 기록 데이터를 모두 삭제하시겠습니까?\n\n삭제한 기록은 복구할 수 없습니다.')) return;

        .then((results) => {

          }else{
            alert(`❌ 일부 기록 삭제 실패: ${failed.map(k => JOURNAL_LABELS[k]).join(', ')}\n다시 시도해주세요.`);
          }

        .catch((e) => {

  }
  initSharedSettingsUI();

  loadSharedSettingsFromCloud()
    .then(()=>{
      sharedSettingsLoaded = true;
      notifySharedSettings(sharedSettingsCache);
    })
    .catch(e => console.warn('[FIX3] 초기 설정 브로드캐스트 실패', e));

  const baseTabLabels={study:'📚 공부 기록장',lecture:'🎓 강의 기록장',sleep:'🌙 수면 기록장',record:'📝 기타 기록장'};
  const recordingTabLabels={study:'공부 기록장',lecture:'강의 기록장',sleep:'수면 기록장',record:'기타 기록장'};
  function setExclusiveTabStatus(kind){
    Object.entries(tabs).forEach(([key,item])=>{
      item.button.textContent=key===kind?recordingTabLabels[key]:baseTabLabels[key];
      item.button.classList.toggle('recording',key===kind);
    });
  }

  const exclusiveFrames={study:tabs.study.frame,lecture:tabs.lecture.frame,sleep:tabs.sleep.frame};
  let exclusiveActive=null;

  (function(){
    function kindFromYm(ym){
      const s = String(ym||'');
      if(s.startsWith('L:')) return 'lecture';
      if(s.startsWith('S:')) return 'sleep';
      if(s.startsWith('R:')) return null;
      if(/^\d{4}-\d{2}$/.test(s)) return 'study';
      return null;
    }

    function kindFromMonthYm(ym){
      const s = String(ym||'');
      if(s.startsWith('L:')) return 'lecture';
      if(s.startsWith('S:')) return 'sleep';
      if(s.startsWith('R:')) return 'record';
      if(/^\d{4}-\d{2}$/.test(s)) return 'study';
      return null;
    }

    // 푸시로 깨어난 숨은 WebView(?bg=1)는 실시간 연결·주기 폴링 없이 1회 조회만 하고 종료
    const BG_SYNC_MODE = new URLSearchParams(location.search).get('bg') === '1';
    const BG_PUSH_PARAMS = new URLSearchParams(location.search);
    const BG_PUSH_TYPE = BG_PUSH_PARAMS.get('push_type') || '';
    const BG_PUSH_YM = BG_PUSH_PARAMS.get('push_ym') || '';
    const BG_PUSH_UPDATED_AT = BG_PUSH_PARAMS.get('push_updated_at') || '';
    const BG_PUSH_DELETED_AT = BG_PUSH_PARAMS.get('push_deleted_at') || '';
    const BG_PUSH_TIMER_STATUS = BG_PUSH_PARAMS.get('push_timer_status') || '';
    const BG_PUSH_TIMER_STARTED_AT = BG_PUSH_PARAMS.get('push_timer_started_at') || '';
    const BG_PUSH_TIMER_STOPPED_AT = BG_PUSH_PARAMS.get('push_timer_stopped_at') || '';
    const BG_PUSH_TIMER_DAY_KEY = BG_PUSH_PARAMS.get('push_timer_day_key') || '';
    const BG_PUSH_TIMER_PERIOD_ID = BG_PUSH_PARAMS.get('push_timer_period_id') || '';
    const BG_PUSH_TIMER_YM = BG_PUSH_PARAMS.get('push_timer_ym') || '';
    let ch = null;
    let chGeneration = 0;
    let realtimeRetryTimer = null;
    let realtimeSubscribed = false;

    function updateSyncConnectionStatus(){
      const el = document.getElementById('syncConnectionStatus');
      const textEl = document.getElementById('syncConnectionText');
      if(!el || !textEl) return;

      el.classList.remove('online','offline');
      if(navigator.onLine === false){
        el.classList.add('offline');
        textEl.textContent = '오프라인';
        applyChildTimerLock();
        return;
      }
      if(realtimeSubscribed){
        el.classList.add('online');
        textEl.textContent = '온라인';
        applyChildTimerLock();
        return;
      }
      textEl.textContent = '서버 연결 중';
      applyChildTimerLock();
    }

    // 온라인일 때만 자식 화면(공부/강의/수면/기록)의 시작·종료 버튼 사용 가능.
    // 서버 연결 중이거나 오프라인이면 비활성화. 상태는 위 표시(updateSyncConnectionStatus)와 동일한 기준이며
    // Supabase 조회·로그는 쓰지 않는다.
    function isIndexOnline(){
      // 숨은 화면(?bg=1: 위젯 동기화·위젯 시작/종료)은 실시간 연결을 쓰지 않으므로 기기 네트워크 상태만 기준으로 삼는다.
      if(BG_SYNC_MODE) return navigator.onLine !== false;
      return navigator.onLine !== false && realtimeSubscribed === true;
    }

    function applyChildTimerLock(){
      const locked = !isIndexOnline();
      Object.values(tabs).forEach(item=>{
        try{
          const doc = item.frame && item.frame.contentDocument;
          if(!doc || !doc.documentElement) return;
          if(!doc.getElementById('indexOnlineLockStyle') && doc.head){
            const st = doc.createElement('style');
            st.id = 'indexOnlineLockStyle';
            st.textContent = 'html.index-offline-lock button[data-study-action],html.index-offline-lock button[data-lecture-action]{opacity:.4!important;filter:grayscale(.7);pointer-events:none!important;cursor:not-allowed}';
            doc.head.appendChild(st);
          }
          if(!doc.__indexOnlineLockBound){
            doc.__indexOnlineLockBound = true;
            const block = (e)=>{
              if(!doc.documentElement.classList.contains('index-offline-lock')) return;
              const t = e.target;
              const btn = t && t.closest ? t.closest('button[data-study-action],button[data-lecture-action]') : null;
              if(!btn) return;
              e.preventDefault();
              e.stopImmediatePropagation();
            };
            // 캡처 단계에서 먼저 막아 자식 화면의 기존 클릭 처리기가 실행되지 않게 함 (카드가 다시 그려져도 유지)
            doc.addEventListener('click', block, true);
            doc.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') block(e); }, true);
          }
          doc.documentElement.classList.toggle('index-offline-lock', locked);
        }catch(_){}
      });
    }

    updateSyncConnectionStatus();

    let centralPollTimer = null;
    let centralPollBusy = false;
    let centralLastMonthSyncAt = null;
    // knownStamp: 이미 받아 둔 월 행의 (updated_at|deleted_at) 표식. Realtime 수신·내 저장·poll 에서 갱신하고
    // localStorage 에 저장해 숨은 동기화 화면과 공유한다. (자식 화면도 같은 키·형식으로 기록)
    const KNOWN_STAMP_KEY='journal:known-stamp:';
    function stampSig(updatedAt, deletedAt){
      const u=Date.parse(updatedAt||''); const d=deletedAt?Date.parse(deletedAt):NaN;
      return (Number.isFinite(u)?u:'')+'|'+(Number.isFinite(d)?d:'');
    }
    function readKnownStamps(uid){
      try{ return JSON.parse(localStorage.getItem(KNOWN_STAMP_KEY+String(uid))||'{}')||{}; }catch(_){ return {}; }
    }
    function noteKnownStamp(uid, ym, updatedAt, deletedAt){
      if(!uid || !ym || !updatedAt) return;
      try{
        const m=readKnownStamps(uid);
        const sig=stampSig(updatedAt, deletedAt);
        if(m[ym]===sig) return;
        m[ym]=sig;
        localStorage.setItem(KNOWN_STAMP_KEY+String(uid), JSON.stringify(m));
      }catch(_){}
    }
    function isKnownStamp(uid, ym, updatedAt, deletedAt){
      if(!uid || !ym || !updatedAt) return false;
      return readKnownStamps(uid)[ym]===stampSig(updatedAt, deletedAt);
    }
    function loadPersistedMonthCursor(userId){
      try{ const v=localStorage.getItem('journal_month_cursor:'+String(userId)); return v||null; }catch(_){ return null; }
    }
    function persistMonthCursor(userId, value){
      try{ if(userId && value) localStorage.setItem('journal_month_cursor:'+String(userId), value); }catch(_){}
    }
    let centralUserId = null;
    let centralActiveTimerRow = null;
    let centralLastPollAt = 0;
    let centralLastActiveFetchAt = 0;
    let centralActiveFetchBusy = false;
    let centralActiveFetchPendingAutoSwitch = false;
    const centralMonthBroadcastSig = new Map();

    let centralServerClockOffsetMs = 0;
    let centralServerClockCalibrated = false;
    let centralServerClockLastCalibratedAt = 0;
    let centralServerClockPromise = null;

    const CENTRAL_POLL_MS = 15 * 60 * 1000;
    const CENTRAL_CLOCK_MAX_AGE_MS = 10 * 60 * 1000;
    const CENTRAL_POLL_REALTIME_MS = 60 * 60 * 1000;   // Realtime 연결 중 안전망 폴링 간격 60분

    function postToFrame(target, msg){
      if(!target) return;

      try{
        // iframe element
        if(target.contentWindow){
          if(!target.getAttribute?.('src')) return;
          target.contentWindow.postMessage(msg, location.origin);
          return;
        }

        // WindowProxy (e.g. event.source)
        if(typeof target.postMessage === 'function'){
          target.postMessage(msg, location.origin);
        }
      }catch(_){}
    }

    function sendCentralServerClock(target=null){
      if(!centralServerClockCalibrated) return;
      const msg={
        type:'journal-server-clock',
        offset:centralServerClockOffsetMs,
        calibratedAt:centralServerClockLastCalibratedAt
      };
      if(target){
        postToFrame(target, msg);
        return;
      }
      for(const item of Object.values(tabs)) postToFrame(item.frame, msg);
    }

    async function calibrateCentralServerClock(force=false){
      if(!force && centralServerClockCalibrated && Date.now()-centralServerClockLastCalibratedAt < CENTRAL_CLOCK_MAX_AGE_MS){
        return centralServerClockOffsetMs;
      }
      if(centralServerClockPromise) return centralServerClockPromise;

      if(!force && BG_SYNC_MODE){
        try{
          const c=JSON.parse(localStorage.getItem('journal:server-clock')||'null');
          if(c && Number.isFinite(c.offset) && Date.now()-Number(c.at) < 30*60*1000){
            centralServerClockOffsetMs=c.offset;
            centralServerClockCalibrated=true;
            centralServerClockLastCalibratedAt=Number(c.at);
            return centralServerClockOffsetMs;
          }
        }catch(_){}
      }

      const sb=initSettingsClient();
      if(!sb) return centralServerClockOffsetMs;

      centralServerClockPromise=(async()=>{
        try{
          const {data:{session}}=await sb.auth.getSession();
          if(!session?.user) return centralServerClockOffsetMs;
          const t0=Date.now();
          const {data,error}=await sb.rpc('server_now');
          const t1=Date.now();
          if(error) throw error;
          const serverMs=Date.parse(data);
          if(!Number.isFinite(serverMs)) throw new Error('서버 시간을 읽지 못했습니다.');
          centralServerClockOffsetMs=Math.round(serverMs-((t0+t1)/2));
          centralServerClockCalibrated=true;
          centralServerClockLastCalibratedAt=Date.now();
          try{ localStorage.setItem('journal:server-clock', JSON.stringify({offset:centralServerClockOffsetMs, at:centralServerClockLastCalibratedAt})); }catch(_){}
          sendCentralServerClock();
        }catch(e){
          console.warn('[central] 서버 시계 보정 실패:', e);
        }finally{
          centralServerClockPromise=null;
        }
        return centralServerClockOffsetMs;
      })();

      return centralServerClockPromise;
    }

    function broadcastActiveTimer(row, source='realtime'){
      centralActiveTimerRow = row || null;
      for(const item of Object.values(tabs)){
        postToFrame(item.frame, {
          type:'journal-central-active-timer',
          row: centralActiveTimerRow,
          source
        });
      }
    }

    function broadcastMonthRow(row, source='realtime'){
      if(!row || !row.ym) return;
      noteKnownStamp(row.user_id || centralUserId, String(row.ym), row.updated_at, row.deleted_at);
      const kind = kindFromMonthYm(row.ym);
      const item = kind ? tabs[kind] : null;
      if(!item) return;

      const sig=`${row.updated_at||''}|${row.deleted_at||''}`;
      if(centralMonthBroadcastSig.get(String(row.ym)) === sig) return;
      centralMonthBroadcastSig.set(String(row.ym), sig);

      postToFrame(item.frame, {
        type:'journal-central-month-row',
        row,
        source
      });
    }

    function broadcastMonthDeleted(ym){
      const kind=kindFromMonthYm(ym);
      const item=kind ? tabs[kind] : null;
      if(!item) return;
      centralMonthBroadcastSig.delete(String(ym||''));
      postToFrame(item.frame, {
        type:'journal-central-month-deleted',
        ym:String(ym||'')
      });
    }

    function pushCentralStateToFrame(frame){
      postToFrame(frame, {
        type:'journal-central-active-timer',
        row: centralActiveTimerRow,
        source:'snapshot'
      });
      sendCentralServerClock(frame);
    }

    Object.values(tabs).forEach(item=>{
      item.frame.addEventListener('load', ()=>{
        applyChildTimerLock();
        setTimeout(()=>{ applyChildTimerLock(); pushCentralStateToFrame(item.frame); }, 0);
      });
    });

    function clearRealtimeRetry(){
      if(realtimeRetryTimer){
        clearTimeout(realtimeRetryTimer);
        realtimeRetryTimer = null;
      }
    }

    function scheduleRealtimeRetry(delay=5000){
      clearRealtimeRetry();
      realtimeRetryTimer = setTimeout(()=>{
        realtimeRetryTimer = null;
        startRealtime(0);
      }, delay);
    }

    function stopCentralPollTimer(){
      if(centralPollTimer){
        clearInterval(centralPollTimer);
        centralPollTimer = null;
      }
    }

    function startCentralPollTimer(){
      if(centralPollTimer) return;
      centralPollTimer = setInterval(()=>{
        if(document.visibilityState === 'hidden') return;
        const rtOk = !!ch && realtimeSubscribed;
        // active_timer is polled only when Realtime is unavailable.
        if(!ch) void fetchOnce(false, false);
        // Realtime이 연결돼 있으면 안전망 폴링을 약 60분 간격으로 줄이고, 끊기면 기존 15분을 유지
        if(rtOk && Date.now() - centralLastPollAt < CENTRAL_POLL_REALTIME_MS) return;
        void centralPoll(false);
      }, CENTRAL_POLL_MS);
    }

    function resetCentralUser(userId){
      const id = userId || null;
      if(centralUserId === id) return;
      centralUserId = id;
      centralLastMonthSyncAt = id ? loadPersistedMonthCursor(id) : null;
      centralActiveTimerRow = null;
      centralLastPollAt = 0;
      centralLastActiveFetchAt = 0;
      centralMonthBroadcastSig.clear();
    }

    function advanceCentralMonthCursor(rows){
      let maxMs = Number.isFinite(Date.parse(centralLastMonthSyncAt || ''))
        ? Date.parse(centralLastMonthSyncAt)
        : -Infinity;

      for(const row of (rows || [])){
        const ms = Date.parse(row?.updated_at || '');
        if(Number.isFinite(ms) && ms > maxMs) maxMs = ms;
      }

      if(Number.isFinite(maxMs)){
        centralLastMonthSyncAt = new Date(maxMs).toISOString();
        persistMonthCursor(centralUserId, centralLastMonthSyncAt);
      }
    }

    function applyFromRow(row, opts){
      const autoSwitch = opts && opts.autoSwitch === true;
      const prevActive = exclusiveActive;

      if(row && row.status === 'running'){
        const kind = kindFromYm(row.ym);
        if(kind && tabs[kind]){
          exclusiveActive = kind;
          setExclusiveTabStatus(kind);

          if(autoSwitch && prevActive !== kind){
            const a = document.activeElement;
            const isTyping = !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable));
            if(!isTyping){
              try{ openTab(kind, true); }catch(_){}
            }
          }
          return;
        }
      }

      exclusiveActive = null;
      setExclusiveTabStatus(null);
    }

    function handleActiveRow(row, opts={}){
      const normalized = row && Object.keys(row).length ? row : null;
      centralActiveTimerRow = normalized;
      applyFromRow(normalized, opts);
      broadcastActiveTimer(normalized, opts.source || 'realtime');
    }

    function getBackgroundPushActiveRow(){
      if(!BG_SYNC_MODE || !BG_PUSH_TYPE || !BG_PUSH_TIMER_STATUS) return null;
      const status=BG_PUSH_TIMER_STATUS==='running'?'running':'stopped';
      return {
        status,
        ym: BG_PUSH_TIMER_YM || null,
        day_key: BG_PUSH_TIMER_DAY_KEY || null,
        period_id: BG_PUSH_TIMER_PERIOD_ID || null,
        started_at: BG_PUSH_TIMER_STARTED_AT || null,
        stopped_at: BG_PUSH_TIMER_STOPPED_AT || null,
        updated_at: BG_PUSH_UPDATED_AT || null
      };
    }
    let bgPushTimerApplied=false;
    function applyBackgroundPushTimer(){
      if(bgPushTimerApplied) return !!centralActiveTimerRow;
      const row=getBackgroundPushActiveRow();
      if(!row) return false;
      bgPushTimerApplied=true;
      handleActiveRow(row,{autoSwitch:true,source:'push'});
      return true;
    }

    window.shouldIgnoreSelfPush = (type, ym, updatedAt, deletedAt)=>{
      try{
        // 푸시에 실린 (ym, updated_at)이 이미 반영된 상태와 같으면 읽을 필요가 없다.
        if(type==='month' && ym && updatedAt && centralUserId &&
           isKnownStamp(centralUserId, String(ym), updatedAt, deletedAt||null)) return true;
        if(type==='timer' && updatedAt && centralActiveTimerRow?.updated_at){
          const a=Date.parse(centralActiveTimerRow.updated_at), b=Date.parse(updatedAt);
          if(Number.isFinite(a) && a===b) return true;
        }
      }catch(_){}
      try{
        const t=Number(localStorage.getItem('journal_last_local_change_at')||0);
        return realtimeSubscribed && t>0 && Date.now()-t < 5000;
      }catch(_){ return false; }
    };

    async function fetchOnce(autoSwitch, force=false){
      const sb = initSettingsClient();
      if(!sb) return;
      if(centralActiveFetchBusy){
        if(autoSwitch === true) centralActiveFetchPendingAutoSwitch = true;
        return;
      }
      if(!force && Date.now()-centralLastActiveFetchAt < 30000){
        if(autoSwitch === true){
          applyFromRow(centralActiveTimerRow, {autoSwitch:true});
        }
        return;
      }

      if(BG_SYNC_MODE && applyBackgroundPushTimer()){
        centralLastActiveFetchAt=Date.now();
        return;
      }

      centralActiveFetchBusy=true;
      let fetchedOk=false;
      try{
        const {data:{session}} = await sb.auth.getSession();
        const user = session?.user;
        if(!user) return;

        resetCentralUser(user.id);

        const {data:row,error} = await sb.from('active_timer')
          .select('*')
          .eq('user_id', user.id)
          .maybeSingle();

        if(error) throw error;

        handleActiveRow(row, {
          autoSwitch: autoSwitch === true,
          source:'fetch'
        });
        fetchedOk=true;
        centralLastActiveFetchAt=Date.now();
      }catch(e){
        console.warn('[central] active_timer 조회 실패:', e);
      }finally{
        centralActiveFetchBusy=false;
        const needSwitch=centralActiveFetchPendingAutoSwitch;
        centralActiveFetchPendingAutoSwitch=false;
        if(needSwitch){
          if(fetchedOk) applyFromRow(centralActiveTimerRow, {autoSwitch:true});
          else void fetchOnce(true, true);
        }
      }
    }

    async function centralPoll(force=false){
      const sb = initSettingsClient();
      if(!sb || centralPollBusy) return;

      const now = Date.now();
      if(!force && now - centralLastPollAt < 30000) return;

      centralPollBusy = true;
      try{
        const {data:{session}} = await sb.auth.getSession();
        const user = session?.user;
        if(!user) return;

        resetCentralUser(user.id);

        // 1단계: 가벼운 표식(ym, updated_at, deleted_at)만 조회
        let monthQuery = sb.from('study_months')
          .select('ym,updated_at,deleted_at,user_id')
          .eq('user_id', user.id)
          .order('updated_at', {ascending:true});

        // 숨은 푸시 동기화에서는 푸시가 알려준 월만 읽는다.
        if(BG_SYNC_MODE && BG_PUSH_YM){
          monthQuery = monthQuery.eq('ym', BG_PUSH_YM);
        }

        // Cursor is advanced only from rows actually received.
        // gte intentionally re-reads the latest timestamp as a tiny overlap,
        // avoiding a same-timestamp edge case without using "now - N seconds".
        // 모든 기록 조회는 2026-01-01 이후로 제한한다(커서가 이보다 늦으면 커서 사용).
        {
          const floorIso = '2026-01-01T00:00:00Z';
          const curMs = Date.parse(centralLastMonthSyncAt || '');
          const useCursor = Number.isFinite(curMs) && curMs > Date.parse(floorIso);
          monthQuery = monthQuery.gte('updated_at', useCursor ? centralLastMonthSyncAt : floorIso);
        }

        const stampRes = await monthQuery;

        if(stampRes.error){
          console.warn('[central] study_months 폴링 실패:', stampRes.error);
        }else{
          const stamps = stampRes.data || [];
          // 2단계: 아직 못 받은 행만 전체 data 를 내려받는다 (Realtime 으로 이미 받은 행은 건너뜀)
          const changedYms = stamps
            .filter(r=>{
              const ym=String(r.ym||'');
              const sig=`${r.updated_at||''}|${r.deleted_at||''}`;
              // Persistent localStorage stamps survive an Android/WebView process
              // restart, but the new WebView has no in-memory month data yet.
              // In background widget sync, only skip a row when this process has
              // actually broadcast that exact row already.
              const alreadyAppliedInThisProcess =
                centralMonthBroadcastSig.get(ym) === sig;
              return !alreadyAppliedInThisProcess;
            })
            .map(r=>r.ym);
          let rows = [];
          let fullOk = true;
          if(changedYms.length){
            const fullRes = await sb.from('study_months')
              .select('ym,data,updated_at,deleted_at,user_id')
              .eq('user_id', user.id)
              .in('ym', changedYms)
              .order('updated_at', {ascending:true});
            if(fullRes.error){
              fullOk = false;
              console.warn('[central] study_months 본문 조회 실패:', fullRes.error);
            }else{
              rows = fullRes.data || [];
            }
          }
          if(fullOk){
            for(const row of rows) broadcastMonthRow(row, 'poll');
            // 본문을 못 받은 경우에는 커서를 올리지 않아 다음 poll 에서 다시 시도한다.
            advanceCentralMonthCursor(stamps.concat(rows));
          }
        }

        centralLastPollAt = Date.now();
      }catch(e){
        console.warn('[central] 폴링 실패:', e);
      }finally{
        centralPollBusy = false;
      }
    }

    async function stopRealtime(){
      clearRealtimeRetry();
      stopCentralPollTimer();
      chGeneration++;

      const old = ch;
      ch = null;
      realtimeSubscribed = false;
      updateSyncConnectionStatus();

      if(old){
        const sb = initSettingsClient();
        try{
          if(sb) await sb.removeChannel(old);
          else await old.unsubscribe();
        }catch(_){
          try{ await old.unsubscribe(); }catch(__){}
        }
      }

      resetCentralUser(null);
      exclusiveActive = null;
      setExclusiveTabStatus(null);
      broadcastActiveTimer(null, 'signed-out');
    }

    function startRealtime(retry=0){
      if(BG_SYNC_MODE) return;
      const sb = initSettingsClient();
      if(!sb || ch) return;

      const generation = ++chGeneration;

      sb.auth.getSession().then(({data:{session}})=>{
        if(generation !== chGeneration || ch) return;

        const user = session?.user;
        if(!user){
          if(retry < 20){
            clearRealtimeRetry();
            realtimeRetryTimer = setTimeout(()=>{
              realtimeRetryTimer = null;
              startRealtime(retry + 1);
            }, 500 + retry * 200);
          }
          return;
        }

        resetCentralUser(user.id);

        if(generation !== chGeneration || ch) return;

        // Parent owns the only journal Realtime channel.
        // It carries both active_timer and study_months changes.
        const next = sb.channel(`journal-central-${user.id}-${generation}`)
          .on(
            'postgres_changes',
            {event:'*',schema:'public',table:'active_timer',filter:`user_id=eq.${user.id}`},
            (payload)=>{
              const row = payload?.new && Object.keys(payload.new).length
                ? payload.new
                : null;
              handleActiveRow(row, {
                autoSwitch:true,
                source:'realtime'
              });
            }
          )
          .on(
            'postgres_changes',
            {event:'*',schema:'public',table:'study_months',filter:`user_id=eq.${user.id}`},
            (payload)=>{
              const row = payload?.new && Object.keys(payload.new).length
                ? payload.new
                : null;

              if(row){
                broadcastMonthRow(row, 'realtime');
                return;
              }

              // Hard DELETE is rare; soft deletes arrive as UPDATE with deleted_at.
              // Parent already knows exactly which ym disappeared, so no child re-query is needed.
              const oldYm = payload?.old?.ym;
              if(oldYm){
                broadcastMonthDeleted(oldYm);
              }else{
                for(const item of Object.values(tabs)){
                  postToFrame(item.frame, {type:'journal-central-force-sync'});
                }
              }
            }
          );

        ch = next;
        startCentralPollTimer();

        next.subscribe((status)=>{
          if(ch !== next) return;

          if(status === 'SUBSCRIBED'){
            realtimeSubscribed = true;
            updateSyncConnectionStatus();
            void loadVisibleMonthForActiveTab();
            return;
          }

          if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
            realtimeSubscribed = false;
            updateSyncConnectionStatus();
            ch = null;

            Promise.resolve(sb.removeChannel(next))
              .catch(async ()=>{
                try{ await next.unsubscribe(); }catch(_){}
              })
              .finally(()=>{
                if(generation === chGeneration){
                  scheduleRealtimeRetry(5000);
                }
              });
          }
        });
      }).catch(()=>{
        if(generation === chGeneration && !ch){
          scheduleRealtimeRetry(5000);
        }
      });
    }

    let centralInitialHydrationComplete=false;
    let visibleMonthFetchBusy=false;
    let visibleMonthFetchKey='';
    const visibleMonthRows=new Map();
    async function loadVisibleMonthForActiveTab(kindOverride=null, ymOverride=null, sourceWindow=null, requestId=null){
      const kind=kindOverride || Object.keys(tabs).find(k=>tabs[k].frame.classList.contains('active')) || 'study';
      const d=new Date();
      const ym=ymOverride || `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const key=`${kind}:${ym}`;

      // Hidden/preloaded frames also need the same startup data as the visible frame.
      // If a row is already cached, answer immediately without another Supabase read.
      if(visibleMonthRows.has(key)) {
        const target=tabs[kind]?.frame?.contentWindow;
        const cachedRow=visibleMonthRows.get(key);
        if(!sourceWindow || sourceWindow===target){
          try{ target?.postMessage({type:'journal-visible-month-response',kind,ym,row:cachedRow,requestId},location.origin); }catch(_){}
          try{ target?.postMessage({type:'journal-central-month-row',row:cachedRow},location.origin); }catch(_){}
        }
        return;
      }

      // Only one startup read is needed for study/lecture/sleep. Fetch their three rows
      // together and cache them, so opening another tab later does not require another
      // server read and cannot leave that frame with an empty placeholder month.
      const batchKinds = ['study','lecture','sleep'];
      if(visibleMonthFetchBusy){
        const started=Date.now();
        while(visibleMonthFetchBusy && Date.now()-started<3000){
          await new Promise(r=>setTimeout(r,50));
        }
        if(visibleMonthRows.has(key)) return loadVisibleMonthForActiveTab(kind,ym,sourceWindow,requestId);
        if(visibleMonthFetchBusy) return;
      }

      const sb=initSettingsClient();
      if(!sb) return;
      visibleMonthFetchBusy=true;
      visibleMonthFetchKey=`batch:${ym}`;
      try{
        const {data:{session}}=await sb.auth.getSession();
        const user=session?.user;
        if(!user) return;

        const requestedCloudYm = kind==='lecture' ? `L:${ym}` : kind==='sleep' ? `S:${ym}` : kind==='record' ? `R:${ym}` : ym;
        const cloudYms = batchKinds.includes(kind)
          ? [ym, `L:${ym}`, `S:${ym}`]
          : [requestedCloudYm];
        const {data,error}=await sb.from('study_months')
          .select('ym,data,updated_at,deleted_at,user_id')
          .eq('user_id',user.id).in('ym',cloudYms);
        if(error) throw error;

        const byYm=new Map((data||[]).map(row=>[String(row.ym),row]));
        const rowsByKey = batchKinds.includes(kind)
          ? {
              [`study:${ym}`]: byYm.get(ym) || {user_id:user.id,ym,data:{},deleted_at:null,updated_at:null},
              [`lecture:${ym}`]: byYm.get(`L:${ym}`) || {user_id:user.id,ym:`L:${ym}`,data:{},deleted_at:null,updated_at:null},
              [`sleep:${ym}`]: byYm.get(`S:${ym}`) || {user_id:user.id,ym:`S:${ym}`,data:{},deleted_at:null,updated_at:null}
            }
          : {[key]: byYm.get(requestedCloudYm) || {user_id:user.id,ym:requestedCloudYm,data:{},deleted_at:null,updated_at:null}};

        Object.entries(rowsByKey).forEach(([cacheKey,row])=>visibleMonthRows.set(cacheKey,row));

        // Push the exact server rows to every already-loaded record frame.
        Object.entries(rowsByKey).forEach(([cacheKey,row])=>{
          const [targetKind,targetYm]=cacheKey.split(':');
          const target=tabs[targetKind]?.frame?.contentWindow;
          try{ target?.postMessage({type:'journal-visible-month-response',kind:targetKind,ym:targetYm,row,requestId:target===sourceWindow?requestId:null},location.origin); }catch(_){}
          try{ target?.postMessage({type:'journal-central-month-row',row},location.origin); }catch(_){}
        });
        centralInitialHydrationComplete=true;
      }catch(e){
        console.warn('[central] visible month read failed:',e);
      }finally{
        visibleMonthFetchBusy=false;
      }
    }

    window.loadVisibleMonthForActiveTab=()=>loadVisibleMonthForActiveTab();

    window.isCentralRealtimeHealthy = ()=>!!(ch && realtimeSubscribed);
    window.refreshExclusiveServerState = fetchOnce;
    window.stopExclusiveTabRealtime = ()=>{ void stopRealtime(); };
    window.restartExclusiveTabRealtime = ()=>{
      void stopRealtime().finally(()=>startRealtime(0));
    };
    window.runCentralJournalSync = ()=>centralPoll(true);
    // 자식이 RPC 로 이미 받은 active_timer 행을 그대로 반영 (select 재조회 생략)
    window.applyRpcActiveRow = (row)=>{
      handleActiveRow(row, {source:'rpc'});
      centralLastActiveFetchAt = Date.now();
    };
    // 푸시가 알려 준 월이 이미 최신으로 반영돼 있으면 네트워크 조회 없이 넘어간다.
    async function bgPushAlreadyApplied(){
      if(!BG_SYNC_MODE || BG_PUSH_TYPE!=='month' || !BG_PUSH_YM || !BG_PUSH_UPDATED_AT) return false;
      if(new URLSearchParams(location.search).get('force')==='1') return false;
      const sb=initSettingsClient();
      if(!sb) return false;
      const {data:{session}}=await sb.auth.getSession();
      const uid=session?.user?.id;
      if(!uid) return false;
      return isKnownStamp(uid, BG_PUSH_YM, BG_PUSH_UPDATED_AT, BG_PUSH_DELETED_AT||null);
    }
    // 숨은 동기화에서 세 기록장(공부/강의/수면) 화면이 모두 로드되고 첫 초기화를 마칠 때까지 대기 (최대 ~9초).
    // 월 기록 행은 postMessage 로 화면에 전달되는데, 화면이 아직 없거나 준비 전이면 행이 조용히 버려진다.
    async function bgWaitFramesReady(){
      const ids=['studyFrame','lectureFrame','sleepFrame'];
      try{
        await Promise.race([
          Promise.all(ids.map(id=>__loadFrameOnce(id))),
          new Promise(r=>setTimeout(r,6000))
        ]);
      }catch(_){}
      const t0=Date.now();
      while(Date.now()-t0<3000){
        const ready=ids.every(id=>{
          try{ return document.getElementById(id).contentWindow.__initialServerHydrationComplete===true; }catch(_){ return false; }
        });
        if(ready) break;
        await new Promise(r=>setTimeout(r,200));
      }
    }
    // 위젯 강제 동기화: 세 기록장의 "오늘" 월 기록을 한 번의 조회로 직접 읽어 각 화면에 전달.
    // (poll 은 커서 이후 바뀐 행만 주므로, 다른 기록장의 최신 행은 다시 오지 않아 강의/수면 타이머가 누락되었음)
    // 커서는 올리지 않는다: 기록(R:) 등 이 조회에 포함되지 않은 행을 건너뛰지 않기 위해.
    async function bgReadTodayMonthsForWidget(){
      const sb=initSettingsClient();
      if(!sb) return false;
      const {data:{session}}=await sb.auth.getSession();
      const user=session?.user;
      if(!user) return false;
      resetCentralUser(user.id);
      const ymSet=new Set();
      // 하루 집계 기준시각(최대 11시) 때문에 달 경계 직후엔 전날(전달) 기록이 오늘일 수 있어 12시간 전의 달도 함께 읽음
      [Date.now(), Date.now()-12*3600*1000].forEach(t=>{
        const d=new Date(t);
        ymSet.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
      });
      const yms=[];
      ymSet.forEach(m=>{ yms.push(m, `L:${m}`, `S:${m}`); });
      const {data,error}=await sb.from('study_months')
        .select('ym,data,updated_at,deleted_at,user_id')
        .eq('user_id', user.id)
        .in('ym', yms);
      if(error){ console.warn('[widget] 오늘 월 기록 조회 실패:', error); return false; }
      (data||[]).forEach(row=>{
        centralMonthBroadcastSig.delete(String(row.ym));
        broadcastMonthRow(row, 'widget-force');
      });
      centralLastPollAt = Date.now();
      return true;
    }
    window.runWidgetSync = async ()=>{
      while(centralPollBusy) await new Promise(resolve=>setTimeout(resolve,100));
      const qp=new URLSearchParams(location.search);
      if(qp.get('widget_action')){
        // 위젯 시작/종료 버튼용 숨은 화면: 대상 기록장 프레임 하나만 로드돼 있다.
        // 여기서 poll 하면 나머지 기록장의 변경 행이 버려지는데 커서는 저장돼 앞서 가므로 하지 않는다.
        // 세 기록장 반영은 이어서 실행되는 마무리 동기화(force)가 맡는다.
      }else{
        await bgWaitFramesReady();
        let direct=false;
        if(qp.get('force')==='1'){
          try{ direct=await bgReadTodayMonthsForWidget(); }catch(e){ console.warn('[widget] 직접 조회 오류:', e); }
        }
        // Always reconcile the server in widget/background mode.
        // A persisted "known stamp" is not enough after a process/WebView restart:
        // the stamp may survive while the in-memory month cache is empty.
        if(!direct) await centralPoll(true);
      }
      // 강의·수면 화면이 모두 로드되고 자기 타이머를 위젯에 보낼 시간을 준 뒤에 종료
      try{
        await Promise.race([
          window.__preloadFramesPromise||Promise.resolve(),
          new Promise(r=>setTimeout(r,9000))
        ]);
      }catch(_){}
      // 데이터를 모두 읽은 뒤에만 알림바 갱신을 허용(읽는 도중의 '타이머 없음'이 알림바를 지우지 않게)
      setTimeout(()=>{try{window.NativeWidget?.markSynced?.()}catch(_){}}, 2500);
      setTimeout(()=>window.NativeWidget?.finishBackgroundSync?.(), 6500);
    };
    window.getCentralActiveTimerSnapshot = ()=>{
      return centralActiveTimerRow ? {...centralActiveTimerRow} : null;
    };

    window.addEventListener('message', (ev)=>{
      if(ev.origin !== location.origin) return;

      if(ev.data?.type === 'journal-request-server-clock'){
        const forceClock=ev.data?.force === true;
        if(!forceClock && centralServerClockCalibrated && Date.now()-centralServerClockLastCalibratedAt < CENTRAL_CLOCK_MAX_AGE_MS){
          sendCentralServerClock(ev.source);
        }else{
          void calibrateCentralServerClock(forceClock).finally(()=>sendCentralServerClock(ev.source));
        }
        return;
      }

      if(ev.data?.type === 'journal-visible-month-request'){
        const kind=String(ev.data?.kind||'');
        const ym=String(ev.data?.ym||'');
        const requestId=String(ev.data?.requestId||'');
        const item=tabs[kind];
        // Preloaded hidden record frames are legitimate startup consumers too.
        // They must receive the same server row as the visible frame; otherwise they
        // remain at their placeholder 0분 state and can overwrite the widget.
        if(!item || ev.source!==item.frame.contentWindow) return;
        void loadVisibleMonthForActiveTab(kind,ym,ev.source,requestId);
        return;
      }

      if(ev.data?.type !== 'journal-central-sync-request') return;

      pushCentralStateToFrame(ev.source);

      // "full" is reserved for foreground/app-resume recovery.
      // Normal tab changes use the in-memory parent snapshot and do not hit Supabase.
      if(ev.data?.full === true){
        void fetchOnce(false, false);
        void centralPoll(false);
      }
    });

    startRealtime();

    document.addEventListener('visibilitychange', ()=>{
      if(!centralInitialHydrationComplete) return;
      if(document.visibilityState === 'visible'){
        void fetchOnce(false, false);
        void calibrateCentralServerClock(false);
        void centralPoll(false);
      }
    });

    window.addEventListener('pageshow', ()=>{
      if(!centralInitialHydrationComplete) return;
      void fetchOnce(false, false);
      void calibrateCentralServerClock(false);
      void centralPoll(false);
    });

    // Network can recover while the app stays visible, so do not wait for
    // visibility/pageshow or the next periodic poll. Reconcile immediately.
    window.addEventListener('offline', ()=>{
      updateSyncConnectionStatus();
    });

    window.addEventListener('online', ()=>{
      if(!centralInitialHydrationComplete) return;
      updateSyncConnectionStatus();
      if(!ch) startRealtime(0);
      void fetchOnce(false, true);
      void calibrateCentralServerClock(false);
      void centralPoll(true);
    });

  })();

  async function ensureExclusiveFrameLoaded(kind){
    const frame=exclusiveFrames[kind];
    if(!frame) return null;
    if(!frame.getAttribute('src') && frame.dataset.src){
      frame.src=frame.dataset.src;
      await new Promise(r=>frame.addEventListener('load',r,{once:true}));
    }else if(frame.getAttribute('src') && (!frame.contentDocument || frame.contentDocument.readyState!=='complete')){
      await new Promise(r=>{
        if(frame.contentDocument && frame.contentDocument.readyState==='complete'){ r(); return; }
        frame.addEventListener('load',r,{once:true});
      });
    }
    return frame;
  }

  async function stopExclusive(kind, atMs){
    const frame=await ensureExclusiveFrameLoaded(kind);
    return new Promise(resolve=>{
      if(!frame?.contentWindow){resolve(true);return}
      const req='stop-'+Date.now()+'-'+Math.random().toString(36).slice(2);
      const timer=setTimeout(()=>{
        window.removeEventListener('message',done);
        console.warn('[FIX5] stopExclusive 응답 타임아웃:', kind);
        resolve(false);
      },3000);
      function done(ev){
        if(ev.origin!==location.origin||ev.source!==frame.contentWindow||
           ev.data?.type!=='exclusive-session-stopped'||ev.data?.req!==req)return;
        clearTimeout(timer);window.removeEventListener('message',done);resolve(ev.data.ok!==false);
      }
      window.addEventListener('message',done);
      frame.contentWindow.postMessage({type:'exclusive-session-stop',kind,req,at:atMs},location.origin);
    });
  }
  window.addEventListener('message',ev=>{
    if(ev.origin!==location.origin)return;
    const type=ev.data?.type;
    if(type==='exclusive-session-ended' || type==='exclusive-session-cancel-start'){
      const row=ev.data?.row;
      // 진행 중이 아닌 상태의 행을 받았을 때만 그대로 반영한다. 그 외에는 예전처럼 서버에서 확인한다.
      if(row && typeof row==='object' && row.status && row.status!=='running' && window.applyRpcActiveRow){
        window.applyRpcActiveRow(row);
      }else if(type==='exclusive-session-ended'){
        window.refreshExclusiveServerState?.();
      }else{
        window.refreshExclusiveServerState?.(false, true);
      }
      return;
    }
    if(type!=='exclusive-session-start')return;
    const req=ev.data?.req;
    ev.source?.postMessage({type:'exclusive-session-result',req,ok:true},location.origin);
    window.refreshExclusiveServerState?.();
  });

</script>

<script id="v128-shared-cloud">
  (()=>{
   const $=id=>document.getElementById(id); let sb=null,user=null;
   function init(){
     if(sb) return true;
     sb = initSettingsClient();
     return !!sb;
   }
   let __statusBusy=false;
   let __statusVerifiedAt=0,__statusVerifiedUserId=null,__statusVerifiedOk=false;
   async function status(){if(__statusBusy)return user;__statusBusy=true;try{if(!init()){ $('sharedCloudStatus').textContent='연결 실패';return null }const {data:{session}}=await sb.auth.getSession();user=session?.user||null;
  let verified=false;
  if(user){
    const uid=String(user.id||'');
    if(__statusVerifiedUserId===uid && Date.now()-__statusVerifiedAt<300000){
      verified=__statusVerifiedOk;
    }else{
      try{
        // 설정 조회 자체가 클라우드 연결/권한 확인 역할을 하므로,
        // 별도의 journal_settings 검증 GET을 만들지 않고 공유 조회 결과를 재사용한다.
        await loadSharedSettingsFromCloud();
        verified=sharedSettingsLoadOk;
      }catch(_){verified=false}
      __statusVerifiedUserId=uid;__statusVerifiedAt=Date.now();__statusVerifiedOk=verified;

  function ensureFrameLoaded(kind){
    return new Promise((resolve,reject)=>{
      const frame=tabs[kind]?.frame;
      if(!frame)return reject(new Error('frame not found'));
      const ready=()=>{
        try{
          return !!frame.getAttribute('src')
            && frame.contentWindow?.location?.href!=='about:blank'
            && typeof frame.contentWindow?.collectBackupData==='function'
            && typeof frame.contentWindow?.applyBackupRestore==='function';
        }catch(e){ return false; }
      };
      if(ready()) return resolve(frame);
      if(!frame.getAttribute('src') && frame.dataset.src) frame.src=frame.dataset.src;
      const start=Date.now();
      (function tick(){
        if(ready()) return resolve(frame);
        if(Date.now()-start>15000){
          return reject(new Error('['+kind+'] collectBackupData 함수를 찾지 못했습니다 (타임아웃)'));
        }
        setTimeout(tick,120);
      })();
    });
  }

        if(permission==='granted'||await sharedBackupDirectoryHandle.requestPermission({mode:'readwrite'})==='granted'){
          const fileHandle=await sharedBackupDirectoryHandle.getFileHandle(name,{create:true});
          const writable=await fileHandle.createWritable();
          await writable.write(text);await writable.close();return;
        }
      }catch(e){}
    }
