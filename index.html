<head>

<title>기록장</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#f5f7f6}
.shell{height:100dvh;display:flex;flex-direction:column}
.tabs{
  flex:0 0 46px;height:46px;display:grid;grid-template-columns:1fr 1fr 1fr 38px;
  gap:5px;padding:5px 8px;background:#f7f9f8;border-bottom:1px solid #dde5e1;
  position:sticky;top:0;z-index:999;
}
.tabs button{min-width:0;border:0;border-radius:8px;font-weight:800;font-size:11px;background:#e8eeeb;color:#53615c;padding:0 3px;white-space:nowrap}
.tabs button.active.study{background:#285f50;color:#fff}
.tabs button.active.lecture{background:#67538b;color:#fff}
.tabs button.active.sleep{background:#456d96;color:#fff}
.frame{display:none;flex:1 1 auto;width:100%;min-height:0;border:0;background:#fff}
.frame.active{display:block}

.alarmbar{flex:0 0 auto;margin:6px 8px 0;padding:6px 8px;border:1px solid #dbe4e0;border-radius:11px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.035);font-size:12px}
.alarmline{display:flex;align-items:center;gap:5px;min-width:0}
.alarmline strong{font-size:16px;line-height:1;white-space:nowrap;color:#26332f}
.alarmline input{width:36px;height:30px;border:1px solid #dbe4e0;border-radius:8px;text-align:center;font-weight:800;font-size:13px;background:#f8faf9}
.alarmline .unit{font-size:11px;font-weight:700;color:#6b7773;margin-left:-3px}
.alarmline select{height:30px;width:92px;min-width:72px;max-width:92px;border:1px solid #dbe4e0;border-radius:8px;background:#fff;padding:0 5px;font-size:10.5px;font-weight:800;color:#34423d}
.alarmline button{height:30px;border:1px solid #dbe4e0;border-radius:8px;background:#fff;padding:0 6px;font-size:10.5px;font-weight:800;white-space:nowrap;color:#34423d}
.alarmline button.primary{background:#285f50;border-color:#285f50;color:#fff}
.alarmline button.danger{display:none!important;background:#b42318;border-color:#b42318;color:#fff}
.alarmline button.danger.show{display:inline-block!important}
#alarmFileName{min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:#77827e}
.alarmstatusline{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:5px;min-height:30px}.alarmstatusline:has(#alarmStatus:empty){display:none}#alarmStatus{display:block;text-align:center;white-space:nowrap;font-size:14px;font-weight:800;color:#b23a48}.alarmstatusline #alarmStop{display:none;height:27px;padding:0 8px;border:1px solid #b42318;border-radius:8px;background:#b42318;color:#fff;font-size:10.5px;font-weight:800;white-space:nowrap}.alarmstatusline #alarmStop.show{display:inline-block}
@media(max-width:560px){.alarmbar{padding:5px 6px}.alarmline{gap:4px}.alarmline strong{font-size:11px}.alarmline button{padding:0 6px;font-size:10px}#alarmFileName{max-width:70px}#alarmStatus{font-size:13px}}

.cloudbar{flex:0 0 auto;margin:4px 8px 0;padding:4px 6px;border:1px solid #dbe4e0;border-radius:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.035);font:700 10px Inter,system-ui,sans-serif;color:#34423d}.cloudline{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:nowrap}.cloudline strong{font-size:11px;white-space:nowrap}.cloudline button{height:27px;border:1px solid #dbe4e0;border-radius:7px;background:#fff;padding:0 6px;font:800 9px Inter,system-ui,sans-serif;white-space:nowrap;color:#34423d}.cloudline button.primary{background:#285f50;border-color:#285f50;color:#fff}.cloudline input{height:27px;min-width:90px;flex:1;border:1px solid #dbe4e0;border-radius:7px;padding:0 6px;font:700 10px Inter,system-ui,sans-serif}.cloudstatus{margin-left:0;font-size:9px;color:#60706a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.cloudsetup{display:none;margin-top:4px;gap:4px;align-items:center}.cloudsetup.show{display:flex}.cloudlogout{display:none!important}.cloudlogout.show{display:inline-block!important}@media(max-width:560px){.cloudbar{padding:4px 5px}.cloudline{gap:3px}.cloudline strong{font-size:10px}.cloudline button{padding:0 5px;font-size:8.5px}.cloudsetup{flex-wrap:wrap}.cloudsetup input{min-width:0;width:calc(50% - 2px);flex:auto}.cloudstatus{font-size:8.5px}}

.shared-settings-btn{font-size:17px!important;padding:0!important;background:#e8eeeb!important;color:#53615c!important}
.shared-settings-panel{display:none;position:fixed;top:50px;right:8px;z-index:10050;width:min(290px,calc(100vw - 16px));padding:12px;border:1px solid #dbe4e0;border-radius:12px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.16);color:#34423d}
.shared-settings-panel.show{display:block}
.shared-settings-title{font-size:14px;font-weight:900;margin-bottom:10px}
.shared-settings-row{display:grid;grid-template-columns:1fr 116px;align-items:center;gap:10px;margin:8px 0;font-size:12px;font-weight:800}
.shared-settings-row select{height:34px;border:1px solid #dbe4e0;border-radius:8px;background:#fff;padding:0 7px;font-weight:800;color:#34423d}
.shared-settings-note{margin-top:8px;font-size:10px;line-height:1.45;color:#6b7773}
.shared-danger-zone{margin-top:12px;padding-top:10px;border-top:1px solid #ead9d9}.shared-delete-all{width:100%;height:36px;margin-top:14px;border:1px solid #c9362b;border-radius:8px;background:#fff;color:#b42318;font-size:11px;font-weight:900}.shared-delete-all:active{background:#fff1f0}.shared-delete-grid{display:grid;gap:6px;margin-top:8px}.shared-delete-one{width:100%;height:34px;border:1px solid #e2c7c4;border-radius:8px;background:#fff;color:#8f3028;font-size:10.5px;font-weight:850}.shared-delete-one:active{background:#fff5f4}


.shared-data-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.shared-backup-location{width:100%;height:40px;margin-top:8px;border:1px solid #d9dfdc;border-radius:10px;background:#fff;color:#1f2926;font-size:11.5px;font-weight:900}.shared-backup-location:active{background:#f4f7f5}.shared-backup-location-status{margin-top:5px;font-size:10px;color:#6b7773}.shared-data-btn{height:44px;border:1px solid #d9dfdc;border-radius:12px;background:#fff;color:#1f2926;font-size:13px;font-weight:900}.shared-data-btn:active{background:#f4f7f5}.backup-choice{display:none;margin-top:8px;padding:10px;border:1px solid #dfe4e1;border-radius:12px;background:#f8faf9}.backup-choice.open{display:block}.backup-choice-title{font-size:11px;font-weight:900;margin-bottom:8px;color:#46534f}.backup-choice-grid{display:grid;gap:6px}.backup-choice-btn{width:100%;height:36px;border:1px solid #d9dfdc;border-radius:9px;background:#fff;color:#26312e;font-size:11px;font-weight:850}.backup-choice-btn:active{background:#eef3f0}#sharedRestoreFile{display:none}
</style>

<body><button id="pwaInstallBtn" type="button">앱 설치</button>
<div class="shell" id="shell">
  <div class="tabs">
    <button id="studyTab" class="active study">📚 공부 기록장</button>
    <button id="lectureTab" class="lecture">🎓 강의 기록장</button>

    <label class="shared-settings-row"><span>1주 시작 요일</span><select id="sharedWeekStart">
      <option value="0">일요일</option><option value="1">월요일</option><option value="2">화요일</option>

    </select></label>
    <div class="shared-settings-note">선택한 요일부터 한 주가 시작되며 주간 통계에 공통 적용됩니다.</div>
    <div class="shared-settings-note">공통 설정은 공부 · 강의 · 수면 기록장에 모두 적용됩니다.</div>
    <div class="shared-data-actions">
      <button id="sharedBackupBtn" class="shared-data-btn" type="button">데이터 백업</button>
      <button id="sharedRestoreBtn" class="shared-data-btn" type="button">데이터 복원</button>
    </div>
    <button id="sharedBackupLocationBtn" class="shared-backup-location" type="button">백업파일 저장 위치 설정</button>
    <div id="sharedBackupLocationStatus" class="shared-backup-location-status">저장 위치: 기본 다운로드 폴더</div>
    <div id="sharedBackupChoice" class="backup-choice" aria-hidden="true">
      <div class="backup-choice-title">백업할 기록장을 선택하세요</div>
      <div class="backup-choice-grid">
        <button class="backup-choice-btn" data-backup-kind="study" type="button">공부 기록장 백업</button>
        <button class="backup-choice-btn" data-backup-kind="lecture" type="button">강의 기록장 백업</button>
        <button class="backup-choice-btn" data-backup-kind="sleep" type="button">수면 기록장 백업</button>
        <button class="backup-choice-btn" data-backup-kind="all" type="button">전체 기록장 백업</button>
      </div>
    </div>
    <input id="sharedRestoreFile" type="file" accept="application/json,.json">
    <div class="shared-danger-zone">
      <div class="shared-delete-grid">
        <button id="sharedDeleteStudy" class="shared-delete-one" type="button">공부 기록장 데이터 전체 삭제</button>
        <button id="sharedDeleteLecture" class="shared-delete-one" type="button">강의 기록장 데이터 전체 삭제</button>
        <button id="sharedDeleteSleep" class="shared-delete-one" type="button">수면 기록장 데이터 전체 삭제</button>
      </div>
      <button id="sharedDeleteAll" class="shared-delete-all" type="button">데이터 전체 삭제</button>
      <div class="shared-settings-note">공부 · 강의 · 수면 기록장의 데이터를 모두 삭제합니다.</div>
    </div>
  </div>
  <div class="alarmbar" id="sharedAlarmBar">
    <div class="alarmline">
      <strong aria-label="알람">⏰</strong>
      <input id="alarmHours" type="number" min="0" max="48" value="" placeholder="" aria-label="시간"><span class="unit">시간</span>
      <input id="alarmMinutes" type="number" min="0" max="59" value="" placeholder="" aria-label="분"><span class="unit">분</span>
      <span class="unit afterAlarm">후</span>
      <select id="alarmSoundSelect" aria-label="알람음"><option value="">불러오는 중...</option></select>
      <span id="alarmFileName" hidden></span>
      <button id="alarmPreview" type="button">▶ 미리듣기</button>
      <button id="alarmStart" class="primary" type="button">시작</button>
      <button id="alarmCancel" type="button">해제</button>
      </div>
    <div class="alarmstatusline"><div id="alarmStatus"></div><button id="alarmStop" class="danger" type="button" hidden style="display:none">🔕 끄기</button></div>
  </div>
  <div class="cloudbar" id="sharedCloudBar">
    <div class="cloudline">
      <strong>☁ 클라우드</strong><span id="sharedCloudStatus" class="cloudstatus">로그인 확인 중…</span>
      <button id="sharedCloudToggle" type="button">로그인</button>

  <iframe id="studyFrame" class="frame active" src="study.html"></iframe>

<script>
const shell=document.getElementById('shell');
const tabs={
 study:{button:document.getElementById('studyTab'),frame:document.getElementById('studyFrame')},
 lecture:{button:document.getElementById('lectureTab'),frame:document.getElementById('lectureFrame')},
 sleep:{button:document.getElementById('sleepTab'),frame:document.getElementById('sleepFrame')}
};

function openTab(which, skipSave){
  Object.entries(tabs).forEach(([key,item])=>{
    const active=key===which;
    item.button.classList.toggle('active',active);
    item.frame.classList.toggle('active',active);
    if(active && !item.frame.getAttribute('src') && item.frame.dataset.src){
      item.frame.src=item.frame.dataset.src;
    }
  });
  if(!skipSave) saveLastTabToCloud(which);
}
Object.entries(tabs).forEach(([key,item])=>item.button.onclick=()=>openTab(key));
let first='study';
openTab(first, true);
restoreLastTabFromCloud().then(tab=>{ if(tab && tab!==first && tabs[tab]) openTab(tab, true); });


const SHARED_SETTINGS_DEFAULT={dayStartHour:11,weekStartDay:6};
let sharedSettingsCache={...SHARED_SETTINGS_DEFAULT};
let sharedSettingsLoaded=false;
let sbSettingsClient=null;
function initSettingsClient(){
  if(sbSettingsClient) return sbSettingsClient;
  try{
    sbSettingsClient=window.supabase.createClient(
      'https://nvpvxtwebzefhgulswsv.supabase.co',
      'sb_publishable_z5OzUt5AQhpWK-ZXl-3blQ_jav06IYo',
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
    );
    return sbSettingsClient;
  }catch(e){ return null; }
}
async function loadSharedSettingsFromCloud(){
  const sb=initSettingsClient();
  if(!sb) return {...SHARED_SETTINGS_DEFAULT};
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.user){
    sharedSettingsCache={...SHARED_SETTINGS_DEFAULT};
    sharedSettingsLoaded=false;
    return {...SHARED_SETTINGS_DEFAULT};
  }
  const {data,error}=await sb.from('journal_settings')
    .select('day_start_hour,pending_day_start,week_start_day')
    .eq('user_id',session.user.id).maybeSingle();
  if(error){
    console.warn('설정 로드 실패, 기본값 사용:',error);
    return {...SHARED_SETTINGS_DEFAULT};
  }
  const norm={
    dayStartHour:Number.isInteger(data?.day_start_hour)&&data.day_start_hour>=0&&data.day_start_hour<=11?data.day_start_hour:SHARED_SETTINGS_DEFAULT.dayStartHour,
    weekStartDay:Number.isInteger(data?.week_start_day)&&data.week_start_day>=0&&data.week_start_day<=6?data.week_start_day:SHARED_SETTINGS_DEFAULT.weekStartDay,
    pendingDayStart:data?.pending_day_start||null
  };
  sharedSettingsCache=norm;
  sharedSettingsLoaded=true;
  return norm;
}
async function readSharedSettings(){
  if(!sharedSettingsLoaded) await loadSharedSettingsFromCloud();
  return {...sharedSettingsCache};
}
function notifySharedSettings(v){
  for(const item of Object.values(tabs)){
    try{item.frame.contentWindow?.postMessage({type:'journal-shared-settings-changed',settings:v},location.origin)}catch(e){}
  }
}

// [FIX3] 자식이 로드 직후 요청하는 현재 공통 설정을 응답한다.
// (study/lecture/sleep.html 이 기본값 대신 실제 설정을 받도록)
window.addEventListener('message', (ev)=>{
  if(ev.origin !== location.origin) return;
  if(ev.data?.type !== 'journal-request-shared-settings') return;
  try{
    ev.source?.postMessage({
      type:'journal-shared-settings-changed',
      settings: sharedSettingsCache
    }, location.origin);
  }catch(e){}
});
async function writeSharedSettingsToCloud(patch){
  const sb=initSettingsClient();
  if(!sb) throw new Error('클라우드 연결 실패');
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.user) throw new Error('로그인이 필요합니다. 설정은 클라우드에만 저장됩니다.');
  const current=await readSharedSettings();
  const next={...current,...patch};
  const payload={
    user_id:session.user.id,
    day_start_hour:next.dayStartHour,
    pending_day_start:next.pendingDayStart??null,
    week_start_day:next.weekStartDay,
    updated_at:new Date().toISOString()
  };
  const {error}=await sb.from('journal_settings').upsert(payload,{onConflict:'user_id'});
  if(error) throw error;
  sharedSettingsCache=next;
  notifySharedSettings(next);
  return next;
}
async function saveLastTabToCloud(tab){
  const sb=initSettingsClient();
  if(!sb) return;
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.user) return;
  await sb.from('journal_settings').upsert({
    user_id:session.user.id,
    last_tab:tab,
    updated_at:new Date().toISOString()
  },{onConflict:'user_id'});
}
async function restoreLastTabFromCloud(){
  const sb=initSettingsClient();
  if(!sb) return null;
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.user) return null;
  const {data}=await sb.from('journal_settings')
    .select('last_tab').eq('user_id',session.user.id).maybeSingle();
  return data?.last_tab||null;
}
function initSharedSettingsUI(){
  const btn=document.getElementById('sharedSettingsBtn');
  const panel=document.getElementById('sharedSettingsPanel');
  const hour=document.getElementById('sharedDayStartHour');
  const week=document.getElementById('sharedWeekStart');
  for(let h=0;h<12;h++){
    const o=document.createElement('option');
    o.value=String(h); o.textContent=String(h).padStart(2,'0')+':00';
    hour.appendChild(o);
  }
  async function paint(){
    const v=await readSharedSettings();
    hour.value=String(v.dayStartHour);
    week.value=String(v.weekStartDay);
  }
  paint();
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const show=!panel.classList.contains('show');
    panel.classList.toggle('show',show);
    panel.setAttribute('aria-hidden',String(!show));
    if(show)paint();
  });
  panel.addEventListener('click',e=>e.stopPropagation());
  document.addEventListener('click',()=>{panel.classList.remove('show');panel.setAttribute('aria-hidden','true')});
  hour.addEventListener('change',async()=>{
    try{ await writeSharedSettingsToCloud({dayStartHour:+hour.value}); }
    catch(e){ alert('설정 저장 실패: '+(e?.message||e)); await paint(); }
  });
  week.addEventListener('change',async()=>{
    try{ await writeSharedSettingsToCloud({weekStartDay:+week.value}); }
    catch(e){ alert('설정 저장 실패: '+(e?.message||e)); await paint(); }
  });

  const sb=initSettingsClient();
  if(sb){
    sb.auth.onAuthStateChange(async()=>{
      sharedSettingsLoaded=false;
      await loadSharedSettingsFromCloud();
      paint();
      notifySharedSettings(sharedSettingsCache);
      const t=await restoreLastTabFromCloud();
      if(t && tabs[t]) openTab(t, true);
    });
  }

  async function ensureDeleteFrame(kind){
    const fr=tabs[kind].frame;
    if(!fr.getAttribute('src')){
      fr.src=fr.dataset.src;
      await new Promise(r=>{
        if(fr.contentDocument?.readyState==='complete'){r();return;}
        const t=setTimeout(r,5000);
        fr.addEventListener('load',()=>{clearTimeout(t);r();},{once:true});
      });
    }else if(!fr.contentDocument || fr.contentDocument.readyState!=='complete'){
      await new Promise(r=>{
        if(fr.contentDocument?.readyState==='complete'){r();return;}
        const t=setTimeout(r,5000);
        fr.addEventListener('load',()=>{clearTimeout(t);r();},{once:true});
      });
    }
    return fr;
  }
  const JOURNAL_LABELS = { study:'공부 기록장', lecture:'강의 기록장', sleep:'수면 기록장' };

  function waitDeleteDone(kind){
    return new Promise(resolve => {
      const timer = setTimeout(() => {
        window.removeEventListener('message', onDone);
        resolve(false);
      }, 8000);
      function onDone(ev){
        if(ev.origin !== location.origin) return;
        if(ev.data?.type !== 'journal-delete-done') return;
        if(ev.data?.kind !== kind) return;
        clearTimeout(timer);
        window.removeEventListener('message', onDone);
        resolve(true);
      }
      window.addEventListener('message', onDone);
    });
  }

  async function deleteOneJournal(kind){
    const fr = await ensureDeleteFrame(kind);
    const childBtn = fr.contentDocument?.getElementById('deleteAllRecords');
    if(!childBtn){ alert(`${JOURNAL_LABELS[kind]}의 삭제 기능을 찾지 못했습니다.`); return false; }

    const win = fr.contentWindow;
    if(!win) return false;
    try{

const exclusiveFrames={study:tabs.study.frame,lecture:tabs.lecture.frame,sleep:tabs.sleep.frame};
let exclusiveActive=null;
let exclusiveQueue=Promise.resolve();
// 시작 전환 하나의 기록: 새로 시작된 kind와, 그로 인해 자동 종료된 이전 kind.
// 새 타이머가 곧바로 취소되면 이 정보를 이용해 이전 기록을 되돌린다.
let lastTransition=null; // {startedKind, previousKind, atMs}
let pendingStart=null;   // 진행 중인 시작 요청 추적 (cancel로 무효화 가능)

// 아직 한 번도 열지 않은 탭(iframe에 src가 없는 탭)은 백그라운드에서 타이머가 돌고 있어도
// 정지 메시지를 받을 스크립트 자체가 로드돼 있지 않다. 메시지를 보내기 전에 반드시 불러온다.
async function ensureExclusiveFrameLoaded(kind){
  const frame=exclusiveFrames[kind];
  if(!frame) return null;
  if(!frame.getAttribute('src') && frame.dataset.src){
    frame.src=frame.dataset.src;
    await new Promise(r=>frame.addEventListener('load',r,{once:true}));
  }else if(frame.getAttribute('src') && (!frame.contentDocument || frame.contentDocument.readyState!=='complete')){
    await new Promise(r=>{
      if(frame.contentDocument && frame.contentDocument.readyState==='complete'){ r(); return; }
      frame.addEventListener('load',r,{once:true});
    });
  }
  return frame;
}

async function stopExclusive(kind, atMs){
  const frame=await ensureExclusiveFrameLoaded(kind);
  return new Promise(resolve=>{
    if(!frame?.contentWindow){resolve(true);return}
    const req='stop-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    // [FIX5] 1200ms 타임아웃을 3000ms 로 늘리고, 타임아웃 시 실패로 간주한다.
    //        성공(ok:true) 응답을 받은 경우에만 실제로 종료된 것으로 취급해야
    //        뒤늦게 도착한 stop 이 새로 시작한 세션의 active_timer 를 삭제하는
    //        레이스 컨디션을 막을 수 있다. (FIX2 와 함께 이중 방어)
    const timer=setTimeout(()=>{
      window.removeEventListener('message',done);
      console.warn('[FIX5] stopExclusive 응답 타임아웃:', kind);
      resolve(false);
    },3000);
    function done(ev){
      if(ev.origin!==location.origin||ev.source!==frame.contentWindow||
         ev.data?.type!=='exclusive-session-stopped'||ev.data?.req!==req)return;
      clearTimeout(timer);window.removeEventListener('message',done);resolve(ev.data.ok!==false);
    }
    window.addEventListener('message',done);
    frame.contentWindow.postMessage({type:'exclusive-session-stop',kind,req,at:atMs},location.origin);
  });
}
window.addEventListener('message',ev=>{
  if(ev.origin!==location.origin)return;
  if(ev.data?.type==='exclusive-session-ended'){
    if(exclusiveActive===ev.data.kind){ exclusiveActive=null; setExclusiveTabStatus(null); }
    if(lastTransition?.startedKind===ev.data.kind) lastTransition=null;
    if(pendingStart?.kind===ev.data.kind) pendingStart=null;
    return;
  }
  if(ev.data?.type==='exclusive-session-cancel-start'){
    const kind=ev.data.kind;

    // 아직 큐에서 처리 안 된 시작 요청이면 → 무효화만 하고 끝
    // (2단계에서 aborted 감지해서 알아서 되돌림)
    if(pendingStart && pendingStart.kind===kind && pendingStart.aborted===false){
      pendingStart.aborted = true;
      if(exclusiveActive!==kind && !lastTransition){
        exclusiveActive=null;
        setExclusiveTabStatus(null);
      }
      return;
    }

    // 이미 활성화된 상태에서 취소된 경우
    exclusiveQueue=exclusiveQueue.then(async()=>{
      const canUndo = lastTransition && lastTransition.startedKind===kind && lastTransition.previousKind;
      if(canUndo){
        const {previousKind:target, atMs}=lastTransition;
        exclusiveFrames[target]?.contentWindow?.postMessage(
          {type:'exclusive-session-undo-stop', atMs}, location.origin);
        exclusiveActive=target;
        setExclusiveTabStatus(target);
      }else if(exclusiveActive===kind){
        exclusiveActive=null;
        setExclusiveTabStatus(null);
      }
      lastTransition=null;
    });
    return;
  }
  if(ev.data?.type!=='exclusive-session-start')return;
  const kind=ev.data.kind, req=ev.data.req;
  const atMs=Number.isFinite(ev.data.at)?ev.data.at:Date.now();
  if(!exclusiveFrames[kind])return;

  // 이전에 대기 중이던 시작 요청은 무효화
  if(pendingStart) pendingStart.aborted = true;
  pendingStart = {kind, req, atMs, aborted:false};

  exclusiveQueue=exclusiveQueue.then(async()=>{
    // 큐에 들어와서 실행할 시점에 이미 취소됐는지 확인
    if(pendingStart?.req !== req || pendingStart.aborted){
      ev.source?.postMessage({type:'exclusive-session-result',req,ok:false},location.origin);
      return;
    }

    const previousActive = exclusiveActive!==kind ? exclusiveActive : null;

    // 다른 기록장들 먼저 정지
    await Promise.all(
      Object.keys(exclusiveFrames)
        .filter(other=>other!==kind)
        .map(k=>stopExclusive(k, atMs))
    );

    // 정지시키는 동안 취소가 왔으면 → 방금 정지시킨 것을 되돌림
    if(pendingStart?.req !== req || pendingStart.aborted){
      if(previousActive){
        exclusiveFrames[previousActive]?.contentWindow?.postMessage(
          {type:'exclusive-session-undo-stop', atMs}, location.origin);
        exclusiveActive = previousActive;
        setExclusiveTabStatus(previousActive);
      }
      ev.source?.postMessage({type:'exclusive-session-result',req,ok:false},location.origin);
      return;
    }

    // 정상 시작 확정
    exclusiveActive=kind;
    setExclusiveTabStatus(kind);
    lastTransition = previousActive ? {startedKind:kind, previousKind:previousActive, atMs} : null;
    ev.source?.postMessage({type:'exclusive-session-result',req,ok:true},location.origin);
    if(pendingStart?.req===req) pendingStart=null;
  });
});

    if(!frame.getAttribute('src') && frame.dataset.src) frame.src=frame.dataset.src;
    const timer=setTimeout(()=>reject(new Error('load timeout')),8000);
    frame.addEventListener('load',()=>{clearTimeout(timer);resolve(frame)},{once:true});
  });
}
let sharedBackupDirectoryHandle=null;
async function downloadJSON(data,name){
  const text=JSON.stringify(data,null,2);
  if(sharedBackupDirectoryHandle){
    try{
      const permission=await sharedBackupDirectoryHandle.queryPermission({mode:'readwrite'});
      if(permission==='granted'||await sharedBackupDirectoryHandle.requestPermission({mode:'readwrite'})==='granted'){
        const fileHandle=await sharedBackupDirectoryHandle.getFileHandle(name,{create:true});
        const writable=await fileHandle.createWritable();
        await writable.write(text);await writable.close();return;
      }
    }catch(e){}
  }
  const blob=new Blob([text],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function backupDate(){
  const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
async function getJournalBackup(kind){
  const frame=await ensureFrameLoaded(kind);
  const fn=frame.contentWindow?.collectBackupData;
  if(typeof fn!=='function')throw new Error('backup function unavailable');
  return fn.call(frame.contentWindow);
}
function initSharedBackupUI(){
  const main=document.getElementById('sharedBackupBtn'),choice=document.getElementById('sharedBackupChoice');
  const restore=document.getElementById('sharedRestoreBtn'),file=document.getElementById('sharedRestoreFile');
  const locationBtn=document.getElementById('sharedBackupLocationBtn'),locationStatus=document.getElementById('sharedBackupLocationStatus');
  locationBtn.addEventListener('click',async()=>{
    if(typeof window.showDirectoryPicker!=='function'){alert('이 브라우저에서는 저장 위치를 직접 지정할 수 없습니다. 백업 파일은 기본 다운로드 폴더에 저장됩니다.');return;}
    try{
      sharedBackupDirectoryHandle=await window.showDirectoryPicker({mode:'readwrite'});
      locationStatus.textContent=`저장 위치: ${sharedBackupDirectoryHandle.name}`;
    }catch(e){if(e?.name!=='AbortError')alert('저장 위치를 설정하지 못했습니다.');}
  });
  main.addEventListener('click',()=>{const open=!choice.classList.contains('open');choice.classList.toggle('open',open);choice.setAttribute('aria-hidden',String(!open));});
  choice.querySelectorAll('[data-backup-kind]').forEach(btn=>btn.addEventListener('click',async()=>{
    const kind=btn.dataset.backupKind;
    try{
      if(kind==='all'){
        const [study,lecture,sleep]=await Promise.all(['study','lecture','sleep'].map(getJournalBackup));
        downloadJSON({app:'journal-all',version:1,exportedAt:new Date().toISOString(),study,lecture,sleep},`journal-all-backup-${backupDate()}.json`);
      }else{
        const data=await getJournalBackup(kind);
        const names={study:'study-log',lecture:'lecture-log',sleep:'sleep-log'};
        downloadJSON(data,`${names[kind]}-backup-${backupDate()}.json`);
      }
      choice.classList.remove('open');choice.setAttribute('aria-hidden','true');
    }catch(e){alert('백업 파일을 만들지 못했습니다. 잠시 후 다시 시도해주세요.');}
  }));
  restore.addEventListener('click',()=>file.click());
  file.addEventListener('change',()=>{alert('복원 선택 메뉴는 다음 단계에서 연결할 수 있습니다.');file.value='';});
}
initSharedBackupUI();
</script>
