<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>공부장</title>

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3B6E5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공부장">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#EFF1EC;
    --surface:#FFFFFF;
    --ink:#1F2A24;
    --ink-soft:#57635C;
    --line:#DDE2D9;
    --accent:#3B6E5C;
    --accent-soft:#E4EEE9;
    --warn:#B5533C;
    --warn-soft:#F7E7E2;
    --study:#1B5E3A;
    --waste:#A13327;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:88px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 8px;}

  /* header */
  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;position:relative;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
  .settings-top-btn{display:block;margin:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.05);position:relative;z-index:5;min-height:42px;}
  .settings-top-btn:active{transform:translateY(1px);}
  .study-timer{
    min-width:150px;min-height:42px;border:1.5px solid #BFCFC6;background:#F7FAF8;
    border-radius:11px;padding:5px 13px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 2px 7px rgba(31,42,36,.08);font-variant-numeric:tabular-nums;line-height:1.05;flex-shrink:0;
  }
  .study-timer-label{font-size:9.5px;color:var(--ink-soft);font-weight:700;margin-bottom:3px;}
  .study-timer-time{font-size:19px;font-weight:800;letter-spacing:.06em;color:var(--ink);}
  .study-timer.running{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 2px 9px rgba(59,110,92,.14);}
  .study-timer.running .study-timer-label{color:var(--accent);}
  .study-timer.running .study-timer-time{color:var(--accent);}
  .datebar button{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer;
  }
  .date-center{text-align:center;flex:1;cursor:pointer;border-radius:10px;padding:3px 6px;transition:background .15s;}
  .date-center:active{background:var(--accent-soft);}
  #datePicker{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
  .week-mini{font-size:11px;color:var(--ink-soft);margin-bottom:1px;font-weight:600;}
  .date-big{font-family:'Source Serif 4',serif;font-size:26px;font-weight:600;letter-spacing:-.01em;}
  .date-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .day-rule{font-size:10px;color:var(--ink-soft);opacity:.7;margin-top:3px;}

  .wake-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:14px;
  }
  .wake-label{font-size:13.5px;color:var(--ink-soft);}
  .wake-time{font-size:17px;font-variant-numeric:tabular-nums;font-weight:600;margin-top:1px;}
  .wake-btn{
    border:none;background:var(--accent);color:#fff;border-radius:10px;
    padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .wake-btn.recorded{background:var(--accent-soft);color:var(--accent);}

  /* tabs */
  .view-controls{display:flex;gap:8px;align-items:stretch;margin-bottom:16px;}
  .top-chart-btn{flex:0 0 auto;width:auto;padding:8px 11px!important;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.05);font-size:13px!important;border-radius:10px!important;position:relative;z-index:5;min-height:42px;}
  .chart-toggle-btn{
    display:block;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:12px;padding:0 11px;font-size:12px;font-weight:700;cursor:pointer;
  }
    .chart-toggle-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tabs{display:flex;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:0;}
  .tabs button{
    flex:1;border:none;background:none;padding:9px 0;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);border-radius:9px;cursor:pointer;
  }
  .tabs button.active{background:var(--accent);color:#fff;}

  .data-tools{display:flex;gap:8px;margin:-6px 0 14px;}
  .data-btn{
    flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .data-btn:active{transform:translateY(1px);}
  #restoreFile{display:none;}
.cloud-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:-6px 0 14px;}
  .cloud-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .cloud-title{font-size:13px;font-weight:700;}
  .cloud-status{font-size:11.5px;color:var(--ink-soft);}
  .cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .cloud-grid input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12.5px;background:var(--bg);color:var(--ink);}
  .cloud-grid input:focus{outline:1px solid var(--accent);}
  .cloud-actions{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
  .cloud-actions .data-btn{min-width:120px;}
  .cloud-setup{display:none;margin-top:8px;}
  .cloud-setup.show{display:block;}
  .cloud-note{font-size:11px;color:var(--ink-soft);line-height:1.45;margin-top:7px;}

  /* period cards */
  .period-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;
  }
  .period-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .period-num{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;}
  .subject-input{
    flex:1;border:none;background:none;font-size:14px;font-weight:600;color:var(--ink);
    margin:0 8px;padding:4px 2px;border-bottom:1px solid transparent;min-width:0;
  }
  .subject-input:focus{outline:none;border-bottom:1px solid var(--accent);}
  .subject-input::placeholder{color:var(--ink-soft);font-weight:400;}
  .period-del{border:none;background:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:2px 6px;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .field{background:var(--bg);border-radius:9px;padding:7px 10px;}
  .field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:2px;font-weight:700;}
  .field input{
    width:100%;border:none;background:none;font-size:15px;color:var(--ink);
    font-variant-numeric:tabular-nums;font-weight:700;padding:0;
  }
  .field input:focus{outline:none;}
  .field.time .stamp{font-size:15px;font-weight:600;color:var(--ink);}
  .field.time .empty{font-size:13px;color:var(--ink-soft);font-style:normal;}
  .field.time input{font-size:12.5px;}

  .period-stats{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .stat{font-size:12px;color:var(--ink-soft);}
  .stat b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .stat b.study-color{color:var(--study);}
  .stat b.waste-color{color:var(--waste);}
  .stat b.stat-error{color:#fff;background:var(--waste);border-radius:6px;padding:1px 6px;font-size:12.5px;}

  .add-btn{
    width:100%;border:1.5px dashed var(--line);background:none;color:var(--accent);
    border-radius:var(--radius);padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px;
  }

  .summary-card{
    position:sticky;top:8px;z-index:20;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 16px 14px;margin-bottom:12px;
  }
  .summary-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:11px;position:relative;}
  .summary-title{font-size:13px;color:var(--ink-soft);margin-bottom:10px;font-weight:600;}
  .summary-head .summary-title{margin-bottom:0;}
  .today-summary-title{font-size:15px;width:auto;text-align:left;justify-self:start;}
  .summary-head .study-timer{grid-column:2;justify-self:center;}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .summary-item b{display:block;font-size:19px;font-variant-numeric:tabular-nums;}
  .summary-item span{font-size:11.5px;color:var(--ink-soft);}
  .summary-item.warn b{color:var(--waste);}
  .summary-item.ok b{color:var(--study);}
  /* 합계: 공부 페이지와 낭비시간을 오른쪽으로 정돈 */
  .summary-grid .summary-item:nth-child(2){text-align:center;transform:translateX(10px);}
  .summary-grid .summary-item:nth-child(3){text-align:right;}
  /* 교시별 통계: 세 항목 사이 간격을 넓혀 보기 쉽게 배치 */
  .period-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .period-stats .stat:nth-child(2){text-align:center;}
  .period-stats .stat:nth-child(3){text-align:right;}

  .agg-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;
  }
  .agg-label{font-size:14px;font-weight:600;}
  .agg-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .agg-nums{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-soft);}
  .agg-nums b{color:var(--ink);font-size:14px;}
  .agg-nums b.study-color{color:var(--study);}
  .agg-nums b.waste-color{color:var(--waste);}

  .empty-state{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:30px 10px;}

  /* 통계 꺾은선 그래프 */
  .charts-wrap{display:grid;gap:10px;margin:10px 0 14px;}
  .chart-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px 9px;}
  .chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 4px 6px;}
  .chart-title{font-size:13px;font-weight:700;color:var(--ink);}
  .chart-unit{font-size:12px;font-weight:800;color:#2563eb;}
  .chart-avg-note{font-size:10.5px;color:var(--ink-soft);margin:-2px 4px 7px;text-align:right;line-height:1.35;}
  .bar-chart{width:100%;height:126px;display:block;overflow:visible;}
  .chart-grid{stroke:var(--line);stroke-width:1;}
  .chart-axis-label{font-size:9.5px;fill:var(--ink-soft);font-family:inherit;}
  .chart-line-study{fill:none;stroke:var(--study);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .chart-line-pages{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .chart-line-waste{fill:none;stroke:var(--waste);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .chart-dot-study{fill:var(--study);}
  .chart-dot-pages{fill:var(--accent);}
  .chart-dot-waste{fill:var(--waste);}
  .chart-bar-study{fill:var(--study);}
  .chart-bar-pages{fill:#2563eb;}
  .chart-bar-waste{fill:#dc2626;}
  .chart-empty{font-size:12px;color:var(--ink-soft);padding:18px 8px;text-align:center;}
  .chart-card{position:relative;}
  .chart-tooltip{position:absolute;z-index:20;pointer-events:none;background:#111827;color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;line-height:1.25;box-shadow:0 4px 12px rgba(0,0,0,.18);transform:translate(-50%,-115%);white-space:nowrap;display:none;}
  .chart-bar-study,.chart-bar-pages,.chart-bar-waste{cursor:pointer;}

  /* settings */
  .settings-overlay{
    position:fixed;inset:0;background:rgba(31,42,36,.38);z-index:100;
    display:none;align-items:flex-end;justify-content:center;padding:16px;
  }
  .settings-overlay.show{display:flex;}
  .settings-panel{
    width:min(520px,100%);background:var(--surface);border:1px solid var(--line);
    border-radius:18px;padding:18px;box-shadow:0 14px 45px rgba(0,0,0,.16);
  }
  .settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .settings-title{font-size:17px;font-weight:700;}
  .settings-close{border:none;background:none;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:2px 6px;}
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line);}
  .setting-row:first-of-type{border-top:none;}
  .setting-label{font-size:13.5px;font-weight:700;}
  .setting-desc{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
  .setting-status{font-size:11.5px;color:var(--accent);margin-top:6px;line-height:1.45;font-weight:600;}
  .setting-select{min-width:132px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:9px 10px;font-size:13px;font-weight:600;}
  .settings-actions{display:flex;gap:8px;margin-top:14px;}
  .settings-actions button{flex:1;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .settings-cancel{border:1px solid var(--line);background:var(--surface);color:var(--ink);}
  .settings-save{border:none;background:var(--accent);color:#fff;}
  .settings-danger-wrap{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .settings-danger{width:100%;border:1px solid #dc2626;background:#fff;color:#dc2626;border-radius:10px;padding:11px 12px;font-size:13.5px;font-weight:800;cursor:pointer;}
  .settings-danger:active{transform:translateY(1px);}
  .settings-danger-note{margin-top:6px;font-size:11px;line-height:1.4;color:var(--ink-soft);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">

  <div class="top-actions">
    <button class="chart-toggle-btn top-chart-btn" id="chartToggle" aria-pressed="false">📈 그래프 보기</button>
    <button class="settings-top-btn" id="settingsBtn" aria-label="설정 열기">⚙ 설정</button>
  </div>

  <div class="datebar">
    <button id="prevDay">‹</button>
    <div class="date-center" id="dateCenter" role="button" tabindex="0" aria-label="날짜 선택" title="눌러서 날짜 선택">
      <div class="week-mini" id="weekMini">-</div>
      <div class="date-big" id="dateBig">-</div>
      <div class="date-sub" id="dateSub">-</div>
      <div class="day-rule" id="dayRule">하루 집계 기준 오전 4시</div>
    </div>
    <button id="nextDay">›</button>
  </div>
  <input type="date" id="datePicker" aria-hidden="true">

  <div class="view-controls">
    <div class="tabs">
      <button class="active" data-view="day">오늘</button>
      <button data-view="week">주별</button>
      <button data-view="month">월별</button>
      <button data-view="year">년도별</button>
    </div>
  </div>

  <div class="data-tools">
    <button class="data-btn" id="backupData">데이터 백업</button>
    <button class="data-btn" id="restoreData">데이터 복원</button>
    <input type="file" id="restoreFile" accept="application/json,.json">
  </div>
<div class="cloud-card">
    <div class="cloud-head">
      <div class="cloud-title">☁ 클라우드 저장</div>
      <div class="cloud-status" id="cloudStatus">설정 안 됨</div>
    </div>
    <div class="cloud-actions">
      <button class="data-btn" id="toggleCloudSetup">로그인 / 회원가입</button>
      <button class="data-btn" id="cloudUpload">전체 클라우드 저장</button>
      <button class="data-btn" id="cloudDownload">클라우드에서 불러오기</button>
      <button class="data-btn" id="cloudLogout" style="display:none">로그아웃</button>
    </div>
    <div class="cloud-setup" id="cloudSetup">
      <div class="cloud-grid">
        <input id="cloudEmail" type="email" placeholder="이메일">
        <input id="cloudPassword" type="password" placeholder="비밀번호 (6자 이상)">
      </div>
      <div class="cloud-actions">
        <button class="data-btn" id="cloudSignUp">회원가입</button>
        <button class="data-btn" id="cloudLogin">로그인</button>
        <button class="data-btn" id="cloudGoogle">Google로 로그인</button>
      </div>
      <div class="cloud-note">Supabase 연결 정보는 이미 설정되어 있습니다. 로그인 후에는 공부 기록이 브라우저와 클라우드에 함께 자동 저장됩니다.</div>
    </div>
  </div>

  <div id="dayView">
    <div class="summary-card">
      <div class="summary-head">
        <div class="summary-title today-summary-title">오늘 합계</div>
        <div class="study-timer" id="studyTimer" aria-live="polite" title="시작 페이지 입력 시 시작 · 끝 페이지 입력 시 종료">
          <span class="study-timer-label" id="studyTimerLabel">타이머</span>
          <span class="study-timer-time" id="studyTimerTime">00:00:00</span>
        </div>
      </div>
      <div class="summary-grid">
        <div class="summary-item ok"><b id="sumStudy">0분</b><span>공부시간</span></div>
        <div class="summary-item"><b id="sumPages">0쪽</b><span>공부 페이지</span></div>
        <div class="summary-item warn"><b id="sumWaste">0분</b><span>낭비시간</span></div>
      </div>
    </div>

    <div id="dayCharts"></div>
    <div id="periodList"></div>
    <button class="add-btn" id="addPeriod">+ 교시 추가</button>
  </div>

  <div id="weekView" style="display:none;"></div>
  <div id="monthView" style="display:none;"></div>
  <div id="yearView" style="display:none;"></div>

</div>

<div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <div class="settings-title" id="settingsTitle">설정</div>
      <button class="settings-close" id="settingsClose" aria-label="설정 닫기">×</button>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-label">하루 집계 기준시간</div>
        <div class="setting-desc">00:00~11:00 중 1시간 단위로 선택합니다. 변경한 시간은 현재 공부일을 건드리지 않고 다음 적용 시점부터 사용됩니다.</div>
        <div class="setting-status" id="dayStartStatus"></div>
      </div>
      <select class="setting-select" id="dayStartSelect" aria-label="하루 집계 기준시간"></select>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-label">일주일 시작 요일</div>
        <div class="setting-desc">주차 계산과 주별 정리에 적용됩니다.</div>
      </div>
      <select class="setting-select" id="weekStartSelect" aria-label="일주일 시작 요일"></select>
    </div>
    <div class="settings-actions">
      <button class="settings-cancel" id="settingsCancel">취소</button>
      <button class="settings-save" id="settingsSave">저장</button>
    </div>
    <div class="settings-danger-wrap">
      <button class="settings-danger" id="deleteAllRecords">모든 기록 삭제</button>
      <div class="settings-danger-note">공부 기록만 삭제하며 설정과 로그인 정보는 유지됩니다.</div>
    </div>

<script>
// BUILD: v9.3-cross-device-period-lock
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const fmtHM = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function fmtDuration(min){
  min = Math.max(0, Math.round(min));
  if(min < 60) return `${min}분`;

  // 24시간 이상은 일(day) 단위로 표시
  if(min >= 24 * 60){
    const d = Math.floor(min / (24 * 60));
    const remain = min % (24 * 60);
    const h = Math.floor(remain / 60);
    const m = remain % 60;
    const parts = [`${d}일`];
    if(h > 0) parts.push(`${h}시간`);
    if(m > 0) parts.push(`${m}분`);
    return parts.join(' ');
  }

  const h = Math.floor(min/60), m = min%60;
  return m>0 ? `${h}시간 ${m}분` : `${h}시간`;
}
const dayKeys = ['일','월','화','수','목','금','토'];

// 사용자 설정: 하루 집계 기준시간 / 일주일 시작 요일
const SETTINGS_KEY = 'studySettings:v1';
const DEFAULT_SETTINGS = { dayStartHour: 11, weekStartDay: 6, pendingDayStart: null }; // 기본 11:00, 6 = 토요일
function loadSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    const dayStartHour = Number(saved.dayStartHour);
    const weekStartDay = Number(saved.weekStartDay);
    let pendingDayStart = null;
    if(saved.pendingDayStart && typeof saved.pendingDayStart === 'object'){
      const ph = Number(saved.pendingDayStart.hour);
      const pe = String(saved.pendingDayStart.effectiveAt || '');
      if(Number.isInteger(ph) && ph >= 0 && ph <= 11 && pe && !isNaN(new Date(pe).getTime())){
        pendingDayStart = {hour:ph, effectiveAt:pe};
      }
    }
    return {
      dayStartHour: Number.isInteger(dayStartHour) && dayStartHour >= 0 && dayStartHour <= 11 ? dayStartHour : DEFAULT_SETTINGS.dayStartHour,
      weekStartDay: Number.isInteger(weekStartDay) && weekStartDay >= 0 && weekStartDay <= 6 ? weekStartDay : DEFAULT_SETTINGS.weekStartDay,
      pendingDayStart
    };
  }catch(e){ return {...DEFAULT_SETTINGS}; }
}
let appSettings = loadSettings();

function nextBoundaryForHour(hour, from = new Date()){
  const d = new Date(from.getFullYear(), from.getMonth(), from.getDate(), hour, 0, 0, 0);
  if(d <= from) d.setDate(d.getDate()+1);
  return d;
}
function maybeActivatePending(){
  const p = appSettings.pendingDayStart;
  if(!p) return false;

  if(new Date() < when) return false;
  appSettings.dayStartHour = p.hour;
  appSettings.pendingDayStart = null;
  saveSettings();
  return true;
}
maybeActivatePending();
function logicalToday(){
  maybeActivatePending();
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(now.getHours() < appSettings.dayStartHour) d.setDate(d.getDate()-1);
  return d;
}

function enforceStudyDayLimit(){

}
function hourLabel(h){
  if(h === 0) return '자정 12시';
  if(h < 12) return `오전 ${h}시`;
  if(h === 12) return '오후 12시';
  return `오후 ${h-12}시`;
}
function formatEffectiveAt(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let cur = logicalToday();
let monthCache = {}; // "YYYY-MM" -> data object
let currentView = 'day';

function ymKey(date){ return `${date.getFullYear()}-${pad(date.getMonth()+1)}`; }
function dKey(date){ return String(date.getDate()); }

function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function hm(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

// 옛 버전 데이터(날짜 없이 시간만 저장, 혹은 하나의 dt 문자열)를
// 날짜(startDate/endDate)와 시간(startTime/endTime)이 분리된 새 구조로 변환
function legacyParse(s, year, mo, dayNum){
  if(!s) return null;
  if(s.includes('T')){
    const [datePart, timePart] = s.split('T');
    const [y,m,d] = datePart.split('-').map(Number);
    const [h,mi] = timePart.split(':').map(Number);
    return new Date(y,m-1,d,h,mi);
  }
  // 아주 예전 버전(시각만 저장된 데이터): 현재 집계 기준시간으로 날짜 추정
  const [h,mi] = s.split(':').map(Number);
  if(isNaN(h)) return null;
  const base = new Date(year, mo-1, dayNum);
  if(h < appSettings.dayStartHour) base.setDate(base.getDate()+1);
  base.setHours(h,mi,0,0);
  return base;
}
function migratePeriod(p, year, mo, dayNum){
  if(p.startDate===undefined){
    const dt = legacyParse(p.start, year, mo, dayNum);
    p.startDate = dt ? ymd(dt) : '';
    p.startTime = dt ? hm(dt) : '';
    delete p.start;
  }
  if(p.endDate===undefined){
    const dt = legacyParse(p.end, year, mo, dayNum);
    p.endDate = dt ? ymd(dt) : '';
    p.endTime = dt ? hm(dt) : '';
    delete p.end;
  }
}


// ---------- 다중 기기 충돌 방지 동기화 ----------
function syncNow(){ return (typeof serverNowMs === 'function' ? Math.round(serverNowMs()) : Date.now()); }
function makeSyncId(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}
function deepClone(v){ return v == null ? v : JSON.parse(JSON.stringify(v)); }
function jsonSame(a,b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return a===b; } }
function ensureDaySync(day, ym='', dk=''){
  if(!day || typeof day!=='object') return day;
  if(!Array.isArray(day.periods)) day.periods=[];
  if(!Array.isArray(day._deletedPeriods)) day._deletedPeriods=[];
  day.periods.forEach((p, idx) => {
    if(!p._id) p._id = `${ym || 'legacy'}-${dk || 'day'}-${idx+1}`;
    if(!Number.isFinite(Number(p._order))) p._order = idx+1;
    if(!Number.isFinite(Number(p._createdAt))) p._createdAt = 0;
    if(!Number.isFinite(Number(p._updatedAt))) p._updatedAt = 0;
    if(!p._fieldUpdatedAt || typeof p._fieldUpdatedAt!=='object') p._fieldUpdatedAt = {};
  });
  if(!Number.isFinite(Number(day._metaUpdatedAt))) day._metaUpdatedAt = 0;
  return day;
}
function ensureMonthSync(month, ym=''){
  const m = month && typeof month==='object' ? month : {};
  Object.keys(m).forEach(dk => {
    if(/^\d{1,2}$/.test(dk)) ensureDaySync(m[dk], ym, dk);
  });
  return m;
}
function markChangedPeriodFields(p, before){
  if(!p) return;
  if(!p._id) p._id = makeSyncId();
  if(!p._fieldUpdatedAt || typeof p._fieldUpdatedAt!=='object') p._fieldUpdatedAt={};
  const ts = syncNow();
  const ignore = new Set(['_id','_order','_createdAt','_updatedAt','_fieldUpdatedAt']);
  const keys = new Set([...Object.keys(before||{}), ...Object.keys(p||{})]);
  let changed=false;
  keys.forEach(k => {
    if(ignore.has(k)) return;
    if(!jsonSame(before?.[k], p?.[k])){ p._fieldUpdatedAt[k]=ts; changed=true; }
  });
  if(changed) p._updatedAt=ts;
}
function tombstonePeriod(day, p){
  ensureDaySync(day);
  if(!p?._id) return;
  const ts=syncNow();
  const i=day._deletedPeriods.findIndex(x=>x && x.id===p._id);
  const t={id:p._id, ts};
  if(i>=0) day._deletedPeriods[i]=t; else day._deletedPeriods.push(t);
}
function mergePeriods(localP, remoteP){
  if(!localP) return deepClone(remoteP);
  if(!remoteP) return deepClone(localP);
  const l=deepClone(localP), r=deepClone(remoteP);
  if(!l._fieldUpdatedAt) l._fieldUpdatedAt={};
  if(!r._fieldUpdatedAt) r._fieldUpdatedAt={};
  const out={};
  const metaKeys=new Set(['_fieldUpdatedAt','_updatedAt']);
  const keys=new Set([...Object.keys(l),...Object.keys(r)]);
  keys.forEach(k=>{
    if(metaKeys.has(k)) return;
    if(k.startsWith('_') && k!=='_id' && k!=='_order' && k!=='_createdAt'){
      out[k] = Number(l._updatedAt||0) > Number(r._updatedAt||0) ? deepClone(l[k]) : deepClone(r[k]);
      return;
    }
    if(k==='_id'){ out[k]=l[k]||r[k]; return; }
    if(k==='_order'){
      const lv=Number(l[k]), rv=Number(r[k]);
      out[k]=Number.isFinite(lv)?lv:(Number.isFinite(rv)?rv:0); return;
    }
    if(k==='_createdAt'){
      const vals=[Number(l[k]),Number(r[k])].filter(v=>Number.isFinite(v)&&v>0);
      out[k]=vals.length?Math.min(...vals):0; return;
    }
    const lt=Number(l._fieldUpdatedAt?.[k] ?? l._updatedAt ?? 0);
    const rt=Number(r._fieldUpdatedAt?.[k] ?? r._updatedAt ?? 0);
    if(lt>rt) out[k]=deepClone(l[k]);
    else if(rt>lt) out[k]=deepClone(r[k]);
    else out[k]=jsonSame(l[k],r[k]) ? deepClone(l[k]) : deepClone(r[k]);
  });
  out._fieldUpdatedAt={};
  new Set([...Object.keys(l._fieldUpdatedAt||{}),...Object.keys(r._fieldUpdatedAt||{})]).forEach(k=>{
    out._fieldUpdatedAt[k]=Math.max(Number(l._fieldUpdatedAt?.[k]||0),Number(r._fieldUpdatedAt?.[k]||0));
  });
  out._updatedAt=Math.max(Number(l._updatedAt||0),Number(r._updatedAt||0),...Object.values(out._fieldUpdatedAt).map(Number));
  return out;
}
function mergeDays(localDay, remoteDay, ym='', dk=''){
  if(!localDay) return ensureDaySync(deepClone(remoteDay),ym,dk);
  if(!remoteDay) return ensureDaySync(deepClone(localDay),ym,dk);
  const l=ensureDaySync(deepClone(localDay),ym,dk), r=ensureDaySync(deepClone(remoteDay),ym,dk);
  const out={};
  const lmt=Number(l._metaUpdatedAt||0), rmt=Number(r._metaUpdatedAt||0);
  ['wake','cutoffHour'].forEach(k=>{
    if(lmt>rmt) out[k]=deepClone(l[k]);
    else if(rmt>lmt) out[k]=deepClone(r[k]);
    else out[k]=(r[k]!==undefined?deepClone(r[k]):deepClone(l[k]));
  });
  out._metaUpdatedAt=Math.max(lmt,rmt);
  const tomb=new Map();
  [...(l._deletedPeriods||[]),...(r._deletedPeriods||[])].forEach(t=>{
    if(!t?.id) return; const prev=tomb.get(t.id); if(!prev || Number(t.ts||0)>Number(prev.ts||0)) tomb.set(t.id,{id:t.id,ts:Number(t.ts||0)});
  });
  out._deletedPeriods=[...tomb.values()];
  const ids=new Set([...(l.periods||[]).map(p=>p._id),...(r.periods||[]).map(p=>p._id)]);
  const lm=new Map((l.periods||[]).map(p=>[p._id,p]));
  const rm=new Map((r.periods||[]).map(p=>[p._id,p]));
  out.periods=[];
  ids.forEach(id=>{
    if(!id) return;
    const merged=mergePeriods(lm.get(id),rm.get(id));
    const delTs=Number(tomb.get(id)?.ts||0);
    if(merged && Number(merged._updatedAt||0)>delTs) out.periods.push(merged);
    else if(merged && delTs===0) out.periods.push(merged);
  });
  out.periods.sort((a,b)=> (Number(a._order||0)-Number(b._order||0)) || (Number(a._createdAt||0)-Number(b._createdAt||0)) || String(a._id).localeCompare(String(b._id)));
  out.periods.forEach((p,i)=>{ if(!Number.isFinite(Number(p._order)) || Number(p._order)<=0) p._order=i+1; });
  return out;
}
function mergeMonths(localMonth, remoteMonth, ym=''){
  const l=ensureMonthSync(deepClone(localMonth||{}),ym), r=ensureMonthSync(deepClone(remoteMonth||{}),ym);
  const out={};
  const dayKeys=new Set([...Object.keys(l),...Object.keys(r)].filter(k=>/^\d{1,2}$/.test(k)));
  dayKeys.forEach(dk=>{ out[dk]=mergeDays(l[dk],r[dk],ym,dk); });
  return out;
}

async function loadMonth(ym){
  if(monthCache[ym]) return monthCache[ym];
  try{
    const raw = localStorage.getItem(`month:${ym}`);
    const m = raw ? JSON.parse(raw) : {};
    const [year, mo] = ym.split('-').map(Number);
    Object.keys(m).forEach(dk => {
      (m[dk].periods||[]).forEach(p => migratePeriod(p, year, mo, Number(dk)));
    });
    monthCache[ym] = ensureMonthSync(m, ym);
  }catch(e){
    monthCache[ym] = {};
  }
  return monthCache[ym];
}

async function saveMonth(ym){
  try{
    localStorage.setItem(`month:${ym}`, JSON.stringify(monthCache[ym]));
    await cloudSaveMonth(ym);
  }catch(e){
    console.error('저장 실패:', e);
    showToast('저장에 실패했어요 (저장 공간이 가득 찼거나 브라우저 저장이 꺼져있을 수 있어요)');
  }
}

function getDayData(){
  const ym = ymKey(cur), dk = dKey(cur);
  const m = monthCache[ym] || {};
  if(!m[dk]) m[dk] = { wake: null, periods: [], cutoffHour: appSettings.dayStartHour, _metaUpdatedAt:syncNow(), _deletedPeriods:[] };
  ensureDaySync(m[dk], ym, dk);
  if(!Number.isInteger(m[dk].cutoffHour)) m[dk].cutoffHour = appSettings.dayStartHour;
  monthCache[ym] = m;
  return m[dk];
}

const saveTimers = {};
async function persistToday(){
  // 매 입력마다 즉시 저장하면 요청이 몰려 실패할 수 있어, 입력이 잠시 멈춘 뒤 한 번만 저장

}

// 날짜(YYYY-MM-DD)와 시간(HH:MM)을 합쳐 실제 Date 객체로 변환.
// 날짜가 명시적으로 저장되어 있으므로 자정을 넘겨도 정확하게 계산된다.
function combineDT(dateStr, timeStr){
  if(!dateStr || !timeStr) return null;
  const [y,mo,d] = dateStr.split('-').map(Number);
  const [h,mi] = timeStr.split(':').map(Number);
  if([y,mo,d,h,mi].some(n => isNaN(n))) return null;
  return new Date(y,mo-1,d,h,mi);
}
function periodStartDT(p){ return combineDT(p.startDate, p.startTime); }
function periodEndDT(p){ return combineDT(p.endDate, p.endTime); }


// ---------- v9 FINAL: Supabase 서버 시간 보정 ----------
let serverClockOffsetMs = 0;
let serverClockCalibrated = false;
let serverClockLastCalibratedAt = 0;
let serverClockCalibrationBusy = false;

function serverNowMs(){
  return Date.now() + (serverClockCalibrated ? serverClockOffsetMs : 0);
}

async function calibrateServerClock(force=false){
  if(serverClockCalibrationBusy || !sbClient || !cloudUser) return serverClockOffsetMs;
  if(!force && serverClockCalibrated && Date.now() - serverClockLastCalibratedAt < 60000){
    return serverClockOffsetMs;
  }

  serverClockCalibrationBusy = true;
  try{
    // 왕복 요청의 중간 시각을 사용해 네트워크 지연을 반으로 보정한다.
    const t0 = Date.now();
    const {data,error} = await sbClient.rpc('server_now');
    const t1 = Date.now();
    if(error) throw error;

    const serverMs = Date.parse(data);
    if(!Number.isFinite(serverMs)) throw new Error('서버 시간을 읽지 못했습니다.');

    serverClockOffsetMs = Math.round(serverMs - ((t0 + t1) / 2));
    serverClockCalibrated = true;
    serverClockLastCalibratedAt = Date.now();

    updateStudyTimer();
    if(typeof syncAndroidTimer === 'function') syncAndroidTimer();
  }catch(e){
    console.warn('Supabase 서버 시계 보정 실패:', e);
  }finally{
    serverClockCalibrationBusy = false;
  }
  return serverClockOffsetMs;
}

// 1분마다 재보정하고, 화면으로 돌아올 때 즉시 다시 맞춘다.
setInterval(()=>{ if(cloudUser) calibrateServerClock(false); }, 60000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && cloudUser){
    calibrateServerClock(true);
    if(typeof syncActiveTimerFromCloud === 'function') syncActiveTimerFromCloud(true);
  }
});


// 시작 페이지 입력부터 끝 페이지 입력까지 초 단위로 보여주는 상단 타이머
function timerElapsedMs(p, nowMs = serverNowMs()){
  const start = Number(p?.timerStartedAt);
  if(!Number.isFinite(start) || start <= 0) return 0;
  const end = Number(p?.timerEndedAt);
  const until = Number.isFinite(end) && end >= start ? end : nowMs;
  return Math.max(0, until - start);
}
function formatTimer(ms){
  const total = Math.floor(Math.max(0, ms) / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  return `${pad(h)}:${pad(m)}:${pad(sec)}`;
}
function timerPeriodForCurrentDay(){
  const day = getDayData();
  // 실행 중인 타이머가 있으면 가장 최근 것을 우선 표시
  for(let i=day.periods.length-1; i>=0; i--){
    const p = day.periods[i];
    if(Number(p.timerStartedAt) > 0 && !(Number(p.timerEndedAt) >= Number(p.timerStartedAt))){
      return {p, idx:i, running:true};
    }
  }
  // 실행 중인 것이 없으면 가장 최근에 시작한 타이머의 최종 시간을 표시
  let best = null;
  day.periods.forEach((p, idx)=>{
    const started = Number(p.timerStartedAt);
    if(started > 0 && (!best || started > best.started)) best = {p, idx, started, running:false};
  });
  return best;
}
function updateStudyTimer(){
  const box = $('#studyTimer'), timeEl = $('#studyTimerTime'), labelEl = $('#studyTimerLabel');
  if(!box || !timeEl || !labelEl) return;
  const info = timerPeriodForCurrentDay();
  if(!info){
    timeEl.textContent = '00:00:00';
    labelEl.textContent = '타이머';
    box.classList.remove('running');
    return;
  }
  timeEl.textContent = formatTimer(timerElapsedMs(info.p));
  labelEl.textContent = info.running ? `${info.idx+1}교시 · 진행 중` : `${info.idx+1}교시 · 종료`;
  box.classList.toggle('running', !!info.running);
}
setInterval(updateStudyTimer, 250);


// ---------- v9 FINAL: Android APK 알림 브리지 ----------
// 일반 브라우저/PWA에서는 window.AndroidTimer가 없으므로 아무 동작도 하지 않는다.
let lastAndroidTimerKey = '';
function syncAndroidTimer(){
  try{
    if(!window.AndroidTimer) return;
    const info = timerPeriodForCurrentDay();

    if(!info){
      if(lastAndroidTimerKey !== 'clear'){
        window.AndroidTimer.clearTimer();
        lastAndroidTimerKey = 'clear';
      }
      return;
    }

    const p = info.p;
    const label = `${info.idx+1}교시`;

    if(info.running && Number(p.timerStartedAt) > 0){
      // 서버 epoch를 이 Android 기기의 wall clock epoch로 변환한다.
      // 1초 단위로 반올림해 작은 보정 흔들림 때문에 서비스가 반복 재시작되지 않게 한다.
      const localEpochStarted = Math.round(
        (Number(p.timerStartedAt) - (serverClockCalibrated ? serverClockOffsetMs : 0)) / 1000
      ) * 1000;
      const key = `run:${localEpochStarted}:${label}`;
      if(key !== lastAndroidTimerKey){
        window.AndroidTimer.startTimer(localEpochStarted, label);
        lastAndroidTimerKey = key;
      }
    }else if(Number(p.timerStartedAt) > 0){
      const elapsed = Math.floor(timerElapsedMs(p));
      const key = `stop:${elapsed}:${label}`;
      if(key !== lastAndroidTimerKey){
        window.AndroidTimer.stopTimer(elapsed, label);
        lastAndroidTimerKey = key;
      }
    }
  }catch(e){
    console.warn('Android 타이머 브리지 실패:', e);
  }
}

// 각 공부일은 생성 당시의 집계 기준시간을 보존한다. 설정을 바꿔도 과거 기록 범위는 변하지 않는다.
function cutoffForDate(date = cur){
  const ym = ymKey(date), dk = dKey(date);
  const day = monthCache[ym] && monthCache[ym][dk];
  return day && Number.isInteger(day.cutoffHour) ? day.cutoffHour : appSettings.dayStartHour;
}
// 현재 선택한 공부일(cur)에 기록할 수 있는 실제 시간 범위.
// 예: 기준 11:00이면 9/13 공부일 = 9/13 11:00 ~ 9/14 10:59.
function studyDayBounds(date = cur){
  const cutoff = cutoffForDate(date);
  const start = new Date(date.getFullYear(), date.getMonth(), date.getDate(), cutoff, 0, 0, 0);
  const endExclusive = new Date(start);
  endExclusive.setDate(endExclusive.getDate()+1);
  return { start, endExclusive };
}
function dtLocalValue(d){ return `${ymd(d)}T${hm(d)}`; }
function studyDayRangeText(date = cur){
  const {start, endExclusive} = studyDayBounds(date);
  const end = new Date(endExclusive.getTime()-60000);
  return `${start.getMonth()+1}/${start.getDate()} ${pad(start.getHours())}:${pad(start.getMinutes())} ~ ${end.getMonth()+1}/${end.getDate()} ${pad(end.getHours())}:${pad(end.getMinutes())}`;
}
function isWithinSelectedStudyDay(dt){
  if(!dt) return true;
  const {start, endExclusive} = studyDayBounds(cur);
  return dt >= start && dt < endExclusive;
}
function maxAllowedRecordDT(){
  const {endExclusive} = studyDayBounds(cur);
  const endLastMinute = new Date(endExclusive.getTime()-60000);
  const now = new Date(serverNowMs());
  return now < endLastMinute ? now : endLastMinute;
}
function recordRangeAlert(){
  alert(`이 공부일의 기록 가능 시간은 ${studyDayRangeText(cur)}입니다.`);
}

function minutesBetween(p){
  const s = periodStartDT(p), e = periodEndDT(p);
  if(!s || !e) return 0;
  const diff = Math.round((e - s) / 60000);
  return diff > 0 ? diff : 0;
}

function periodPages(p){
  return (p.endPage!==''&&p.startPage!=='' && p.endPage!=null && p.startPage!=null && !isNaN(p.endPage) && !isNaN(p.startPage))
    ? Math.max(0, Number(p.endPage)-Number(p.startPage)+1) : 0;
}

// 끝 페이지가 시작 페이지보다 작으면 물리적으로 모순
function pagesInvalid(p){
  return (p.startPage!=='' && p.endPage!=='' && p.startPage!=null && p.endPage!=null &&
          !isNaN(p.startPage) && !isNaN(p.endPage) && Number(p.endPage) < Number(p.startPage));
}

// 같은 교시 안에서 종료 일시가 시작 일시보다 이르면 물리적으로 모순
function studyInvalid(p){
  const s = periodStartDT(p), e = periodEndDT(p);
  if(!s || !e) return false;
  return (e - s) < 0;
}

// 낭비시간 = 이전 교시 종료 일시와 현재 교시 시작 일시의 차이 (자동 계산, 입력 없음)
function wasteBefore(periods, idx){
  if(idx===0) return 0;
  const prevEnd = periodEndDT(periods[idx-1]);
  const curStart = periodStartDT(periods[idx]);
  if(!prevEnd || !curStart) return 0;
  const diff = Math.round((curStart - prevEnd) / 60000);
  return diff > 0 ? diff : 0;
}

// 이전 교시 종료 일시보다 현재 교시 시작 일시가 더 빠르면(과거면) 물리적으로 모순
function wasteInvalid(periods, idx){
  if(idx===0) return false;
  const prevEnd = periodEndDT(periods[idx-1]);
  const curStart = periodStartDT(periods[idx]);
  if(!prevEnd || !curStart) return false;
  return (curStart - prevEnd) < 0;
}

function renderPeriods(){

  let sumStudy=0, sumWaste=0, sumPages=0;

  day.periods.forEach((p, idx) => {
    const study = minutesBetween(p);
    const pages = periodPages(p);
    const waste = wasteBefore(day.periods, idx);
    const pErr = pagesInvalid(p);
    const sErr = studyInvalid(p);
    const wErr = wasteInvalid(day.periods, idx);
    sumStudy += study; sumWaste += waste; sumPages += pages;
    if(sErr) sumStudyErr = true;
    if(pErr) sumPagesErr = true;
    if(wErr) sumWasteErr = true;

    const {start: dayStart} = studyDayBounds(cur);
    const maxRecord = maxAllowedRecordDT();

    const card = document.createElement('div');
    card.className = 'period-card';
    card.innerHTML = `
      <div class="period-head">
        <div class="period-num">${idx+1}교시</div>
        <input type="text" class="subject-input" data-idx="${idx}" data-k="subject" value="${p.subject || ''}" placeholder="과목">
        <button class="period-del" data-idx="${idx}">✕</button>
      </div>
      <div class="field-grid">
        <div class="field">
          <label>시작 페이지</label>
          <input type="text" inputmode="numeric" pattern="[1-9][0-9]*" autocomplete="off" data-page-positive-int="1" data-idx="${idx}" data-k="startPage" value="${p.startPage ?? ''}" placeholder="입력 시 자동기록">
        </div>
        <div class="field time">
          <label>시작일시</label>
          <input type="datetime-local" data-idx="${idx}" data-k="start" min="${minDT}" max="${maxDT}" value="${p.startDate && p.startTime ? p.startDate+'T'+p.startTime : ''}">
        </div>
        <div class="field">
          <label>끝 페이지</label>
          <input type="text" inputmode="numeric" pattern="[1-9][0-9]*" autocomplete="off" data-page-positive-int="1" data-idx="${idx}" data-k="endPage" value="${p.endPage ?? ''}" placeholder="입력 시 자동기록">
        </div>
        <div class="field time">
          <label>종료일시</label>
          <input type="datetime-local" data-idx="${idx}" data-k="end" min="${minDT}" max="${maxDT}" value="${p.endDate && p.endTime ? p.endDate+'T'+p.endTime : ''}">
        </div>
      </div>
      <div class="period-stats">
        <div class="stat">공부시간<b id="study-${idx}" class="${sErr ? 'stat-error' : 'study-color'}">${sErr ? '오류!' : fmtDuration(study)}</b></div>
        <div class="stat">공부 페이지<b id="pages-${idx}" class="${pErr ? 'stat-error' : ''}">${pErr ? '오류!' : pages + '쪽'}</b></div>
        ${idx>0 ? `<div class="stat">낭비시간<b id="waste-${idx}" class="${wErr ? 'stat-error' : 'waste-color'}">${wErr ? '오류!' : fmtDuration(waste)}</b></div>` : ''}
      </div>
    `;
    list.appendChild(card);
  });

  $('#sumStudy').textContent = sumStudyErr ? '오류!' : fmtDuration(sumStudy);
  $('#sumPages').textContent = sumPagesErr ? '오류!' : `${sumPages}쪽`;
  $('#sumWaste').textContent = sumWasteErr ? '오류!' : fmtDuration(sumWaste);
  $('#sumStudy').classList.toggle('stat-error', sumStudyErr);
  $('#sumPages').classList.toggle('stat-error', sumPagesErr);
  $('#sumWaste').classList.toggle('stat-error', sumWasteErr);
  renderDayCharts();

  if(day.periods.length===0){
    list.innerHTML = `<div class="empty-state">아직 기록한 교시가 없어요.<br>아래 버튼으로 추가해보세요.</div>`;

// 페이지 번호는 빈칸 또는 1 이상의 정수만 허용한다.
// -, +, ., e/E 및 기타 문자는 키보드/붙여넣기 모두 차단한다.
$('#periodList').addEventListener('beforeinput', (e) => {

  if(e.inputType && e.inputType.startsWith('delete')) return;

  }
});

$('#periodList').addEventListener('paste', (e) => {

  if(!(t instanceof HTMLInputElement) || t.dataset.pagePositiveInt !== '1') return;
  const text = (e.clipboardData || window.clipboardData)?.getData('text') ?? '';

    e.preventDefault();
    showToast('페이지는 1 이상의 정수만 입력할 수 있어요');
  }
});

$('#periodList').addEventListener('input', async (e) => {
  const t = e.target;
  if(t.tagName !== 'INPUT') return;
  const idx = Number(t.dataset.idx);
  const k = t.dataset.k;

  if((k==='startPage' || k==='endPage')){
    const raw = String(t.value ?? '');
    if(raw === ''){
      // 빈칸 허용
    } else if(!/^\d+$/.test(raw)){
      t.value = '';
      showToast('페이지는 1 이상의 정수만 입력할 수 있어요');
    } else {
      const normalized = raw.replace(/^0+/, '');
      t.value = normalized; // 0 또는 000은 빈칸, 0012는 12
    }
  }

  const day = getDayData();
  const p = day.periods[idx];
  ensureDaySync(day, ymKey(cur), dKey(cur));
  const beforeSync = deepClone(p);
  const prevVal = p[k];

  if(k==='start' || k==='end'){
    // datetime-local 하나로 날짜+시간을 함께 입력받아 "YYYY-MM-DDTHH:MM" 형태로 들어온다
    const dateKey = k==='start' ? 'startDate' : 'endDate';
    const timeKey = k==='start' ? 'startTime' : 'endTime';
    const prevDTVal = (p[dateKey] && p[timeKey]) ? `${p[dateKey]}T${p[timeKey]}` : '';

    // 시작/종료 일시는 선택한 공부일의 집계 범위 안에서만 입력 가능하고,
    // 현재 시각보다 미래로도 입력할 수 없다.
    if(t.value){
      const [d, tm] = t.value.split('T');
      const selected = combineDT(d, tm);
      if(selected && !isWithinSelectedStudyDay(selected)){
        recordRangeAlert();
        t.value = prevDTVal;
        return;
      }
      if(selected && selected.getTime() > serverNowMs()){
        alert('시작/종료 일시는 현재 시간보다 미래로 설정할 수 없습니다.');
        t.value = prevDTVal;
        return;
      }
      p[dateKey] = d || '';
      p[timeKey] = tm || '';
    } else {
      p[dateKey] = '';
      p[timeKey] = '';
    }
  } else {
    p[k] = t.value;
  }

  // 페이지 번호와 자동기록 시간을 서로 연동:
  // - 페이지를 처음 입력하는 순간(빈칸/0→값) 현재 날짜+시간을 자동 기록
  // - 페이지를 지우거나 0으로 만들면(값→빈칸/0) 자동 기록됐던 날짜+시간도 함께 지움
  // - 이미 값이 있는 상태에서 숫자를 더 입력/수정하는 것만으로는 시간이 바뀌지 않음
  if(k==='startPage' || k==='endPage'){
    const isBlankPage = v => (v==='' || v==null || Number(v)===0);
    const pageWasBlank = isBlankPage(prevVal);
    const pageIsBlank = isBlankPage(t.value);
    const dtKey = k==='startPage' ? 'start' : 'end';
    const dateKey = k==='startPage' ? 'startDate' : 'endDate';
    const timeKey = k==='startPage' ? 'startTime' : 'endTime';
    const dtInput = () => $('#periodList').querySelector(`input[data-k="${dtKey}"][data-idx="${idx}"]`);

    if(pageIsBlank){
      p[dateKey] = '';
      p[timeKey] = '';
      const di = dtInput(); if(di) di.value = '';
      if(k==='startPage'){
        p.timerStartedAt = null;
        p.timerEndedAt = null;
        if(cloudUser) await cloudClearActiveTimer();
      } else if(k==='endPage' && Number(p.timerStartedAt) > 0){
        // 끝 페이지를 지우면 같은 서버 시작 시점에서 다시 카운트한다.
        p.timerEndedAt = null;
        if(cloudUser) await cloudResumeActiveTimer(ymKey(cur), dKey(cur), p, idx);
      }
    } else if(pageWasBlank && !isNaN(t.value)){
      if(cloudUser && !serverClockCalibrated) await calibrateServerClock(false);
      const now = new Date(serverNowMs());
      // 현재 보고 있는 공부일이 실제 현재 공부일일 때만 '현재 시각' 자동기록.
      // 과거 공부일을 수정할 때는 범위를 벗어나는 현재 시각이 들어가지 않도록 일시를 직접 입력하게 한다.
      if(!p[timeKey]){
        if(isWithinSelectedStudyDay(now)){
          p[dateKey] = ymd(now);
          p[timeKey] = hm(now);
          const di = dtInput(); if(di) di.value = `${p[dateKey]}T${p[timeKey]}`;
        } else {
          const di = dtInput(); if(di) di.value = '';
          showToast('과거 공부일은 일시를 직접 입력해 주세요');
        }
      }
      // 실제 현재 공부일에서 페이지를 새로 입력할 때만 초 단위 타이머를 제어한다.
      if(isWithinSelectedStudyDay(now)){
        if(k==='startPage'){
          p.timerEndedAt = null;
          if(cloudUser){
            const row = await cloudStartActiveTimer(ymKey(cur), dKey(cur), p, idx);
            const ts = row?.started_at ? Date.parse(row.started_at) : NaN;
            p.timerStartedAt = Number.isFinite(ts) ? ts : Math.round(serverNowMs());
            await calibrateServerClock(true);
          }else{
            p.timerStartedAt = Math.round(serverNowMs());
          }
        } else if(k==='endPage' && Number(p.timerStartedAt) > 0 && !Number(p.timerEndedAt)){
          if(cloudUser){
            const row = await cloudStopActiveTimer();
            const ts = row?.stopped_at ? Date.parse(row.stopped_at) : NaN;
            p.timerEndedAt = Number.isFinite(ts) ? ts : Math.round(serverNowMs());
            await calibrateServerClock(true);
          }else{
            p.timerEndedAt = Math.round(serverNowMs());
          }
        }
      }
    }
    updateStudyTimer();
  }
  // 입력 중인 칸은 다시 그리지 않고, 계산되는 숫자만 갱신해서 포커스/커서를 유지
  markChangedPeriodFields(p, beforeSync);
  if(k !== 'subject') refreshStats();
  await persistToday();
});

// ---------- 통계 꺾은선 그래프 ----------
function escHtml(v){ return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function chartSvg(points, valueKey, kind, unit){
  if(!points.length) return '<div class="chart-empty">표시할 데이터가 없어요.</div>';
  const W=360,H=126,L=34,R=8,T=8,B=24;
  const vals=points.map(p=>Math.max(0,Number(p[valueKey])||0));
  let max=Math.max(...vals,1);
  max=max<=5?5:Math.ceil(max/5)*5;
  const innerW=W-L-R, innerH=H-T-B;
  const y=v=>T+innerH-(v/max)*innerH;
  const grid=[0,.5,1].map(fr=>{
    const gy=T+innerH-(innerH*fr);
    const val=Math.round(max*fr);
    return `<line class="chart-grid" x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}"/><text class="chart-axis-label" x="${L-5}" y="${gy+3}" text-anchor="end">${val}</text>`;
  }).join('');
  const n=Math.max(points.length,1);
  const slot=innerW/n;
  const barW=Math.max(4,Math.min(22,slot*0.58));
  const bars=points.map((p,i)=>{
    const v=Math.max(0,Number(p[valueKey])||0);
    const x=L+i*slot+(slot-barW)/2;
    const yy=y(v);
    const h=Math.max(v>0?2:0,T+innerH-yy);
    const displayValue = valueKey==='pages' ? `${Math.round(v)}쪽` : formatTooltipTime(v);
    return `<rect class="chart-bar-${kind}" data-chart-label="${escHtml(p.label)}" data-chart-value="${escHtml(displayValue)}" tabindex="0" x="${x}" y="${yy}" width="${barW}" height="${h}" rx="2"><title>${escHtml(p.label)}: ${escHtml(displayValue)}</title></rect>`;
  }).join('');
  const labels=points.map((p,i)=>{
    const x=L+i*slot+slot/2;
    return `<text class="chart-axis-label" x="${x}" y="${H-6}" text-anchor="middle">${escHtml(p.label)}</text>`;
  }).join('');
  return `<svg class="bar-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="통계 막대그래프">${grid}${bars}${labels}</svg>`;
}
let chartsVisible = false;

function formatTooltipTime(totalMinutes){
  const mins = Math.max(0, Math.round(Number(totalMinutes)||0));
  const days = Math.floor(mins / 1440);
  const hours = Math.floor((mins % 1440) / 60);
  const minutes = mins % 60;
  const parts=[];
  if(days) parts.push(`${days}일`);
  if(hours) parts.push(`${hours}시간`);
  if(minutes || !parts.length) parts.push(`${minutes}분`);
  return parts.join(' ');
}
function formatAvgTime(totalMinutes){
  const mins = Math.max(0, Math.round(Number(totalMinutes)||0));
  const days = Math.floor(mins / 1440);
  const hours = Math.floor((mins % 1440) / 60);
  const minutes = mins % 60;
  return `${days}일 ${hours}시간 ${minutes}분`;
}
function chartAverage(points, key){
  if(!points.length) return 0;
  return points.reduce((sum,p)=>sum+(Number(p[key])||0),0) / points.length;
}
function chartsHtml(points, averagePoints=points, averageLabel="평균", averageNote=""){
  if(!chartsVisible) return '';
  if(!points.length || points.every(p=>!p.study && !p.pages && !p.waste)) return '';
  const avgBase = Array.isArray(averagePoints) ? averagePoints : [];
  const hasAverage = avgBase.length > 0;
  const avgStudy = hasAverage ? formatAvgTime(chartAverage(avgBase,'study')) : '—';
  const avgPages = hasAverage ? `${Math.round(chartAverage(avgBase,'pages'))}쪽` : '—';
  const avgWaste = hasAverage ? formatAvgTime(chartAverage(avgBase,'waste')) : '—';
  const note = averageNote ? `<div class="chart-avg-note">${averageNote}</div>` : '';
  return `<div class="charts-wrap">
    <div class="chart-card"><div class="chart-head"><div class="chart-title">공부시간 추이</div><div class="chart-unit">${averageLabel} ${avgStudy}</div></div>${note}${chartSvg(points,'study','study','분')}</div>
    <div class="chart-card"><div class="chart-head"><div class="chart-title">공부 페이지 추이</div><div class="chart-unit">${averageLabel} ${avgPages}</div></div>${note}${chartSvg(points,'pages','pages','쪽')}</div>
    <div class="chart-card"><div class="chart-head"><div class="chart-title">낭비시간 추이</div><div class="chart-unit">${averageLabel} ${avgWaste}</div></div>${note}${chartSvg(points,'waste','waste','분')}</div>
  </div>`;
}

async function renderDayCharts(){
  const el = $('#dayCharts');
  if(!el) return;
  if(!chartsVisible){ el.innerHTML = ''; return; }

  // "오늘의 교시별"이 아니라, 현재 선택한 날짜가 속한 한 주를
  // 설정한 주 시작 요일부터 끝 요일까지 7개의 일자별 점으로 표시한다.
  const selected = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate());
  const offset = (selected.getDay() - appSettings.weekStartDay + 7) % 7;
  const weekStart = new Date(selected);
  weekStart.setDate(weekStart.getDate() - offset);

  const points = [];
  for(let i=0;i<7;i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate()+i);
    const ym = ymKey(d), dk = dKey(d);
    const m = await loadMonth(ym);
    const day = m[dk] || {periods:[]};
    const periods = day.periods || [];
    let study=0, pages=0, waste=0;
    periods.forEach((p, idx)=>{
      study += minutesBetween(p);
      pages += periodPages(p);
      waste += wasteBefore(periods, idx);
    });
    points.push({
      label:`${d.getMonth()+1}/${d.getDate()}(${dayKeys[d.getDay()]})`,
      study, pages, waste,
      date:new Date(d)
    });
  }

  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate()+6);
  const heading = `<div class="summary-title" style="margin:4px 0 8px;color:var(--ink-soft);font-size:12px;">일자별 · ${fmtMD(weekStart)} ~ ${fmtMD(weekEnd)} (${dayKeys[appSettings.weekStartDay]}요일 시작)</div>`;
  if(points.every(p=>!p.study && !p.pages && !p.waste)){
    el.innerHTML = heading + '<div class="chart-empty" style="margin-bottom:10px;">이 주에 기록된 그래프 데이터가 없어요.</div>';
    return;
  }
  // 평균은 아직 시작되지 않은 미래 공부일을 제외한다.
  // 지난 날짜의 0 기록은 포함해서 실제 일평균이 왜곡되지 않게 한다.
  const currentStudyDay = logicalToday();
  currentStudyDay.setHours(0,0,0,0);
  const averagePoints = points.filter(p => {
    const d = new Date(p.date);
    d.setHours(0,0,0,0);
    return d <= currentStudyDay;
  });
  el.innerHTML = heading + chartsHtml(points, averagePoints, '일 평균');
}

// ---------- 주별/월별 집계 ----------
// 설정한 요일 시작 기준 "n주차" 계산
function weekOffset(date){ return (date.getDay() - appSettings.weekStartDay + 7) % 7; }
function weekOfMonth(year, monthIdx1, dayNum){
  const firstDayOffset = weekOffset(new Date(year, monthIdx1-1, 1));
  return Math.floor((dayNum - 1 + firstDayOffset) / 7) + 1;
}
function weekRange(year, monthIdx1, w){
  const firstDayOffset = weekOffset(new Date(year, monthIdx1-1, 1));
  const startDayNum = (w-1)*7 - firstDayOffset + 1;
  const endDayNum = w*7 - firstDayOffset;
  const start = new Date(year, monthIdx1-1, startDayNum);
  const end = new Date(year, monthIdx1-1, endDayNum);
  return { start, end };
}
function fmtMD(d){ return `${d.getMonth()+1}/${d.getDate()}`; }

async function computeMonthAgg(ym){
  const [year, mo] = ym.split('-').map(Number);
  const m = await loadMonth(ym);
  const daysInMonth = new Date(year, mo, 0).getDate();
  const totalWeeks = weekOfMonth(year, mo, daysInMonth);
  const weeks = {};
  for(let w=1; w<=totalWeeks; w++){
    weeks[w] = {study:0,pages:0,waste:0,days:0, ...weekRange(year, mo, w)};
  }

  let monthStudy=0, monthPages=0, monthWaste=0;
  Object.keys(m).forEach(dk => {
    const dayNum = Number(dk);
    const dayData = m[dk];
    const periods = dayData.periods||[];
    let dStudy=0, dPages=0, dWaste=0;
    periods.forEach((p, idx)=>{
      dStudy += minutesBetween(p);
      dPages += periodPages(p);
      dWaste += wasteBefore(periods, idx);
    });
    const w = weekOfMonth(year, mo, dayNum);
    weeks[w].study += dStudy; weeks[w].pages += dPages; weeks[w].waste += dWaste; weeks[w].days += 1;
    monthStudy += dStudy; monthPages += dPages; monthWaste += dWaste;
  });
  return { weeks, monthStudy, monthPages, monthWaste };
}

async function renderMonthView(){
  const year = cur.getFullYear();
  const el = $('#monthView');
  el.innerHTML = `<div class="summary-title" style="margin:4px 0 10px;color:var(--ink-soft);font-size:13px;">${year}년 · 월별 정리</div><div class="empty-state">불러오는 중…</div>`;
  let html = '';
  let any = false;
  const chartPoints = [];
  for(let mo=1; mo<=12; mo++){
    const ym = `${year}-${pad(mo)}`;
    const { monthStudy, monthPages, monthWaste } = await computeMonthAgg(ym);
    chartPoints.push({label:`${mo}월`, study:monthStudy, pages:monthPages, waste:monthWaste});
    if(monthStudy===0 && monthPages===0 && monthWaste===0) continue;
    any = true;
    html += `
      <div class="agg-row">
        <div class="agg-label">${mo}월</div>
        <div class="agg-nums">
          공부 <b class="study-color">${fmtDuration(monthStudy)}</b> · 페이지 <b>${monthPages}쪽</b><br>낭비 <b class="waste-color">${fmtDuration(monthWaste)}</b>
        </div>
      </div>`;
  }
  const currentStudyDay = logicalToday();
  const averagePoints = chartPoints.filter((p, idx) => {
    if(year < currentStudyDay.getFullYear()) return true;
    if(year > currentStudyDay.getFullYear()) return false;
    return (idx + 1) < (currentStudyDay.getMonth() + 1);
  });
  el.innerHTML = `<div class="summary-title" style="margin:4px 0 10px;color:var(--ink-soft);font-size:13px;">${year}년 · 월별 정리</div>` +
    chartsHtml(chartPoints, averagePoints, '월 평균', '평균은 완료된 전월까지 계산합니다.') +
    (any ? html : `<div class="empty-state">${year}년에 기록된 데이터가 없어요.</div>`);
}

async function renderYearView(){
  const el = $('#yearView');
  const currentYear = logicalToday().getFullYear();
  const years = new Set([cur.getFullYear()]);
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    const m = k && k.match(/^month:(\d{4})-\d{2}$/);
    if(m) years.add(Number(m[1]));
  }
  Object.keys(monthCache).forEach(k=>{ const m=k.match(/^(\d{4})-\d{2}$/); if(m) years.add(Number(m[1])); });
  const sorted = [...years].filter(y=>y<=currentYear).sort((a,b)=>a-b);
  let rows = '';
  let any = false;
  const chartPoints = [];
  for(const year of sorted){
    let study=0, pages=0, waste=0;
    for(let mo=1; mo<=12; mo++){
      const a = await computeMonthAgg(`${year}-${pad(mo)}`);
      study += a.monthStudy; pages += a.monthPages; waste += a.monthWaste;
    }
    chartPoints.push({label:`${year}`, study, pages, waste});
    if(study===0 && pages===0 && waste===0) continue;
    any = true;
    rows = `<div class="agg-row"><div class="agg-label">${year}년</div><div class="agg-nums">공부 <b class="study-color">${fmtDuration(study)}</b> · 페이지 <b>${pages}쪽</b><br>낭비 <b class="waste-color">${fmtDuration(waste)}</b></div></div>` + rows;
  }
  el.innerHTML = `<div class="summary-title" style="margin:4px 0 10px;color:var(--ink-soft);font-size:13px;">년도별 정리</div>` +
    chartsHtml(chartPoints, chartPoints.filter(p => Number(p.label) < currentYear), '연 평균', '평균은 완료된 전년도까지 계산합니다.') +
    (any ? rows : `<div class="empty-state">기록된 연도별 데이터가 없어요.</div>`);
}

function hideChartTooltip(){
  document.querySelectorAll('.chart-tooltip').forEach(t=>t.style.display='none');

function showChartTooltip(bar, clientX, clientY){
  const card=bar.closest('.chart-card');
  if(!card) return;
  let tip=card.querySelector('.chart-tooltip');
  if(!tip){ tip=document.createElement('div'); tip.className='chart-tooltip'; card.appendChild(tip); }
  tip.textContent=`${bar.dataset.chartLabel} · ${bar.dataset.chartValue}`;
  tip.style.display='block';
  const cr=card.getBoundingClientRect();
  const br=bar.getBoundingClientRect();
  const x=(clientX!=null?clientX:(br.left+br.right)/2)-cr.left;
  const y=(clientY!=null?clientY:br.top)-cr.top;
  tip.style.left=`${Math.max(38,Math.min(cr.width-38,x))}px`;
  tip.style.top=`${Math.max(28,y)}px`;
}
document.addEventListener('mouseover',e=>{ const b=e.target.closest?.('[data-chart-value]'); if(b) showChartTooltip(b); });
document.addEventListener('mouseout',e=>{ if(e.target.closest?.('[data-chart-value]')) hideChartTooltip(); });
document.addEventListener('focusin',e=>{ const b=e.target.closest?.('[data-chart-value]'); if(b) showChartTooltip(b); });
document.addEventListener('focusout',e=>{ if(e.target.closest?.('[data-chart-value]')) hideChartTooltip(); });
document.addEventListener('click',e=>{ const b=e.target.closest?.('[data-chart-value]'); if(b){ showChartTooltip(b,e.clientX,e.clientY); } else hideChartTooltip(); });
document.addEventListener('touchstart',e=>{ const b=e.target.closest?.('[data-chart-value]'); if(b){ const t=e.touches[0]; showChartTooltip(b,t?.clientX,t?.clientY); } else hideChartTooltip(); },{passive:true});

  // 예약된 자동 저장이 삭제 직후 빈/옛 기록을 다시 저장하지 않도록 모두 취소한다.

async function stampExistingStudyDays(){
  const monthKeys = new Set();
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    const m = k && k.match(/^month:(\d{4}-\d{2})$/);
    if(m) monthKeys.add(m[1]);
  }
  Object.keys(monthCache).forEach(k=>{ if(/^\d{4}-\d{2}$/.test(k)) monthKeys.add(k); });
  for(const ym of monthKeys){
    await loadMonth(ym);
    const m = monthCache[ym] || {};
    let changed = false;
    Object.values(m).forEach(day=>{
      if(day && !Number.isInteger(day.cutoffHour)){ day.cutoffHour = appSettings.dayStartHour; day._metaUpdatedAt=syncNow(); changed = true; }
    });
    if(changed) await saveMonth(ym);
  }
}

$('#settingsSave').onclick = async () => {

  const requestedWeek = Number($('#weekStartSelect').value);

  appSettings.weekStartDay = requestedWeek;
  if(requestedHour === appSettings.dayStartHour){
    appSettings.pendingDayStart = null;
    saveSettings();
    closeSettings();
    await renderCurrentView();
    showToast('설정을 저장했어요');
    return;
  }

  // 현재 기준과 새 기준의 다음 경계 중 더 늦은 시점에 전환한다.
  // 이렇게 하면 날짜가 뒤로 튀거나 시간 구간이 겹치는 현상을 막을 수 있다.
  const now = new Date();
  const oldBoundary = nextBoundaryForHour(appSettings.dayStartHour, now);

  const effectiveAt = new Date(Math.max(oldBoundary.getTime(), newBoundary.getTime()));

  saveSettings();
  closeSettings();
  await renderCurrentView();
  showToast(`${pad(requestedHour)}:00 기준 · ${formatEffectiveAt(effectiveAt)}부터 적용`);

async function cloudSaveMonth(ym){
  if(!sbClient || !cloudUser || !monthCache[ym]) return;
  // 낙관적 병합: 저장 직전 클라우드 최신본을 읽고 날짜/교시/필드 단위로 합친다.
  // 같은 달을 여러 기기에서 동시에 수정해도 서로 다른 변경을 최대한 보존한다.
  let local = ensureMonthSync(deepClone(monthCache[ym]), ym);
  for(let attempt=0; attempt<4; attempt++){
    const {data:rows,error:readErr} = await sbClient.from('study_months')
      .select('data,updated_at').eq('user_id',cloudUser.id).eq('ym',ym).limit(1);
    if(readErr){ console.error('클라우드 저장 전 읽기 실패:', readErr); return; }
    const row = rows && rows[0];
    const merged = mergeMonths(local, row?.data || {}, ym);
    const nowIso = new Date(serverNowMs()).toISOString();
    let writeOk=false;
    if(row){
      let q = sbClient.from('study_months').update({data:merged,updated_at:nowIso})
        .eq('user_id',cloudUser.id).eq('ym',ym);
      if(row.updated_at) q = q.eq('updated_at', row.updated_at);
      const {data:w,error:wErr} = await q.select('updated_at');
      if(!wErr && w && w.length){ writeOk=true; }
      else if(wErr) console.warn('동기화 충돌 재시도:', wErr.message);
    }else{
      const {error:iErr} = await sbClient.from('study_months').insert({user_id:cloudUser.id,ym,data:merged,updated_at:nowIso});
      if(!iErr) writeOk=true;
      else console.warn('동기화 신규 저장 재시도:', iErr.message);
    }
    if(writeOk){
      monthCache[ym]=merged;
      localStorage.setItem(`month:${ym}`,JSON.stringify(merged));
      return;
    }
    await new Promise(r=>setTimeout(r,120*(attempt+1)));
  }
  console.error('클라우드 저장 충돌을 해결하지 못했습니다:', ym);
  showToast('동기화 충돌이 있어 잠시 후 다시 저장해 주세요');
}

async function autoSyncFromCloud(){
  if(!sbClient || !cloudUser) return;
  const {data,error} = await sbClient.from('study_months').select('ym,data').order('ym');
  if(error){ console.error('자동 동기화 불러오기 실패:', error); return; }
  if(!data || data.length===0) return;
  const needsPush=[];
  for(const row of data){
    const ym=row.ym;
    let local={};
    try{ local=JSON.parse(localStorage.getItem(`month:${ym}`)||'{}'); }catch(e){}
    const remoteNorm=ensureMonthSync(deepClone(row.data||{}),ym);
    const merged=mergeMonths(local,remoteNorm,ym);
    localStorage.setItem(`month:${ym}`,JSON.stringify(merged));
    monthCache[ym]=merged;
    if(!jsonSame(merged,remoteNorm)) needsPush.push(ym);
  }
  // 이 기기에만 있던 변경도 다시 클라우드에 병합해 다른 기기에서 받을 수 있게 한다.

  await renderCurrentView();
}

let activeTimerSyncBusy = false;
let activeTimerLastFingerprint = '';
let activeTimerRealtimeChannel = null;

function activeTimerRowFingerprint(row){

}

function findPeriodForActiveTimer(row){
  if(!row) return null;
  const ym = String(row.ym || '');
  const dk = String(row.day_key || '');
  const month = monthCache[ym];
  const day = month && month[dk];
  if(!day || !Array.isArray(day.periods)) return null;

  let idx = day.periods.findIndex(p => String(p._id || '') === String(row.period_id || ''));
  if(idx < 0){
    const fallback = Number(row.period_index);
    if(Number.isInteger(fallback) && day.periods[fallback]) idx = fallback;
  }
  if(idx < 0) return null;
  return {ym, dk, day, p:day.periods[idx], idx};
}

async function applyActiveTimerRow(row){
  if(!row) return false;

  let found = findPeriodForActiveTimer(row);

  // 다른 기기에서 막 만든 교시는 active_timer가 study_months보다 먼저 도착할 수 있다.
  // 그 경우 월 데이터를 한 번 동기화한 뒤 다시 찾는다.
  if(!found){
    await autoSyncFromCloud();
    found = findPeriodForActiveTimer(row);
  }
  if(!found) return false;

  const started = Date.parse(row.started_at);
  const stopped = row.stopped_at ? Date.parse(row.stopped_at) : NaN;
  if(!Number.isFinite(started)) return false;

  found.p.timerStartedAt = started;
  found.p.timerEndedAt =
    row.status === 'stopped' && Number.isFinite(stopped) ? stopped : null;

  localStorage.setItem(`month:${found.ym}`, JSON.stringify(monthCache[found.ym]));

  if(ymKey(cur) === found.ym && dKey(cur) === found.dk){
    await renderCurrentView();
  }else{
    updateStudyTimer();
  }
  syncAndroidTimer();
  return true;
}

async function syncActiveTimerFromCloud(force=false){
  if(activeTimerSyncBusy || !sbClient || !cloudUser) return;
  activeTimerSyncBusy = true;

  try{
    const {data,error} = await sbClient
      .from('active_timer')
      .select('*')
      .eq('user_id',cloudUser.id)
      .maybeSingle();

    if(error) throw error;

    const fp = activeTimerRowFingerprint(data);
    if(!force && fp === activeTimerLastFingerprint) return;

    if(data){
      const applied = await applyActiveTimerRow(data);
      // period가 아직 클라우드 월 데이터에 안 올라온 경우 다음 2초 poll에서 다시 시도한다.
      if(applied) activeTimerLastFingerprint = fp;
    }else{
      const previouslyHadTimer = !!activeTimerLastFingerprint;
      activeTimerLastFingerprint = '';
      if(previouslyHadTimer){
        await autoSyncFromCloud();
        updateStudyTimer();
        syncAndroidTimer();
      }
    }
  }catch(e){
    console.warn('서버 타이머 동기화 실패:', e);
  }finally{
    activeTimerSyncBusy = false;
  }
}

// Realtime이 활성화된 프로젝트에서는 즉시 반영.
// 비활성 상태여도 2초 polling이 항상 동작한다.
function startActiveTimerRealtime(){
  if(!sbClient || !cloudUser || activeTimerRealtimeChannel) return;
  try{
    activeTimerRealtimeChannel = sbClient
      .channel(`gongbujang-active-${cloudUser.id}`)
      .on(
        'postgres_changes',
        {event:'*',schema:'public',table:'active_timer',filter:`user_id=eq.${cloudUser.id}`},
        ()=>syncActiveTimerFromCloud(true)
      )
      .subscribe();
  }catch(e){
    activeTimerRealtimeChannel = null;
  }
}

function stopActiveTimerRealtime(){
  if(activeTimerRealtimeChannel && sbClient){
    try{ sbClient.removeChannel(activeTimerRealtimeChannel); }catch(e){}
  }
  activeTimerRealtimeChannel = null;
}

function collectBackupData(){
  const months = {};
  for(let i=0; i<localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith('month:')){
      try{ months[key.slice(6)] = JSON.parse(localStorage.getItem(key)); }

    }
  }
  return {
    app: 'study-log',
    version: 1,
    exportedAt: new Date().toISOString(),
    settings: appSettings,
    months
  };
}

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `study-log-backup-${ymd(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
showToast('백업 파일을 저장했어요');
};

$('#restoreData').onclick = () => $('#restoreFile').click();

$('#restoreFile').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const parsed = JSON.parse(await file.text());
    if(!parsed || parsed.app !== 'study-log' || !parsed.months || typeof parsed.months !== 'object'){
      throw new Error('invalid backup');
    }
    if(!confirm('백업 데이터를 복원하면 현재 공부 기록이 백업 내용으로 교체됩니다. 계속할까요?')){
      e.target.value = '';
      return;
    }
    const keysToRemove = [];
    for(let i=0; i<localStorage.length; i++){
      const key = localStorage.key(i);
      if(key && key.startsWith('month:')) keysToRemove.push(key);
    }
    keysToRemove.forEach(key => localStorage.removeItem(key));
    Object.entries(parsed.months).forEach(([ym, data]) => {
      if(/^\d{4}-\d{2}$/.test(ym)){
        localStorage.setItem(`month:${ym}`, JSON.stringify(data || {}));
      }
    });
    if(parsed.settings && typeof parsed.settings === 'object'){
      const h = Number(parsed.settings.dayStartHour);
      const w = Number(parsed.settings.weekStartDay);
      if(Number.isInteger(h) && h >= 0 && h <= 11 && Number.isInteger(w) && w >= 0 && w <= 6){
        let pendingDayStart = null;
        const p = parsed.settings.pendingDayStart;
        if(p && Number.isInteger(Number(p.hour)) && Number(p.hour) >= 0 && Number(p.hour) <= 11 && p.effectiveAt && !isNaN(new Date(p.effectiveAt).getTime())){
          pendingDayStart = {hour:Number(p.hour), effectiveAt:String(p.effectiveAt)};
        }
        appSettings = {dayStartHour:h, weekStartDay:w, pendingDayStart};
        saveSettings();
        maybeActivatePending();
      }
    }
    monthCache = {};
    await renderDay();
    showToast('백업 데이터를 복원했어요');
  }catch(err){
    alert('올바른 공부장 백업 파일이 아니에요.');
  }finally{
    e.target.value = '';
  }
});
renderDay();
</script>

  });
}
</script>
