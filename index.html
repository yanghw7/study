<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기록장</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#f5f7f6}
.shell{height:100dvh;display:flex;flex-direction:column}
.tabs{
  flex:0 0 56px;height:56px;display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:6px;padding:7px 8px;background:#f7f9f8;border-bottom:1px solid #dde5e1;
  position:sticky;top:0;z-index:999;
}
.tabs button{min-width:0;border:0;border-radius:12px;font-weight:900;font-size:14px;background:#e8eeeb;color:#53615c;padding:0 5px;white-space:nowrap}
.tabs button.active.study{background:#285f50;color:#fff}
.tabs button.active.lecture{background:#67538b;color:#fff}
.tabs button.active.sleep{background:#456d96;color:#fff}
.frame{display:none;flex:1 1 auto;width:100%;min-height:0;border:0;background:#fff}
.frame.active{display:block}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#285f50">
<link rel="icon" href="./icon-192.png">
</head>
<body>
<div class="shell" id="shell">
  <div class="tabs">
    <button id="studyTab" class="active study">📚 공부장</button>
    <button id="lectureTab" class="lecture">🎓 강의기록</button>
    <button id="sleepTab" class="sleep">🌙 수면장</button>
  </div>
  <iframe id="studyFrame" class="frame active" src="study.html"></iframe>
  <iframe id="lectureFrame" class="frame" data-src="lecture.html"></iframe>
  <iframe id="sleepFrame" class="frame" data-src="sleep.html"></iframe>
</div>
<script>
const shell=document.getElementById('shell');
const tabs={
 study:{button:document.getElementById('studyTab'),frame:document.getElementById('studyFrame')},
 lecture:{button:document.getElementById('lectureTab'),frame:document.getElementById('lectureFrame')},
 sleep:{button:document.getElementById('sleepTab'),frame:document.getElementById('sleepFrame')}
};

function openTab(which){
  Object.entries(tabs).forEach(([key,item])=>{
    const active=key===which;
    item.button.classList.toggle('active',active);
    item.frame.classList.toggle('active',active);
    if(active && !item.frame.getAttribute('src') && item.frame.dataset.src){
      item.frame.src=item.frame.dataset.src;
    }
  });
  try{localStorage.setItem('journal:lastTab',which)}catch(e){}
}
Object.entries(tabs).forEach(([key,item])=>item.button.onclick=()=>openTab(key));
let first='study';
try{const saved=localStorage.getItem('journal:lastTab');if(saved&&tabs[saved])first=saved}catch(e){}
openTab(first);
</script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body>
</html>
